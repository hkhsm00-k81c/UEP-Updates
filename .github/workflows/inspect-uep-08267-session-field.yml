name: Inspect UEP 0.82.67 session field
on:
  push:
    paths:
      - 'inspect-08267-session-field.trigger'
jobs:
  inspect:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v0.82.67 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip app -Force
          $d='app/resources/app/electron/google-data.cjs'
          $out='inspect-08267-session-field.txt'
          Select-String -Path $d -Pattern 'sessionNo|sessionNumber|차시번호|차시|sessionId' -Context 3,8 | Select-Object -First 140 | Out-String | Set-Content $out -Encoding UTF8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $out
          git commit -m 'inspect: 0.82.67 session field'
          git pull --rebase origin main
          git push

name: Inspect UEP 0.82.69 Night Attendance
on:
  push:
    paths:
      - 'inspect-night-attendance-08269.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.69 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw "release download failed: $LASTEXITCODE"}
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          $out='inspection-night-attendance-08269.txt'
          "UEP v0.82.69 night attendance inspection" | Set-Content $out -Encoding utf8
          function Extract([string]$file,[string[]]$patterns,[int]$before=20,[int]$after=60){
            Add-Content $out "`n===== FILE: $file ====="
            $lines=Get-Content $file
            foreach($p in $patterns){
              Add-Content $out "`n--- PATTERN: $p ---"
              $hits=Select-String -Path $file -Pattern $p -SimpleMatch
              if(-not $hits){ Add-Content $out '(no match)'; continue }
              foreach($hit in $hits){
                $s=[Math]::Max(0,$hit.LineNumber-1-$before)
                $e=[Math]::Min($lines.Count-1,$hit.LineNumber-1+$after)
                Add-Content $out "[match line $($hit.LineNumber)]"
                for($i=$s;$i -le $e;$i++){ Add-Content $out (("{0,7}: {1}" -f ($i+1),$lines[$i])) }
              }
            }
          }
          Extract "$root/gyomuon.js" @(
            'function nightRecordIsAttendance',
            'function attendanceStudentKey',
            'function nightSlotName',
            'function afterSchoolProgramGroups',
            'readonlyCache?.afterSchoolAttendance',
            'readonlyCache.afterSchoolAttendance',
            '자습인원 보기',
            '오후자습',
            '야자1',
            '야자2'
          ) 18 55
          Extract "$root/electron/google-data.cjs" @(
            '30_야자출결_정규화',
            'afterSchoolAttendance',
            '최종여부',
            '출결상태',
            '제출일시',
            '시간대'
          ) 25 80
          Add-Content $out "`n===== END ====="
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $out
          git commit -m 'Inspect v0.82.69 night attendance runtime'
          if($LASTEXITCODE -ne 0){throw "inspection commit failed: $LASTEXITCODE"}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw "inspection pull failed: $LASTEXITCODE"}
          git push
          if($LASTEXITCODE -ne 0){throw "inspection push failed: $LASTEXITCODE"}

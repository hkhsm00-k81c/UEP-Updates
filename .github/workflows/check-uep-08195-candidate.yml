name: Check UEP 0.81.95 selection candidate
on:
  push:
    branches:
      - candidate/0.81.95-selection-normalizer
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check patch syntax
        run: |
          node --check scripts/patch-uep-08195-selection-normalizer.js
          node --check scripts/patch-uep-08195-selection-output.js
          node --check scripts/verify-uep-08195-selection-normalizer.js

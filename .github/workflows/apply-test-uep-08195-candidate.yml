name: Apply-test UEP 0.81.95 selection candidate
on:
  push:
    branches:
      - candidate/0.81.95-selection-normalizer
  workflow_dispatch:
jobs:
  apply-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download official 0.81.94 package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.94/UEP-update.zip' -OutFile 'UEP-update-0.81.94.zip'
          Expand-Archive -Path 'UEP-update-0.81.94.zip' -DestinationPath 'unpacked' -Force
          $gy = Get-ChildItem -Path 'unpacked' -Recurse -Filter 'gyomuon.js' | Where-Object { $_.FullName -match 'resources[\\/]app[\\/]gyomuon\.js$' } | Select-Object -First 1
          if (-not $gy) { throw 'resources/app/gyomuon.js not found in official package' }
          $appDir = Split-Path $gy.FullName -Parent
          $resourcesDir = Split-Path $appDir -Parent
          $root = Split-Path $resourcesDir -Parent
          "UEP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "UEP root: $root"
      - name: Apply 0.81.95 candidate patches
        shell: pwsh
        run: |
          node scripts/patch-uep-08195-selection-normalizer.js "$env:UEP_ROOT"
          node scripts/patch-uep-08195-selection-output.js "$env:UEP_ROOT"
          node scripts/patch-uep-08195-selection-finalize.js "$env:UEP_ROOT"
          node scripts/patch-uep-08195-selection-finalize-writefix.js "$env:UEP_ROOT"
      - name: Verify candidate
        shell: pwsh
        run: node scripts/verify-uep-08195-selection-normalizer.js "$env:UEP_ROOT"

name: Inspect UEP 0.82.76 Roster Range Grep
on:
  push:
    paths: ['inspect-08276-roster-range-grep.trigger']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.76 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $hits=Get-ChildItem app/resources/app -Recurse -File | Where-Object {$_.Extension -in '.js','.cjs','.json'} | Select-String -Pattern '13_출석부|12_차시일정|11_방과후학교'
          $out=$hits | ForEach-Object {"$($_.Path):$($_.LineNumber): $($_.Line)"}
          [IO.File]::WriteAllText((Join-Path $PWD 'inspection-08276-roster-range-grep.txt'),($out -join "`r`n"),(New-Object Text.UTF8Encoding($false)))
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add inspection-08276-roster-range-grep.txt;git commit -m 'Inspect UEP 0.82.76 roster ranges';if($LASTEXITCODE -ne 0){throw 'commit failed'};git pull --rebase origin main;if($LASTEXITCODE -ne 0){throw 'pull failed'};git push;if($LASTEXITCODE -ne 0){throw 'push failed'}

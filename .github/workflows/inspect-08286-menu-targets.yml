name: Inspect UEP 0.82.86 Menu Targets
on:
  push:
    paths:
      - 'inspect-08286-menu-targets.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.82.86 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,audit|Out-Null
          gh release download v0.82.86 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'v0.82.86 download failed'}
          Expand-Archive source/UEP-update.zip app -Force
      - name: Build narrow source report
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $idx='app/resources/app/index.html'
          $js='app/resources/app/gyomuon.js'
          if(!(Test-Path $idx) -or !(Test-Path $js)){throw 'required app source missing'}
          $report='audit/uep-08286-menu-targets.txt'
          $i=Get-Content $idx; $g=Get-Content $js
          "UEP v0.82.86 exact source snippets`r`n" | Set-Content $report -Encoding UTF8
          "===== index.html lines 55-110 =====" | Add-Content $report
          for($n=55;$n -le [Math]::Min(110,$i.Count);$n++){ "{0,5}: {1}" -f $n,$i[$n-1] | Add-Content $report }
          "`r`n===== gyomuon.js lines 320-490 =====" | Add-Content $report
          for($n=320;$n -le [Math]::Min(490,$g.Count);$n++){ "{0,5}: {1}" -f $n,$g[$n-1] | Add-Content $report }
          "`r`n===== gyomuon.js lines 1228-1340 =====" | Add-Content $report
          for($n=1228;$n -le [Math]::Min(1340,$g.Count);$n++){ "{0,5}: {1}" -f $n,$g[$n-1] | Add-Content $report }
          "`r`n===== VERSION MATCHES =====" | Add-Content $report
          Select-String -Path $idx,$js,'app/resources/app/package.json' -Pattern 'APP_VERSION','0.82.86','version' -SimpleMatch -ErrorAction SilentlyContinue | Select-Object -First 100 | ForEach-Object { "{0}:{1}: {2}" -f (Split-Path $_.Path -Leaf),$_.LineNumber,$_.Line } | Add-Content $report
      - name: Commit narrow report
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/uep-08286-menu-targets.txt
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){ Write-Host 'No report changes'; exit 0 }
          git commit -m 'Narrow UEP 0.82.86 menu source inspection'
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'git push failed'}
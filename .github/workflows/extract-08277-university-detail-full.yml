name: Extract UEP 0.82.77 University Detail Full
on:
  push:
    paths:
      - 'extract-08277-university-detail-full.trigger'
permissions:
  contents: write
jobs:
  extract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.77 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $txt=Get-Content 'app/resources/app/gyomuon.js' -Raw
          $start=$txt.IndexOf('function openDashboardUniversityDetail(')
          $end=$txt.IndexOf("`nfunction dashboardStudentStatusCompactMarkup",$start)
          if($start-lt 0 -or $end-lt 0){throw 'boundaries missing'}
          $txt.Substring($start,$end-$start) | Set-Content inspection-08277-university-detail-full.txt -Encoding utf8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-08277-university-detail-full.txt
          git commit -m 'Extract full UEP 0.82.77 university detail renderer'
          if($LASTEXITCODE-ne 0){throw 'commit failed'}
          git pull --rebase origin main
          if($LASTEXITCODE-ne 0){throw 'pull failed'}
          git push
          if($LASTEXITCODE-ne 0){throw 'push failed'}

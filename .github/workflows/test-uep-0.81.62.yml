name: Test UEP 0.81.62 Live Fixes
'on':
  push:
    branches: [main]
    paths: [test-uep-0.81.62.trigger]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.61
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.61 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $z=Get-ChildItem source -File -Filter '*.zip'|Select-Object -First 1;if(!$z){throw '0.81.61 zip missing'};Expand-Archive $z.FullName app -Force
      - name: Patch and validate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';node scripts/patch-uep-0.81.62.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/google-data.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.62";','__UEP_08162_CURRICULUM_BINDINGS__','__UEP_08162_OFFICIAL_SINGLE_DATE_SOURCE__','__UEP_08162_DIRECT_NOTICE_CONFIRM_REQUIRED__','__UEP_08162_EXISTING_NOTICE_CONFIRM_GATE__','__UEP_08162_NOTICE_RECEIPT_REFRESH__')){if(!$g.Contains($x)){throw "marker missing: $x"}}
          foreach($x in @("$$('[data-curriculum-workspace]').forEach","$$('[data-cross-student]').forEach","$$('[data-curriculum-subject]').forEach")){if(!$g.Contains($x)){throw "collection binding missing: $x"}}
          $canonical=[regex]::Matches($g,'officialAttendanceRowsForDate08162\(').Count;if($canonical -lt 5){throw "official date helper not shared enough: $canonical"}
          if(!$g.Contains('confirmRequired:true')){throw 'direct notice confirm requirement missing'}
          if(!$g.Contains('refreshReadonlyAfterNotice({force:true})')){throw 'notice receipt forced refresh missing'}

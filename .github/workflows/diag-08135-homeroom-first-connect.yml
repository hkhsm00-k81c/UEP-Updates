name: Diagnose 0.81.35 Homeroom First Google Connection

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: [diag-08135-homeroom-first-connect.trigger]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace shipped 0.81.35 first-connect path
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item source,app -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force source,app,diagnostics | Out-Null
          gh release download v0.81.35 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $gy = Get-ChildItem app -Recurse -File -Filter gyomuon.js | Select-Object -First 1
          if(!$gy){ throw 'gyomuon.js not found in shipped 0.81.35 ZIP' }
          $appRoot = Split-Path $gy.DirectoryName -Parent
          $out='diagnostics/08135-homeroom-first-connect.txt'
          "UEP 0.81.35 HOMEROOM FIRST GOOGLE CONNECTION TRACE`nAPP_ROOT=$appRoot`nGYOMUON=$($gy.FullName)`n" | Set-Content $out -Encoding UTF8
          $files = Get-ChildItem $appRoot -Recurse -File | Where-Object { $_.Name -in @('main.js','preload.js','gyomuon.js','package.json') }
          $terms=@('schoolReadSessionStatus','previewReadonlySync','readReadonlyCache','Google 연결 인증','Google 연결','google-service-account','service-account','credential','authenticated','schoolRead','readonly','session','safeStorage','userData','homeroom','담임','ipcMain','ipcRenderer','contextBridge')
          foreach($fi in $files){
            "`n===== $($fi.FullName) =====" | Add-Content $out -Encoding UTF8
            $lines=Get-Content $fi.FullName -Encoding UTF8
            for($i=0;$i -lt $lines.Count;$i++){
              $hit=$false
              foreach($t in $terms){if($lines[$i] -like "*$t*"){$hit=$true;break}}
              if($hit){
                $a=[Math]::Max(0,$i-8);$b=[Math]::Min($lines.Count-1,$i+16)
                for($j=$a;$j -le $b;$j++){('{0,6}: {1}' -f ($j+1),$lines[$j]) | Add-Content $out -Encoding UTF8}
                '------' | Add-Content $out -Encoding UTF8
              }
            }
          }
          if((Get-Item $out).Length -lt 500){ throw "trace unexpectedly small: $((Get-Item $out).Length) bytes" }
          Write-Host "TRACE_BYTES=$((Get-Item $out).Length)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f $out
          if(-not (git diff --cached --quiet)){ git commit -m 'diag: capture 0.81.35 homeroom first-connect path'; git push }

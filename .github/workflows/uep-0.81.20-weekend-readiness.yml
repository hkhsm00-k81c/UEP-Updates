name: UEP 0.81.20 Weekend Readiness

on:
  push:
    branches: [fix/0.81.20-school-read-api]
    paths:
      - .github/workflows/uep-0.81.20-weekend-readiness.yml
      - scripts/build-update-0.81.20.ps1
      - tools/apply-school-read-api-0.81.20.js
      - tools/harden-school-read-auth-gate-0.81.20.js
      - tools/normalize-readonly-auth-0.81.20.js
      - uep-policy.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify production policy is still pinned to 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if([string]$policy.latestVersion -ne '0.81.18'){throw 'production auto-update was unexpectedly advanced'}
          if([string]$policy.schoolReadApiUrl -notmatch '^https://script\.google\.com/macros/s/[^/]+/exec(?:\?.*)?$'){throw 'School Read API endpoint missing'}
          Write-Host 'Production remains on 0.81.18 while 0.81.20 is validated.'

      - name: Probe School Read API without browser OAuth
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $payload=@{action='login';name='UEP_WEEKEND_INVALID_USER';email='uep-weekend-invalid@example.invalid';deviceId='UEP-WEEKEND-READINESS'} | ConvertTo-Json -Compress
          $resp=Invoke-WebRequest -UseBasicParsing -Uri ([string]$policy.schoolReadApiUrl) -Method Post -ContentType 'application/json; charset=utf-8' -Body $payload -TimeoutSec 20
          if($resp.StatusCode -ne 200){throw "School Read API HTTP $($resp.StatusCode)"}
          $body=[string]$resp.Content
          if($body -match '<html|accounts\.google\.com|oauth'){throw 'School Read API redirected to Google/browser OAuth'}
          $json=$body | ConvertFrom-Json
          if($null -eq $json.ok){throw 'School Read API did not return JSON API response'}

      - name: Download shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Reconstruct through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object {
            $version='0.81.{0:d2}' -f $_
            & "scripts/build-update-$version.ps1"
            if($LASTEXITCODE-ne 0){throw "reconstruct failed: $version"}
          }

      - name: Apply verified 0.81.19 cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patches=@(
            'tools/apply-performance1-0.81.19.js',
            'tools/apply-performance2-0.81.19.js',
            'tools/apply-dashboardview-memoization-0.81.19.js',
            'tools/apply-dashboardview-sort-rank-0.81.19.js',
            'tools/apply-dashboard-calendar-mode-cache-0.81.19.js',
            'tools/apply-openstudentdrawer-summary-pass-0.81.19.js',
            'tools/apply-openstudentdrawer-status-pass-0.81.19.js',
            'tools/apply-openstudentdrawer-after-index-0.81.19.js'
          )
          foreach($p in $patches){node $p app;if($LASTEXITCODE-ne 0){throw "0.81.19 patch failed: $p"}}

      - name: Build hardened 0.81.20
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/build-update-0.81.20.ps1
          if($LASTEXITCODE-ne 0){throw '0.81.20 build failed'}

      - name: Remove local Google credentials and assert homeroom path
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path app -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'google-service-account|oauth|refresh-token|credential.*\.bin' } |
            Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          $p=Get-Content app/resources/app/electron/preload.cjs -Raw -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $gd=Get-Content app/resources/app/electron/google-data.cjs -Raw -Encoding UTF8
          $checks=[ordered]@{
            version=$g.Contains('const APP_VERSION = "0.81.20";')
            schoolReadPrimary=$m.Contains('__UEP_SCHOOL_READ_API_PRIMARY_08120__')
            deviceId=$m.Contains('getOrCreateSchoolReadDeviceId')
            encryptedSession=$m.Contains('uep-school-read-session.bin')
            login=$m.Contains('uep:schoolReadLogin') -and $p.Contains('schoolReadLogin:') -and $g.Contains('window.schoolBoard.schoolReadLogin({name,email})')
            verify=$m.Contains('uep:schoolReadSessionStatus') -and $g.Contains('schoolReadSessionStatus({verify:true})')
            logout=$m.Contains('uep:schoolReadLogout') -and $p.Contains('schoolReadLogout:')
            batchRead=$m.Contains('schoolReadBatchRead(spreadsheetId,ranges)')
            noRememberBypass=(-not $g.Contains('if(state?.auth?.rememberUser&&state?.auth?.user){hideUserAuthGate();authSessionReady=true;state.auth.locked=false;}'))
            noReadonlyOAuthFallback=(-not ($m -match 'getReadonlySheetsAuth[\s\S]{0,1800}readGoogleUserOAuth'))
            noReadonlyServiceFallback=(-not ($m -match 'getReadonlySheetsAuth[\s\S]{0,1800}readEncrypted\(credentialPath\(\)\)'))
            single06=$gd.Contains('"06_선택과목이력"') -and (-not $gd.Contains('06A_학생별선택과목'))
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host ("WEEKEND READY {0} = {1}" -f $_.Key,$_.Value)}
          if($checks.Values-contains $false){throw 'Weekend readiness gate failed'}
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/preload.cjs
          node --check app/resources/app/electron/google-data.cjs

      - name: Build sealed weekend test package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path app/* -DestinationPath UEP-0.81.20-weekend-test.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-0.81.20-weekend-test.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content UEP-0.81.20-weekend-test.sha256 $sha -Encoding ascii
          New-Item -ItemType Directory -Force audit-output | Out-Null
          @(
            'UEP 0.81.20 WEEKEND READINESS: PASS',
            "commit=$env:GITHUB_SHA",
            "sha256=$sha",
            'production_latest=0.81.18',
            'auto_update_advanced=false',
            'homeroom_google_account_required=false',
            'homeroom_local_service_account_required=false',
            'remaining_live_test=real approved homeroom device/login on school PC'
          ) | Set-Content audit-output/0.81.20-weekend-readiness.txt -Encoding UTF8

      - name: Publish prerelease v0.81.20-rc2 after readiness pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.20-rc2'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target 'fix/0.81.20-school-read-api' --title 'UEP 0.81.20 RC2 - Homeroom No-Google Ready' --notes '주말 사전검증판입니다. 담임 개인 Google OAuth 및 로컬 서비스계정 없이 UEP 로그인 → 기기승인 → UEP Token → School Read API → batch-read 경로를 검증했습니다. 운영 자동업데이트는 계속 0.81.18로 유지됩니다. 실제 학교 담임 PC 1대의 승인/로그인 확인 후 정식 승격합니다.' --prerelease
          }
          Copy-Item UEP-0.81.20-weekend-test.zip UEP-update.zip
          Copy-Item UEP-0.81.20-weekend-test.sha256 UEP-update.sha256
          gh release upload $tag UEP-update.zip UEP-update.sha256 audit-output/0.81.20-weekend-readiness.txt --repo $env:GITHUB_REPOSITORY --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.20-Weekend-Test
          path: |
            UEP-0.81.20-weekend-test.zip
            UEP-0.81.20-weekend-test.sha256
            audit-output/0.81.20-weekend-readiness.txt

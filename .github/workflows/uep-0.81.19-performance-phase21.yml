name: UEP 0.81.19 Performance Phase21
on:
  push:
    branches: [audit/0.81.19-performance-phase21]
    paths:
      - tools/apply-openstudentdrawer-status-pass-0.81.19.js
      - .github/workflows/uep-0.81.19-performance-phase21.yml
  workflow_dispatch:
jobs:
  verify-openstudentdrawer-status:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified 0.81.19 performance patches through Phase20
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node ./tools/apply-performance1-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase1 failed'}
          node ./tools/apply-performance2-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase2 failed'}
          node ./tools/apply-dashboardview-memoization-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase13 failed'}
          node ./tools/apply-dashboardview-sort-rank-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase14 failed'}
          node ./tools/apply-dashboard-calendar-mode-cache-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase16 failed'}
          node ./tools/apply-openstudentdrawer-summary-pass-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase20 failed'}
      - name: Apply Phase21 attendance status optimization
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node ./tools/apply-openstudentdrawer-status-pass-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase21 applicator failed'}
          node --check app/resources/app/gyomuon.js
      - name: Verify repeated status scans are removed
        shell: pwsh
        run: |
          $text=Get-Content app/resources/app/gyomuon.js -Raw
          if($text -match 'statuses\.filter\(x=>/출석\|지각\|공결\|인정\|정상\|입실/\.test\(x\)\)\.length'){throw 'attended filter remains'}
          if($text -match 'statuses\.filter\(x=>/결석\|미입실\|불참\|취소/\.test\(x\)\)\.length'){throw 'absent filter remains'}
          if($text -notmatch 'for\(const status of statuses\)'){throw 'single-pass status loop missing'}
          Write-Host 'openStudentDrawer attendance single-pass optimization verified'

name: UEP 0.81.19 Performance Phase7

on:
  push:
    branches: [audit/0.81.19-performance]
    paths:
      - tools/apply-performance2-0.81.19.js
      - .github/workflows/uep-0.81.19-performance-phase7.yml
  workflow_dispatch:

jobs:
  verify-readonly-visibility-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified phase1
        shell: pwsh
        run: |
          node ./tools/apply-performance1-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase1 applicator failed'}
      - name: Apply readonly visibility guard
        shell: pwsh
        run: |
          node ./tools/apply-performance2-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase2 applicator failed'}
      - name: Verify safety and behavior anchors
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          node --check 'app/resources/app/gyomuon.js'
          $checks=[ordered]@{
            visibilityGuard=$g.Contains('if(document.hidden) return;')
            readonlyRefresh=$g.Contains('refreshReadonlyCacheSilently({force:true,rerender:true})')
            timerClear=$g.Contains('if(readonlyAutoRefreshTimer) clearInterval(readonlyAutoRefreshTimer)')
            bindPage=$g.Contains('function bindPage(')
            bindInputCenter=$g.Contains('function bindInputCenter(')
            selection=$g.Contains('function bindSelectionAnalysis(')
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host ("CHECK {0} = {1}" -f $_.Key,$_.Value)}
          if($checks.Values-contains $false){throw 'Phase7 safety verification failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.19-Performance-Phase7
          path: app/resources/app/gyomuon.js

name: UEP CSS Cleanup Phase 3 Audit

on:
  push:
    branches:
      - cleanup/codebase-phase1-20260822
    paths:
      - tools/css-cleanup-phase3-audit.js
      - .github/workflows/uep-css-cleanup-phase3-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase3-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,cleanup-phase3-output,tmp-p1,tmp-p2 | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Reconstruct runtime through 0.81.16
        shell: pwsh
        run: |
          $scripts=Get-ChildItem scripts/build-update-*.ps1 | ForEach-Object {
            if($_.BaseName -match 'build-update-(\d+)\.(\d+)\.(\d+)'){
              [pscustomobject]@{File=$_.FullName;Major=[int]$matches[1];Minor=[int]$matches[2];Patch=[int]$matches[3]}
            }
          } | Sort-Object Major,Minor,Patch
          foreach($s in $scripts){if($s.Major -eq 0 -and $s.Minor -eq 81 -and $s.Patch -ge 2 -and $s.Patch -le 16){ & $s.File }}

      - name: Apply CSS cleanup phases 1 and 2
        shell: pwsh
        run: |
          node ./tools/css-cleanup-phase1.js app tmp-p1
          node ./tools/css-cleanup-phase2.js app tmp-p2

      - name: Run phase3 structural safety audit
        shell: pwsh
        run: node ./tools/css-cleanup-phase3-audit.js app cleanup-phase3-output

      - name: Show report
        shell: pwsh
        run: Get-Content cleanup-phase3-output/CSS-CLEANUP-PHASE3-AUDIT.md -Encoding UTF8

      - name: Persist phase3 results
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cleanup-phase3-output
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "Store CSS cleanup phase3 audit results"
            git push origin HEAD:cleanup/codebase-phase1-20260822
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UEP-CSS-CLEANUP-PHASE3-AUDIT
          path: cleanup-phase3-output/

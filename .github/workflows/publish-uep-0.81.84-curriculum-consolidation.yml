name: Publish UEP 0.81.84 Curriculum Consolidation
on:
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.84.trigger
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.84
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 0.81.83 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,work,verify | Out-Null
          gh release download v0.81.83 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip work -Force
          if(!(Test-Path work/UEP.exe)){throw '0.81.83 baseline UEP.exe missing'}
      - name: Apply consolidated 0.81.84 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08184-curriculum-consolidation.js
          node scripts/patch-uep-08184-curriculum-consolidation.js work
          node --check work/resources/app/gyomuon.js
          $pkg=Get-Content work/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.84'){throw 'package version mismatch'}
          $g=Get-Content work/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('const APP_VERSION = "0.81.84";','UEP_08184_CURRICULUM_CONSOLIDATION_START','uep-error-grade-scope-08184','uep-roster-08184')){if(!$g.Contains($m)){throw "marker missing: $m"}}
          foreach($old in @('UEP_08181_SELECTION_ROSTER_ERROR_NOTICE_START','UEP_08182_CURRICULUM_ROSTER_ERROR_UI_START','UEP_08183_CURRICULUM_UI_STABILITY_START')){if($g.Contains($old)){throw "old runtime patch still present: $old"}}
      - name: Package and reopen verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path work/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.84'){throw 'reopened package version mismatch'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish release and promote update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $notes=@'
          UEP 0.81.84 교육과정 화면 통합 안정화

          - 0.81.81~0.81.83의 중첩된 교육과정 UI 보완 코드를 제거하고 단일 구조로 통합
          - 교육과정 학생신청 전체 목록 표시 복구 및 학년별 오류학생 카드 실제 조회 연동
          - 2학년 / 3학년 / 2·3학년 오류학생과 전체반·1~9반 필터 조합 유지
          - 오류종류에 2학년·3학년 정상/실제 오류유형 표시
          - 2-2·3-1 과학 신청명단을 8개 고정 칼럼 구조로 정리
          - 동일학기 다른 과학선택과 교차학기 과학선택의 과목명·예상등급 전체 표시
          '@
          $notes|Set-Content release-notes.md -Encoding UTF8
          gh release view v0.81.84 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){throw 'v0.81.84 release already exists'}
          $global:LASTEXITCODE=0
          gh release create v0.81.84 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP v0.81.84 교육과정 화면 통합 안정화' --notes-file release-notes.md
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.84/UEP-update.zip'
          $message='UEP 0.81.84 교육과정 학생목록·오류학생 조회·과학 신청명단 통합 안정화'
          function PutJson($path,$obj){$tmp=Join-Path $env:RUNNER_TEMP ($path-replace'/','_');$obj|ConvertTo-Json -Depth 50|Set-Content $tmp -Encoding UTF8;$sha=(gh api "repos/${env:GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha);$b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($tmp));@{message="release: promote $path to UEP 0.81.84";content=$b64;sha=$sha;branch='main'}|ConvertTo-Json|gh api --method PUT "repos/${env:GITHUB_REPOSITORY}/contents/${path}" --input -|Out-Null}
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json;$policy.latestVersion='0.81.84';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message=$message;$policy.forceUpdate=$false;PutJson 'uep-policy.json' $policy
          $manifest=[ordered]@{version='0.81.84';channel='stable';downloadUrl=$url;notes=$message;sha256=$env:UEP_SHA256};PutJson 'uep-update.json' $manifest;PutJson 'uep-version.json' $manifest
          $legacy=[ordered]@{latestVersion='0.81.84';downloadUrl=$url;sha256=$env:UEP_SHA256;forceUpdate=$false;message=$message};PutJson 'policy.json' $legacy

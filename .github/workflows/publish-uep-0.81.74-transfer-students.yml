name: Publish UEP 0.81.74 Transfer Students
'on':
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.74-transfer-students.trigger
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.74-transfer-students
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.73 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force app,verify | Out-Null
          gh release download v0.81.73 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip app -Force
          if(!(Test-Path app/UEP.exe)){throw '0.81.73 baseline UEP.exe missing'}
      - name: Apply transfer student patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node --check scripts/patch-uep-0.81.74-transfer-students.js
          if($LASTEXITCODE -ne 0){throw '0.81.74 patch syntax failed'}
          node scripts/patch-uep-0.81.74-transfer-students.js app
          if($LASTEXITCODE -ne 0){throw '0.81.74 patch apply failed'}
          foreach($f in @('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs')){node --check $f;if($LASTEXITCODE -ne 0){throw "runtime syntax failed: $f"}}
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.74';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
      - name: Verify transfer logic and statistics isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($good in @('const APP_VERSION = "0.81.74";','__UEP_08174_TRANSFER_STUDENT_SUPPORT__','function uepCurrentEnrollment08174','status===\'전입\'','uepActiveSelectionRows=function()','uepSelectionActiveRow08129=function(row){return uepCurrentEnrollment08174(row);}','전입생 · 선택과목 자료 없음','전입생 · 내신 자료 없음','전입생 · 모의고사 자료 없음','__UEP_08174_RELEASE_NOTES_POPUP__','uep_release_notes_seen_','전출·자퇴·퇴학·제적·졸업')){if(-not $g.Contains($good)){throw "0.81.74 marker missing: $good"}}
          foreach($existing in @('subjectConfidentialPasswordHash','SUBJECT_CONFIDENTIAL_PIN_HASH','문이과 교차오류','과목별 신청현황','폐강대상','개설 유지','폐강 확정','function uepPrintSubjectRoster08173(selected)','scoreStatisticsRows')){if(-not $g.Contains($existing)){throw "existing feature missing: $existing"}}
          if($g.Contains('scoreRecords.push({') -and $g.Contains('__UEP_08174_TRANSFER_STUDENT_SUPPORT__')){Write-Host 'scoreRecords.push exists elsewhere; transfer patch itself does not synthesize score rows'}
          $patch=Get-Content scripts/patch-uep-0.81.74-transfer-students.js -Raw -Encoding UTF8
          if($patch -match 'scoreRecords\s*\.\s*push'){throw 'transfer patch must not synthesize score records'}
          if(-not $patch.Contains("ids=new Set((rows||[]).map")){throw 'missing score-record denominator isolation'}
          Write-Host 'UEP 0.81.74 transfer verification PASS'
      - name: Package and reopen
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path verify/UEP.exe)){throw 'final UEP.exe missing'}
          foreach($f in @('verify/resources/app/gyomuon.js','verify/resources/app/electron/main.cjs','verify/resources/app/electron/preload.cjs')){node --check $f;if($LASTEXITCODE -ne 0){throw "archive syntax failed: $f"}}
          $p=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json;if($p.version -ne '0.81.74'){throw "package version mismatch: $($p.version)"}
          $vg=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($good in @('const APP_VERSION = "0.81.74";','__UEP_08174_TRANSFER_STUDENT_SUPPORT__','__UEP_08174_RELEASE_NOTES_POPUP__','전입생 · 선택과목 자료 없음')){if(-not $vg.Contains($good)){throw "archive marker missing: $good"}}
          $src=(Get-FileHash app/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower().Trim();$dst=(Get-FileHash verify/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower().Trim();if($src -ne $dst){throw 'gyomuon hash mismatch after reopen'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower().Trim();"UEP_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "0.81.74 package PASS sha256=$sha"
      - name: Publish v0.81.74 and promote stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $exists=$false;try{gh release view v0.81.74 --repo $env:GITHUB_REPOSITORY *> $null;$exists=$true}catch{$exists=$false};if($exists){throw 'v0.81.74 already exists; refusing overwrite'}
          $notes=@('UEP 0.81.74는 전출입이 잦은 학교에서도 학생 정보와 개별 데이터가 안정적으로 분리되도록 보완한 버전입니다.','','- 학생마스터를 현재 학생 존재의 기준으로 사용하여 전입생이 교육과정 학생선택 목록에서 사라지지 않도록 했습니다.','- 선택과목이 없는 전입생은 자료 없음으로 표시하며 실제 과목별 신청인원에는 포함하지 않습니다.','- 내신·모의고사 자료가 없는 전입생도 조회할 수 있고 자료 없음 상태를 명확히 표시합니다.','- 반별 성적 조회에서는 성적자료가 없는 재학생/전입생을 별도 자료 없음 목록으로 보여줍니다.','- 평균·등급분포·랭킹 등 성적 통계는 기존과 동일하게 실제 성적행만 사용하여 통계값을 바꾸지 않습니다.','- 전출·자퇴·퇴학·제적·졸업은 현재 학생 대상에서 제외하되 과거 이력은 보존합니다.','- 업데이트가 완료된 뒤 해당 버전의 주요 변경사항을 한 번 안내하는 팝업을 추가했습니다.') -join [Environment]::NewLine
          gh release create v0.81.74 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.74 Transfer Student Support & Update Notes' --notes $notes
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.74/UEP-update.zip'
          git pull --rebase origin main
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.74';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256.Trim();$policy.message='전출입 학생 공통 처리 · 선택과목/성적 자료없음 표시 · 업데이트 변경사항 팝업';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.74';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256.Trim();notes='전입생 학생선택 유지 · 내신/모의고사 자료없음 표시 · 성적 통계 보호 · 버전별 업데이트 안내 팝업'}|ConvertTo-Json;Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json
          git commit -m 'release: promote UEP 0.81.74 transfer student stable'
          git push

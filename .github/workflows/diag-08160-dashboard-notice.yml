name: Diagnose UEP 0.81.60 Dashboard Notice
'on':
  push:
    branches: [main]
    paths: [diag-08160-dashboard-notice.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.59 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $z=Get-ChildItem source -Filter '*.zip'|Select-Object -First 1; Expand-Archive $z.FullName app -Force
          $f='app/resources/app/gyomuon.js';$l=Get-Content $f -Encoding UTF8;$o=@()
          foreach($p in @('공결·지각 학생','1~9반을 한 화면에서 비교','해당 메뉴 전체조회','function setSensitivePasswordFlow','function subjectConfidentialAllowed','function setSubjectConfidentialPassword','function directSchoolNotices','function connectedNoticeVisibleToCurrentUser','새로운 업데이트 공지','data-notice-delete','자동 마감공지')){
            $hits=$l|Select-String $p
            foreach($h in $hits){$s=[Math]::Max(0,$h.LineNumber-15);$e=[Math]::Min($l.Count-1,$h.LineNumber+25);$o+="=== $p @ $($h.LineNumber) ===";for($i=$s;$i -le $e;$i++){$o+=('{0}: {1}' -f ($i+1),$l[$i])}}
          }
          $o|Set-Content diag-08160-dashboard-notice.txt -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add diag-08160-dashboard-notice.txt;git commit -m 'diag: capture 0.81.60 dashboard notice auth targets';git push

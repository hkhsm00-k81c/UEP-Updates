name: Inspect UEP OAuth Target

on:
  push:
    paths:
      - inspect-oauth-target.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.80.69 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.80.69 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Extract OAuth integration targets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out = New-Object System.Collections.Generic.List[string]
          function Add-Range($file,$from,$to){
            $out.Add("===== $file lines $from-$to =====")
            $lines=Get-Content $file -Encoding UTF8
            for($i=$from;$i -le [Math]::Min($to,$lines.Count);$i++){ $out.Add(("{0}: {1}" -f $i,$lines[$i-1])) }
          }
          Add-Range 'app/resources/app/electron/main.cjs' 250 430
          Add-Range 'app/resources/app/electron/main.cjs' 1120 1215
          Add-Range 'app/resources/app/electron/main.cjs' 1685 1775
          if(Test-Path 'app/resources/app/electron/preload.cjs'){ Add-Range 'app/resources/app/electron/preload.cjs' 1 260 }
          Add-Range 'app/resources/app/gyomuon.js' 330 470
          Add-Range 'app/resources/app/gyomuon.js' 3400 3555
          Add-Range 'app/resources/app/gyomuon.js' 3900 3995
          $out | Set-Content 'oauth-target-inspect.txt' -Encoding UTF8
      - name: Commit inspection report
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oauth-target-inspect.txt
          git commit -m 'Inspect UEP OAuth integration targets' || echo 'no changes'
          git push

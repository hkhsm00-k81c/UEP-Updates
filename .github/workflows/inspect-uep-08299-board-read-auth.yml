name: Inspect UEP 0.82.99 Board Read Auth
on:
  push:
    paths: ['inspect-08299-board-read-auth.trigger']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force source,app|Out-Null; gh release download v0.82.98 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source; if($LASTEXITCODE -ne 0){throw 'download failed'}; Expand-Archive source/UEP-update.zip app -Force; node scripts/inspect-uep-08299-board-read-auth.js app/resources/app

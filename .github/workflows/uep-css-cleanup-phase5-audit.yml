name: UEP CSS Cleanup Phase 5 Audit

on:
  push:
    branches:
      - cleanup/codebase-phase1-20260822
    paths:
      - tools/css-cleanup-phase1.js
      - tools/css-cleanup-phase2.js
      - tools/css-cleanup-audit.js
      - tools/css-cleanup-phase3-audit.js
      - tools/css-cleanup-phase4.js
      - tools/css-cleanup-phase5-audit.js
      - .github/workflows/uep-css-cleanup-phase5-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  css-cleanup-phase5-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,cleanup-phase5-output | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          if(-not (Test-Path 'source/UEP-update.zip')){throw 'UEP 0.81.01 base ZIP not found'}
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Reconstruct runtime through 0.81.16
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scripts=Get-ChildItem scripts/build-update-*.ps1 | ForEach-Object {
            if($_.BaseName -match 'build-update-(\d+)\.(\d+)\.(\d+)'){
              [pscustomobject]@{File=$_.FullName;Major=[int]$matches[1];Minor=[int]$matches[2];Patch=[int]$matches[3]}
            }
          } | Sort-Object Major,Minor,Patch
          foreach($s in $scripts){if($s.Major -eq 0 -and $s.Minor -eq 81 -and $s.Patch -ge 2 -and $s.Patch -le 16){ & $s.File }}

      - name: Apply CSS cleanup phases 1 and 2
        shell: pwsh
        run: |
          node ./tools/css-cleanup-phase1.js app cleanup-phase5-output/phase1
          node ./tools/css-cleanup-phase2.js app cleanup-phase5-output/phase2

      - name: Generate live baseline and phase3
        shell: pwsh
        run: |
          node ./tools/css-cleanup-audit.js app cleanup-phase5-output/live-baseline
          node ./tools/css-cleanup-phase3-audit.js app cleanup-phase5-output/phase3 cleanup-phase5-output/live-baseline/css-duplicate-groups.csv

      - name: Apply live phase4 safe merges
        shell: pwsh
        run: node ./tools/css-cleanup-phase4.js app cleanup-phase5-output/phase4 cleanup-phase5-output/phase3/css-phase3-merge-safety.csv

      - name: Re-audit phase4 result
        shell: pwsh
        run: node ./tools/css-cleanup-audit.js app cleanup-phase5-output/after-phase4

      - name: Run phase5 deep runtime trace
        shell: pwsh
        run: node ./tools/css-cleanup-phase5-audit.js app . cleanup-phase5-output

      - name: Show phase5 report
        shell: pwsh
        run: Get-Content cleanup-phase5-output/CSS-CLEANUP-PHASE5-AUDIT.md -Encoding UTF8

      - name: Persist phase5 results
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cleanup-phase5-output
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "Store CSS cleanup phase5 deep audit results"
            git push origin HEAD:cleanup/codebase-phase1-20260822
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UEP-CSS-CLEANUP-PHASE5-AUDIT
          path: cleanup-phase5-output/

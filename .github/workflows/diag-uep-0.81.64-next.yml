name: Diagnose UEP 0.81.64 for 0.81.66
'on':
  push:
    branches: [main]
    paths: [diag-uep-0.81.64-next.trigger]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actual 0.81.64
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.64 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Print anchors
        shell: pwsh
        run: |
          $g='app/resources/app/gyomuon.js';$m='app/resources/app/electron/main.cjs';$p='app/resources/app/electron/preload.cjs'
          foreach($term in @('subjectConfidential','민감정보','비밀번호 변경','급식지도','오늘의 급식','settingsView','saveNoticeReceipt')){Write-Host "===== GYOMUON $term =====";Select-String -Path $g -Pattern $term -Context 3,8 | Select-Object -First 8 | ForEach-Object {$_.ToString()}}
          foreach($term in @('setLoginItemSettings','getLoginItemSettings','app.whenReady','ipcMain.handle','credentialPath')){Write-Host "===== MAIN $term =====";Select-String -Path $m -Pattern $term -Context 3,8 | Select-Object -First 8 | ForEach-Object {$_.ToString()}}
          if(Test-Path $p){foreach($term in @('contextBridge','schoolBoard')){Write-Host "===== PRELOAD $term =====";Select-String -Path $p -Pattern $term -Context 3,8 | Select-Object -First 8 | ForEach-Object {$_.ToString()}}}

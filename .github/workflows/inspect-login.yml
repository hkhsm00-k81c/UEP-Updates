name: Inspect UEP Login Code

on:
  push:
    paths:
      - inspect-login.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-login:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.80.67 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.80.67
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Save login-related snippets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $out='diagnostics/login-snippets.txt'
          "UEP 0.80.67 login/auth source snippets" | Set-Content $out -Encoding UTF8
          $files=@('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs')
          foreach($f in $files){
            Add-Content $out "`n===== $f =====" -Encoding UTF8
            if(Test-Path $f){
              Select-String -Path $f -Pattern '로그인|사용자계정|이메일|email|login|auth|teacher|성명|사용여부' -Context 8,18 | Select-Object -First 160 | ForEach-Object { Add-Content $out $_.ToString() -Encoding UTF8 }
            }
          }
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/login-snippets.txt
          git commit -m 'Capture UEP 0.80.67 login source snippets' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Inspect UEP Login Code

on:
  push:
    paths:
      - inspect-login.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-login:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.80.81 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.80.81
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Save auto-login related snippets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $out='diagnostics/login-snippets.txt'
          "UEP 0.80.81 auto-login/auth source snippets" | Set-Content $out -Encoding UTF8
          $files=@('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs')
          foreach($f in $files){
            Add-Content $out "`n===== $f =====" -Encoding UTF8
            if(Test-Path $f){
              Select-String -Path $f -Pattern '자동 로그인|저장된 사용자|연결 정보|login|autoLogin|restore|saved|google|sync|setupCompleted|currentUser' -Context 18,35 | Select-Object -First 260 | ForEach-Object { Add-Content $out $_.ToString() -Encoding UTF8 }
            }
          }
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/login-snippets.txt
          git commit -m 'Capture UEP 0.80.81 auto-login source snippets' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

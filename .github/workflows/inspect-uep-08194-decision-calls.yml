name: Inspect UEP 0.81.94 decision calls
on:
  push:
    branches: [candidate/0.81.95-selection-normalizer]
    paths: [.github/workflows/inspect-uep-08194-decision-calls.yml]
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.94/UEP-update.zip' -OutFile u.zip
          Expand-Archive u.zip unpacked -Force
          $gy=Get-ChildItem unpacked -Recurse -Filter gyomuon.js | Where-Object {$_.FullName -match 'resources[\\/]app[\\/]gyomuon\.js$'} | Select-Object -First 1
          Select-String -Path $gy.FullName -Pattern 'saveDecision\(|decisions\(\)' -Context 8,12 | ForEach-Object { '---MATCH---'; $_.Context.PreContext; $_.Line; $_.Context.PostContext }

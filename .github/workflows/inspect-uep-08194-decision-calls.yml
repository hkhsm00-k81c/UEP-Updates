name: Inspect UEP 0.81.94 decision calls
on:
  push:
    branches: [candidate/0.81.95-selection-normalizer]
    paths: [.github/workflows/inspect-uep-08194-decision-calls.yml]
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.94/UEP-update.zip' -OutFile u.zip
          Expand-Archive u.zip unpacked -Force
          $gy=Get-ChildItem unpacked -Recurse -Filter gyomuon.js | Where-Object {$_.FullName -match 'resources[\\/]app[\\/]gyomuon\.js$'} | Select-Object -First 1
          $main=Get-ChildItem unpacked -Recurse -Filter main.cjs | Where-Object {$_.FullName -match 'resources[\\/]app[\\/]electron[\\/]main\.cjs$'} | Select-Object -First 1
          $pre=Get-ChildItem unpacked -Recurse -Filter preload.cjs | Where-Object {$_.FullName -match 'resources[\\/]app[\\/]electron[\\/]preload\.cjs$'} | Select-Object -First 1
          '=== LEGACY DECISION CALLS ==='
          Select-String -Path $gy.FullName -Pattern 'DECISION_KEY|saveDecision\(|decisions\(\)' -Context 10,18 | ForEach-Object { '---MATCH---'; $_.Context.PreContext; $_.Line; $_.Context.PostContext }
          '=== MAIN WRITE HELPERS / IPC ==='
          Select-String -Path $main.FullName -Pattern 'updateSheetValues|clearSheetValues|ipcMain\.handle|UEP_RULES_SPREADSHEET_ID|UEP_PROCESSING_SPREADSHEET_ID' -Context 4,8 | Select-Object -First 40 | ForEach-Object { '---MATCH---'; $_.Context.PreContext; $_.Line; $_.Context.PostContext }
          '=== PRELOAD IPC BRIDGES ==='
          Select-String -Path $pre.FullName -Pattern 'ipcRenderer\.invoke|contextBridge|exposeInMainWorld' -Context 3,6 | Select-Object -First 30 | ForEach-Object { '---MATCH---'; $_.Context.PreContext; $_.Line; $_.Context.PostContext }

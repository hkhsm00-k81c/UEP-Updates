name: Inspect 0.82.99 special-room targeting

on:
  push:
    branches: [main]
    paths:
      - inspect-08299-special-room.trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download 0.82.99 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/u
          gh release download v0.82.99 -R hkhsm00-k81c/UEP-Updates -p 'UEP-update.zip' -D /tmp/u
          unzip -q /tmp/u/UEP-update.zip -d /tmp/u/pkg
      - name: Extract special-room related source excerpts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/u/pkg')
          out=[]
          keys=['특별실','세미나실','표시대상','대상반','대상학년','boardTarget','specialRoom','SPECIAL_ROOM']
          for p in root.rglob('*'):
              if not p.is_file() or p.stat().st_size>20_000_000: continue
              try: s=p.read_text(encoding='utf-8')
              except: continue
              lines=s.splitlines()
              hits=[]
              for i,line in enumerate(lines):
                  if any(k in line for k in keys):
                      lo=max(0,i-8); hi=min(len(lines),i+9)
                      hits.append((i+1,'\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi))))
              if hits:
                  out.append(f'===== {p.relative_to(root)} =====')
                  for n,chunk in hits[:80]: out.append(f'--- hit {n} ---\n{chunk}')
          Path('special-room-diagnostic.txt').write_text('\n'.join(out) if out else 'NO_MATCH',encoding='utf-8')
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: special-room-diagnostic
          path: special-room-diagnostic.txt
          retention-days: 2

name: Publish UEP 0.81.85 Curriculum Stable Core
on:
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.85.trigger
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.85
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 0.81.84 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,work,verify | Out-Null
          gh release download v0.81.84 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip work -Force
          if(!(Test-Path work/UEP.exe)){throw '0.81.84 baseline UEP.exe missing'}
      - name: Apply 0.81.85 stable core
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08185-curriculum-stable-core.js
          node scripts/patch-uep-08185-curriculum-stable-core.js work
          node --check work/resources/app/gyomuon.js
          $pkg=Get-Content work/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.85'){throw 'package version mismatch'}
          $g=Get-Content work/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('const APP_VERSION = "0.81.85";','UEP_08185_CURRICULUM_STABLE_CORE_START','data-error-grade-scope-08185','uep-roster-08185','refreshRosterUntilStable')){if(!$g.Contains($m)){throw "marker missing: $m"}}
          if($g.Contains('UEP_08184_CURRICULUM_CONSOLIDATION_START')){throw '0.81.84 runtime patch still present'}
      - name: Package and reopen verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path work/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.85'){throw 'reopened package version mismatch'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish release and promote update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $notes=@'
          UEP 0.81.85 교육과정 조회 안정화

          - 2학년/3학년 오류학생 카드가 실제 학생행을 직접 필터링하도록 보완
          - 반별 필터와 학년별 오류학생 조회 조합 유지
          - 과학 신청명단 팝업 폭을 화면 가로폭에 맞춰 확대하고 불필요한 좌우 스크롤 최소화
          - 2-2 과학과목을 첫 클릭할 때도 동일학기 다른 과학선택과 3-1 과학선택을 최신 데이터로 재구성
          - 0.81.84 교육과정 런타임 모듈을 제거하고 0.81.85 단일 모듈로 교체
          '@
          $notes|Set-Content release-notes.md -Encoding UTF8
          gh release view v0.81.85 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){throw 'v0.81.85 release already exists'}
          $global:LASTEXITCODE=0
          gh release create v0.81.85 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP v0.81.85 교육과정 조회 안정화' --notes-file release-notes.md
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.85/UEP-update.zip'
          $message='UEP 0.81.85 학년별 오류학생 실제 조회 · 과학 신청명단 첫 표시 · 팝업 가로폭 안정화'
          function PutJson($path,$obj){$tmp=Join-Path $env:RUNNER_TEMP ($path-replace'/','_');$obj|ConvertTo-Json -Depth 50|Set-Content $tmp -Encoding UTF8;$sha=(gh api "repos/${env:GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha);$b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($tmp));@{message="release: promote $path to UEP 0.81.85";content=$b64;sha=$sha;branch='main'}|ConvertTo-Json|gh api --method PUT "repos/${env:GITHUB_REPOSITORY}/contents/${path}" --input -|Out-Null}
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json;$policy.latestVersion='0.81.85';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message=$message;$policy.forceUpdate=$false;PutJson 'uep-policy.json' $policy
          $manifest=[ordered]@{version='0.81.85';channel='stable';downloadUrl=$url;notes=$message;sha256=$env:UEP_SHA256};PutJson 'uep-update.json' $manifest;PutJson 'uep-version.json' $manifest
          $legacy=[ordered]@{latestVersion='0.81.85';downloadUrl=$url;sha256=$env:UEP_SHA256;forceUpdate=$false;message=$message};PutJson 'policy.json' $legacy

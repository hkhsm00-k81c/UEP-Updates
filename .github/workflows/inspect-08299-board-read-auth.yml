name: Inspect UEP 0.82.98 Board Read Auth
on:
  push:
    paths:
      - 'inspect-08299-board-read-auth.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.82.98
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force app,src|Out-Null
          gh release download v0.82.98 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir src
          Expand-Archive src/UEP-update.zip app -Force
      - name: Inspect Board auth functions
        shell: pwsh
        run: |
          $p='app/resources/app/electron/main.cjs'; $s=Get-Content $p -Raw
          foreach($term in @('function resolveSchoolServiceAccount','async function resolveSchoolServiceAccount','function boardDbReadContext08294','async function boardDbReadContext08294','function boardWriteContext08291','async function boardWriteContext08291','async function schoolReadSessionStatus','function schoolReadSessionStatus','schoolReadApiUrl','schoolReadApiRequest','schoolReadRequest','SCHOOL_READ_API','schoolReadFetch','SPREADSHEET_NOT_ALLOWED')){
            Write-Host "===== $term ====="
            $i=$s.IndexOf($term); if($i -ge 0){$start=[Math]::Max(0,$i-1600);$len=[Math]::Min(9000,$s.Length-$start);Write-Host $s.Substring($start,$len)}else{Write-Host 'NOT_FOUND'}
          }
          Write-Host '===== schoolRead function names ====='
          [regex]::Matches($s,'(?m)(?:async\s+)?function\s+(schoolRead[A-Za-z0-9_]+)\s*\(') | ForEach-Object { Write-Host $_.Groups[1].Value } | Select-Object -Unique

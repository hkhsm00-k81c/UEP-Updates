name: Inspect UEP 0.82.98 Board Read Auth
on:
  push:
    paths:
      - 'inspect-08299-board-read-auth.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.82.98
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force app,src|Out-Null
          gh release download v0.82.98 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir src
          Expand-Archive src/UEP-update.zip app -Force
      - name: Inspect Board auth functions
        shell: pwsh
        run: |
          $p='app/resources/app/electron/main.cjs'; $s=Get-Content $p -Raw
          foreach($term in @('async function boardReadRange08291','function boardReadRange08291','async function boardDbReadContext08294','async function boardDbDetail08296')){
            Write-Host "===== $term ====="
            $i=$s.IndexOf($term); if($i -ge 0){$len=[Math]::Min(12000,$s.Length-$i);Write-Host $s.Substring($i,$len)}else{Write-Host 'NOT_FOUND'}
          }

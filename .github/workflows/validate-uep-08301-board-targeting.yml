name: Validate UEP 0.83.01 Board targeting
on:
  push:
    branches:
      - work/uep-08301-board-targeting
    paths:
      - validate-08301-board-targeting.trigger
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download UEP 0.83.00 stable baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/uep08301/base /tmp/uep08301/app /tmp/uep08301/verify out
          gh release download v0.83.00 -R "$GITHUB_REPOSITORY" -p 'UEP-update.zip' -D /tmp/uep08301/base
          unzip -q /tmp/uep08301/base/UEP-update.zip -d /tmp/uep08301/app
          test "$(node -p "require('/tmp/uep08301/app/resources/app/package.json').version")" = "0.83.00"
      - name: Decode and apply 0.83.01 patch
        run: |
          set -euo pipefail
          cat scripts/patch08301.part{1,2,3,4,5}.b64 > /tmp/patch08301.gz.b64
          base64 -d /tmp/patch08301.gz.b64 > /tmp/patch08301.py.gz
          echo '3d55c58eea1bb27560d615cf1ffd9bb2625c0d9424b5e949a73b83f06d41a8d4  /tmp/patch08301.py.gz' | sha256sum -c -
          gzip -dc /tmp/patch08301.py.gz > /tmp/patch08301.py
          echo 'e1da407f50620b946dc4b08b8fe3512ff43dc1d5157ae605c81f6974d98eeaaa  /tmp/patch08301.py' | sha256sum -c -
          python /tmp/patch08301.py /tmp/uep08301/app/resources/app
      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          node --check /tmp/uep08301/app/resources/app/electron/main.cjs
          node --check /tmp/uep08301/app/resources/app/gyomuon.js
          node scripts/test-uep-08301-board-targeting.js /tmp/uep08301/app/resources/app
      - name: Repack and verify packaged contents
        run: |
          set -euo pipefail
          cd /tmp/uep08301/app
          zip -qr /tmp/uep08301/UEP-update.zip .
          unzip -q /tmp/uep08301/UEP-update.zip -d /tmp/uep08301/verify
          node --check /tmp/uep08301/verify/resources/app/electron/main.cjs
          node --check /tmp/uep08301/verify/resources/app/gyomuon.js
          node "$GITHUB_WORKSPACE/scripts/test-uep-08301-board-targeting.js" /tmp/uep08301/verify/resources/app
          sha256sum /tmp/uep08301/UEP-update.zip | tee "$GITHUB_WORKSPACE/out/sha256.txt"
          cp /tmp/uep08301/UEP-update.zip "$GITHUB_WORKSPACE/out/UEP-update.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: uep-08301-validated-package
          path: out
          retention-days: 3

name: Publish UEP 0.81.68 Shared Security Fix
'on':
  push:
    branches: [main]
    paths: [publish-uep-0.81.68-shared-security.trigger]
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.68-shared-security
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download known-good 0.81.66
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.66 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Validate patch sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node --check scripts/patch-uep-0.81.68-security-notice.js
          node --check scripts/uep-0.81.68-shared-security-addon.js
          node --check scripts/uep-0.81.67-password-reset-addon.js
      - name: Apply 0.81.68 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node scripts/patch-uep-0.81.68-security-notice.js app $env:GITHUB_WORKSPACE
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/preload.cjs
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.68';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
          $g=(Get-FileHash app/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();"GYOMUON_SHA256=$g"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $m=(Get-FileHash app/resources/app/electron/main.cjs -Algorithm SHA256).Hash.ToLower();"MAIN_SHA256=$m"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $pr=(Get-FileHash app/resources/app/electron/preload.cjs -Algorithm SHA256).Hash.ToLower();"PRELOAD_SHA256=$pr"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build reopen and verify exact payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          node --check verify/resources/app/gyomuon.js
          node --check verify/resources/app/electron/main.cjs
          node --check verify/resources/app/electron/preload.cjs
          $g=(Get-FileHash verify/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();if($g -ne $env:GYOMUON_SHA256){throw 'gyomuon hash mismatch'}
          $m=(Get-FileHash verify/resources/app/electron/main.cjs -Algorithm SHA256).Hash.ToLower();if($m -ne $env:MAIN_SHA256){throw 'main hash mismatch'}
          $pr=(Get-FileHash verify/resources/app/electron/preload.cjs -Algorithm SHA256).Hash.ToLower();if($pr -ne $env:PRELOAD_SHA256){throw 'preload hash mismatch'}
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json;if($pkg.version -ne '0.81.68'){throw "package version mismatch: $($pkg.version)"}
          $gy=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8;$ma=Get-Content verify/resources/app/electron/main.cjs -Raw -Encoding UTF8;$pre=Get-Content verify/resources/app/electron/preload.cjs -Raw -Encoding UTF8
          foreach($x in @('__UEP_08168_SHARED_SECURITY_READ_RUNTIME__','__UEP_08167_PASSWORD_RESET_RUNTIME__')){if(!$gy.Contains($x)){throw "renderer marker missing $x"}}
          foreach($x in @('__UEP_08168_SHARED_SECURITY_READ__','__UEP_08168_PASSWORD_RESET__','__UEP_08168_NOTICE_RECEIPT_SCHOOL_READ_FIRST__')){if(!$ma.Contains($x)){throw "main marker missing $x"}}
          foreach($x in @('readSharedSecurityConfig','resetSharedSecurityConfig')){if(!$pre.Contains($x)){throw "preload bridge missing $x"}}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host '0.81.68 package verification PASS'
      - name: Publish only after verification passes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $exists=$false
          try { gh release view v0.81.68 --repo $env:GITHUB_REPOSITORY *> $null; $exists=$true } catch { $exists=$false }
          if($exists){gh release delete v0.81.68 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          gh release create v0.81.68 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.68 Shared Security Read + Password Reset' --notes '0.81.66 정상판 기준. 담임 School Read 로그인 세션으로 00_UEP설정의 공용 민감정보/선택과목 비밀번호 해시를 직접 읽도록 수정하고 관리자·학년부장 비밀번호 초기화 기능을 추가합니다. 담임 공지 확인은 Google 연결승인으로 빠지지 않고 School Read 세션을 우선 사용하도록 고정합니다. 현재 School Read 백엔드의 notice-receipt-save 쓰기 액션은 별도 배포가 필요합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.68/UEP-update.zip'
          git pull --rebase origin main
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.68';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='담임 공용 비밀번호 읽기 · 비밀번호 초기화';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.68';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='담임 공용 비밀번호 읽기 + 비밀번호 초기화'}|ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.68 shared security fixes';git push

name: UEP 0.81.19 Performance Phase2B

on:
  push:
    branches:
      - audit/0.81.19-performance
    paths:
      - tools/verify-inputcenter-render-scope-0.81.19.js
      - .github/workflows/uep-0.81.19-performance-phase2b.yml
  workflow_dispatch:

jobs:
  verify-inputcenter-render-scope:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified phase1
        shell: pwsh
        run: |
          node ./tools/apply-performance1-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase1 applicator failed'}
      - name: Verify input center render scope
        shell: pwsh
        run: |
          node ./tools/verify-inputcenter-render-scope-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'input center render-scope verification failed'}
          node --check app/resources/app/gyomuon.js
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.19-Performance-Phase2B
          path: performance-phase2b-output

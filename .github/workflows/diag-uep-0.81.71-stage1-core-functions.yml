name: Diagnose UEP 0.81.71 Stage1 Core Functions
'on':
  push:
    branches: [main]
    paths: [diag-uep-0.81.71-stage1-core-functions.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.71
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.71 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Extract exact core functions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file='app/resources/app/gyomuon.js';$lines=Get-Content $file -Encoding UTF8
          function Capture($name,$pattern,$before=5,$after=120){
            $script:out+="## $name";$idx=-1
            for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match $pattern){$idx=$i;break}}
            $script:out+="line=$($idx+1)";if($idx -ge 0){$s=[Math]::Max(0,$idx-$before);$e=[Math]::Min($lines.Count-1,$idx+$after);for($j=$s;$j -le $e;$j++){$script:out+=('{0}: {1}' -f ($j+1),$lines[$j])}}
          }
          $out=@('# UEP 0.81.71 stage1 core functions','')
          Capture 'uepCurriculumNav' 'uepCurriculumNav\s*\(' 8 100
          Capture 'uepCurriculumFinalView' 'function\s+uepCurriculumFinalView' 10 35
          Capture 'settingsView' 'function\s+settingsView|const\s+settingsView|settingsView\s*=\s*function' 8 220
          Capture 'bindSettings' 'function\s+bindSettings' 8 220
          Capture 'subjectConfidentialPasswordHash' 'function\s+subjectConfidentialPasswordHash' 8 80
          Capture 'unlockSubjectConfidential' 'function\s+unlockSubjectConfidential' 8 80
          Capture 'sensitivePasswordModal' 'function\s+sensitivePasswordModal|async\s+function\s+sensitivePasswordModal' 8 140
          Capture 'curriculum modal CSS' 'subject-roster-modal' 15 80
          $out|Set-Content diag-uep-0.81.71-stage1-core-functions.txt -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main;git add diag-uep-0.81.71-stage1-core-functions.txt;git commit -m 'diag: capture UEP 0.81.71 stage1 core functions';git push

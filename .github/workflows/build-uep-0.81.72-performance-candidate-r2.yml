name: Build and Release UEP 0.82.34 Today University Click Hard Fix
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08234-today-university-click.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.33 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08234-today-university-click.js app
          node --check app/resources/app/gyomuon.js
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.34";',"const CURRENT='0.82.34';",'UEP_08234_TODAY_UNIVERSITY_CLICK_HARD_FIX',"t.includes('오늘의 대학')&&t.length<180",'new MutationObserver','UEP_08233_ADMISSIONS_RUNTIME_OVERRIDE','admission-track-button')){if(-not $g.Contains($x)){throw "missing hard-fix marker: $x"}}
          if($g.Contains('const APP_VERSION = "0.82.33";')){throw 'old renderer version remains'}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.34
          - 오늘의 대학 카드가 button이 아닌 div/span 구조여도 클릭 감지
          - 대시보드 재렌더링 후에도 MutationObserver로 클릭 바인딩 자동 복구
          - 0.82.33 전형 이해 실제 전형명 표시 유지
          '@
          gh release create v0.82.34 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.34' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.34'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.34/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.34 · 오늘의 대학 클릭 강제 복구'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.34 RELEASE SUCCESS","base=v0.82.33","today-university-click=hard-fixed","mutation-rebind=enabled","admission-track-first=preserved","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.34 today university click hard fix'
          git push origin HEAD:main

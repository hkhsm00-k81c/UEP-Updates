name: Build and Release UEP 0.82.23 Admissions Explorer
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08223-admissions-navigation-content.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.22 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08223-admissions-navigation-content.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $c=Get-Content app/resources/app/gyomuon.css -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.23";','UEP_08220_ADMISSIONS_REAL_CONNECT','UEP_08223_ADMISSION_NAV_OVERRIDE','UEP_08223_RELEASE_NOTES','uep08223TodayNav','data-uep-region','data-uep-prev','data-uep-next',"const CURRENT='0.82.23';")){if(-not $g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('width:min(92vw,1680px)','overflow-x:hidden','grid-template-columns:repeat(3,minmax(0,1fr))','.uep-uni-region-tabs','.uep-uni-prevnext','#uep-admission-back-button{display:none!important}')){if(-not $c.Contains($x)){throw "missing css marker: $x"}}
          foreach($x in @('__UEP_08217_LOGIN_WATCHDOG__','setInterval(sync,2500)')){if($g.Contains($x)){throw "forbidden regression marker: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.23
          - 대입상담 팝업을 화면 90% 수준으로 확대하고 가로 스크롤 제거
          - 전형 이해 3열 카드가 팝업 안에 온전히 보이도록 레이아웃 보정
          - 전형 이해에서 대학 선택 시 전형 이해로 돌아가기 유지
          - 오늘의 대학 상세에 지역별 대학 선택, 이전 대학/다음 대학 탐색 추가
          - 대학 상세를 전형 3열 카드 + 수시/정시/과목선택 핵심 + 운호고 입결 카드 UI로 통일
          - 52_대입기초 수시 지원 횟수·수능최저·5등급 내신 등 실질 정보 보강
          - 새 버전 첫 실행 시 v0.82.23 수정사항 팝업 자동 표시
          - 업데이트 가능 시 상단 버전에 현재 버전 → 최신 버전 강조 표시 유지
          - v0.82.20 이후 실시간 대입 시트 연결 로직 유지
          '@
          gh release create v0.82.23 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.23' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.23'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.23/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.23 · 대입상담 대형 팝업/지역·이전다음 대학 탐색/대입기초 정보 보강'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.23 RELEASE SUCCESS","base=v0.82.22","ui=wide-dialog,types-3col,university-unified","nav=types-back,today-region-prev-next","content=52-basics-enriched","release-ux=first-run-popup,current-to-latest-version-highlight","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.23 admissions explorer'
          git push origin HEAD:main

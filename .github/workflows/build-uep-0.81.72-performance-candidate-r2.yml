name: Inspect UEP 0.82.30 Afterschool Session Logic
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  inspect-afterschool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.30 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          $out=New-Object System.Collections.Generic.List[string]
          $out.Add('UEP 0.82.30 AFTERSCHOOL INSPECTION')
          $out.Add('=== gyomuon.js markers ===')
          $patterns=@('차시별 일정','해당 월','오늘의 프로그램','방과후학교','차시일정','운영일자','운영상태','출석확정','수업완료','예정')
          foreach($p in $patterns){
            $matches=[regex]::Matches($g,[regex]::Escape($p))
            $out.Add("PATTERN [$p] COUNT=$($matches.Count)")
            $take=[Math]::Min($matches.Count,8)
            for($i=0;$i -lt $take;$i++){
              $idx=$matches[$i].Index
              $start=[Math]::Max(0,$idx-900)
              $len=[Math]::Min(2200,$g.Length-$start)
              $snippet=$g.Substring($start,$len).Replace("`r",' ').Replace("`n",' ')
              $out.Add("--- $p #$($i+1) @ $idx ---")
              $out.Add($snippet)
            }
          }
          $out.Add('=== main.cjs markers ===')
          foreach($p in @('11_방과후학교','12_차시일정','13_출석부','afterSchool','sessions','programSessions')){
            $matches=[regex]::Matches($m,[regex]::Escape($p))
            $out.Add("PATTERN [$p] COUNT=$($matches.Count)")
            $take=[Math]::Min($matches.Count,6)
            for($i=0;$i -lt $take;$i++){
              $idx=$matches[$i].Index
              $start=[Math]::Max(0,$idx-700)
              $len=[Math]::Min(1800,$m.Length-$start)
              $out.Add($m.Substring($start,$len).Replace("`r",' ').Replace("`n",' '))
            }
          }
          $out | Set-Content inspect-08230-afterschool.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add inspect-08230-afterschool.txt
          git commit -m 'Inspect v0.82.30 afterschool session logic'
          git push origin HEAD:main

name: Build and Release UEP 0.82.22 Admissions UI Polish
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08222-admissions-ui-polish.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.21 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08222-admissions-ui-polish.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $c=Get-Content app/resources/app/gyomuon.css -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.22";','UEP_08220_ADMISSIONS_REAL_CONNECT','UEP_08222_DIALOG_WRAPPER','UEP_08222_RELEASE_NOTES','UEP_08222_VERSION_UPDATE_INDICATOR',"pill.textContent='v'+CURRENT+' → v'+latest","window.__uepAdmissionReturn='types'")){if(-not $g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('grid-template-columns:repeat(3,minmax(0,1fr))','.uep-admission-university-detail','.uep-admission-back','.uep-version-update-available','#uep-global-version-badge{display:none!important}')){if(-not $c.Contains($x)){throw "missing css marker: $x"}}
          foreach($x in @('__UEP_08217_LOGIN_WATCHDOG__','setInterval(sync,2500)')){if($g.Contains($x)){throw "forbidden regression marker: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.22
          - 전형 이해 팝업 폭 확대 및 한 줄 3카드 구조 적용
          - 대학 상세 화면을 대입 기초·전형 이해와 동일한 카드 UI로 정리
          - 대학 상세 주요 전형 2열 카드 및 정보 위계 개선
          - 전형 이해/오늘의 대학 진입 경로별 돌아가기 적용
          - 기존 중복 UEP 버전 배지 제거
          - 업데이트 가능 시 상단 기존 버전 배지에 현재 버전 → 최신 버전 강조 표시
          - 새 버전 첫 실행 시 v0.82.22 수정사항 팝업 자동 표시
          - v0.82.20 이후 실시간 대입 시트 연결 로직 유지
          '@
          gh release create v0.82.22 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.22' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.22'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.22/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.22 · 대입상담 UI 통일 + 업데이트 버전 표시/수정사항 팝업'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.22 RELEASE SUCCESS","base=v0.82.21","ui=types-3col,university-detail-unified,route-back","release-ux=first-run-popup,current-to-latest-version-highlight,no-duplicate-badge","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.22 admissions UI polish and updater UX'
          git push origin HEAD:main

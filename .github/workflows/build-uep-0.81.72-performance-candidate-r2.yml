name: Inspect UEP 0.82.30 Afterschool Parser
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  inspect-afterschool-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.30 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          $out=New-Object System.Collections.Generic.List[string]
          $out.Add('UEP 0.82.30 AFTERSCHOOL PARSER INSPECTION')
          function AddSnips([string]$label,[string]$text,[string[]]$patterns,[int]$before=1300,[int]$length=3200){
            $out.Add("=== $label ===")
            foreach($p in $patterns){
              $matches=[regex]::Matches($text,[regex]::Escape($p))
              $out.Add("PATTERN [$p] COUNT=$($matches.Count)")
              $take=[Math]::Min($matches.Count,10)
              for($i=0;$i -lt $take;$i++){
                $idx=$matches[$i].Index;$start=[Math]::Max(0,$idx-$before);$len=[Math]::Min($length,$text.Length-$start)
                $out.Add("--- $p #$($i+1) @ $idx ---")
                $out.Add($text.Substring($start,$len).Replace("`r",' ').Replace("`n",' '))
              }
            }
          }
          AddSnips 'GYOMUON' $g @('readonlyCache?.programs','readonlyCache.programs','connectedPrograms','programWithOverride','isCourseMaster','after-course','after-master','after-session','actualDate','actualClassDate','실제수업일','예정일','운영일자','groupedAfterSchoolCourses','todayProgramCollections')
          AddSnips 'MAIN' $m @("matrices['11_방과후학교']","matrices['12_차시일정']","matrices['13_출석부']",'data.programs','programs=','isCourseMaster','after-course','after-master','after-session','실제수업일','예정일','운영일자','차시번호','강좌ID')
          $out | Set-Content inspect-08230-afterschool-parser.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add inspect-08230-afterschool-parser.txt
          git commit -m 'Inspect v0.82.30 afterschool parser mapping'
          git push origin HEAD:main

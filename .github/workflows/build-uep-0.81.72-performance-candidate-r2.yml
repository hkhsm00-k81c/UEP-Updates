name: Inspect UEP 0.82.30 Afterschool Read Path
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  inspect-afterschool-read-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.30 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          @'
          const fs=require('fs'),path=require('path');
          const root=path.join('app','resources','app');
          const exts=new Set(['.js','.cjs','.mjs']);
          const patterns=['12_차시일정','차시ID','강좌ID','after-session-','isCourseMaster','실제수업일','운영일자','예정일','차시번호','programs.push','kind:"after"','kind: "after"'];
          const files=[];
          function walk(d){for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())walk(p);else if(exts.has(path.extname(p)))files.push(p)}}
          walk(root);
          const out=['UEP 0.82.30 AFTERSCHOOL READ PATH'];
          for(const file of files){
            let text;try{text=fs.readFileSync(file,'utf8')}catch{continue}
            const hits=[];
            for(const pat of patterns){let at=0,count=0;while((at=text.indexOf(pat,at))>=0&&count<12){hits.push({pat,at});at+=pat.length;count++}}
            if(!hits.length)continue;
            out.push(`\n=== FILE ${file.replace(/\\/g,'/')} ===`);
            hits.sort((a,b)=>a.at-b.at);
            const used=[];
            for(const h of hits){if(used.some(x=>Math.abs(x-h.at)<900))continue;used.push(h.at);const start=Math.max(0,h.at-1800),end=Math.min(text.length,h.at+3600);out.push(`\n--- ${h.pat} @ ${h.at} ---\n`+text.slice(start,end).replace(/\r?\n/g,' '));}
          }
          fs.writeFileSync('inspect-08230-afterschool-read-path.txt',out.join('\n'),'utf8');
          '@ | Set-Content inspect-read-path.js -Encoding utf8
          node inspect-read-path.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add inspect-08230-afterschool-read-path.txt
          git commit -m 'Inspect v0.82.30 afterschool read path'
          git push origin HEAD:main

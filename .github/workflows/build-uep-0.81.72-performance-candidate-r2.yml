name: Build and Release UEP 0.82.28 Common Weighted Grade UI
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08228-common-weighted-grade-ui.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.27 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08228-common-weighted-grade-ui.js app
          node --check app/resources/app/gyomuon.js
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.28";','UEP_08227_CURRICULUM_CREDIT_WEIGHT','UEP_08228_COMMON_WEIGHTED_GRADE_UI','UEP_08228_RELEASE_NOTES',"const CURRENT='0.82.28';",'function uepCommonWeightedAverage(','const weightedAverage=uepCommonWeightedAverage(averageRows')){if(-not $g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('__UEP_08217_LOGIN_WATCHDOG__','setInterval(sync,2500)','gradeValues.reduce((a,b)=>a+b,0)/gradeValues.length')){if($g.Contains($x)){throw "forbidden regression/simple-average marker: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.28
          - 성적 화면 최근 학기 평균 카드의 별도 단순평균 계산 경로 수정
          - 성적 조회 요약/출력 요약/내신 통계 기본 평균을 18_학교교육과정DB 이수단위 가중평균으로 통일
          - 50_내신DB는 실제 이수 과목, 18_학교교육과정DB는 이수단위 가중치 기준 유지
          - 신승민(1414) 학기말 검증 기대값 1.15
          '@
          gh release create v0.82.28 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.28' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.28'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.28/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.28 · 성적 화면 기본 평균을 교육과정DB 이수단위 가중평균으로 통일'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.28 RELEASE SUCCESS","base=v0.82.27","recent-card=weighted","common-grade-averages=weighted","verification-1414=1.15","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.28 common weighted grade UI'
          git push origin HEAD:main

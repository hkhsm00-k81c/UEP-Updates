name: Build and Release UEP 0.82.31 Afterschool Planned Sessions
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08231-afterschool-planned-sessions.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.30 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08231-afterschool-planned-sessions.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/google-data.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $d=Get-Content app/resources/app/electron/google-data.cjs -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.31";','UEP_08231_AFTER_SCHOOL_PLANNED_SESSIONS',"const CURRENT='0.82.31';",'todayAfterSessions','!(program.kind==="after"&&program.isCourseMaster)')){if(-not $g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('const effectiveDate=actualDate||plannedDate||session.__date;','미래 ''예정'' 차시도 월별 일정과 당일 대시보드에 사용한다.','Boolean(effectiveDate)')){if(-not $d.Contains($x)){throw "missing data marker: $x"}}
          if($d.Contains('Boolean(actualDate) && session.__date===actualDate')){throw 'old actual-date-only filter remains'}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.31
          - 방과후학교 미래 예정 차시를 프로그램 화면의 월별 차시 카드에 미리 표시
          - 12_차시일정 날짜 우선순위: 실제수업일 → 운영일자 → 예정일
          - 대시보드 오늘의 프로그램에 오늘 예정된 방과후 차시 자동 노출
          - 강좌 마스터 중복 노출 방지 및 취소·휴강·폐강·결강 차시 제외
          '@
          gh release create v0.82.31 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.31' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.31'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.31/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.31 · 2학기 방과후 예정 차시·오늘의 프로그램 연동'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.31 RELEASE SUCCESS","base=v0.82.30","afterschool-planned-sessions=enabled","date-priority=actual-operation-planned","dashboard-today-after=enabled","master-duplicate=blocked","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.31 afterschool planned sessions'
          git push origin HEAD:main

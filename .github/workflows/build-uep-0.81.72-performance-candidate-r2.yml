name: Build and Release UEP 0.82.24 Admissions Readability
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08224-admissions-readability-state.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.23 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08224-admissions-readability-state.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $c=Get-Content app/resources/app/gyomuon.css -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.24";','UEP_08220_ADMISSIONS_REAL_CONNECT','UEP_08224_ADMISSION_STATE_RESET','UEP_08224_BASICS_AUTO_GRID','UEP_08224_TYPE_BADGES','UEP_08224_UNIVERSITY_BADGES_NAV','UEP_08224_RELEASE_NOTES',"const CURRENT='0.82.24';")){if(-not $g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('repeat(auto-fit,minmax(340px,1fr))','grid-template-columns:repeat(3,minmax(0,1fr))','.uep-type-card-badges','.uep-uni-nav-row','.uep-uni-nav-label')){if(-not $c.Contains($x)){throw "missing css marker: $x"}}
          foreach($x in @('__UEP_08217_LOGIN_WATCHDOG__','setInterval(sync,2500)')){if($g.Contains($x)){throw "forbidden regression marker: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.24
          - 대입 기초 카드가 넓은 팝업의 가로폭을 자연스럽게 사용하도록 자동 배치 개선
          - 전형 이해에 최저·면접·추천·지역인재 등 핵심 배지 강화
          - 대학 상세 주요 전형 카드의 핵심 배지 강화
          - 오늘의 대학 상단을 지역 → 대학 → 이전/현재/다음 3단 탐색으로 정리
          - 이전/다음 대학은 현재 선택 지역 안에서 이동하도록 개선
          - 전형 이해에서 대학을 본 뒤 닫고 오늘의 대학을 열 때 돌아가기 상태가 남는 문제 수정
          - 52_대입기초에 수시 합격 후 정시 지원 제한, 정시 가·나·다군, 시행계획 읽기 정보 추가
          - 운호고 실제 입결 UI는 원자료 이관 전까지 기존 구조 유지
          - 새 버전 첫 실행 수정사항 팝업 및 상단 현재 → 최신 버전 강조 유지
          - v0.82.20 이후 실시간 대입 시트 연결 로직 유지
          '@
          gh release create v0.82.24 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.24' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.24'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.24/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.24 · 대입상담 가독성/배지/탐색상태 개선 + 대입기초 실질정보 보강'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.24 RELEASE SUCCESS","base=v0.82.23","ui=basics-auto-grid,type-badges,university-badges,today-three-level-nav","state=close-reset,explicit-dashboard-source","content=52-basics-practical-rules","release-ux=first-run-popup,current-to-latest-version-highlight","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.24 admissions readability and state fixes'
          git push origin HEAD:main

name: Build and Release UEP 0.82.21 Admissions UI
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08221-admissions-ui-releaseux.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.20 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08221-admissions-ui-releaseux.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $c=Get-Content app/resources/app/gyomuon.css -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.21";','UEP_08220_ADMISSIONS_REAL_CONNECT','UEP_08221_ADMISSIONS_UI_RELEASE_UX','uep08221ShowReleaseNotes','uep08221EnsureVersionBadge','uep08221OpenUniversityFromTypes')){if(-not $g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('#uep-global-version-badge','#uep-release-notes-overlay','#uep-admission-back-button','.admission-explain-grid article')){if(-not $c.Contains($x)){throw "missing css marker: $x"}}
          foreach($x in @('__UEP_08217_LOGIN_WATCHDOG__','setInterval(sync,2500)')){if($g.Contains($x)){throw "forbidden regression marker: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.21
          - 대입 기초·전형 이해·오늘의 대학 UI 가독성 개선
          - 본문 글자와 행간 확대, 카드 정보 위계 및 옅은 유형별 배경 적용
          - 상담/주의 정보와 대학 탐색 버튼 가독성 강화
          - 전형 이해에서 대학 상세로 이동 후 돌아가기 버튼 추가
          - 프로그램 최상단에 현재 버전 상시 표시
          - 새 버전 첫 실행 시 수정사항 팝업 자동 표시 구조 복구
          - v0.82.20 대입상담 실시간 시트 연결 로직은 그대로 유지
          '@
          gh release create v0.82.21 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.21' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.21'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.21/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.21 · 대입상담 UI 개선 + 버전/수정사항 표시 복구'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.21 RELEASE SUCCESS","base=v0.82.20","ui=admissions-readability,back-navigation","release-ux=version-badge,first-run-popup","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.21 admissions UI and release UX'
          git push origin HEAD:main

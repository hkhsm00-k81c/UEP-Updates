name: Build and Release UEP 0.82.29 Remaining Weighted Grade Paths
'on':
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08229-remaining-weighted-grade-paths.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.28 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08229-remaining-weighted-grade-paths.js app
          node --check app/resources/app/gyomuon.js
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.29";','UEP_08228_COMMON_WEIGHTED_GRADE_UI','UEP_08229_REMAINING_WEIGHTED_GRADE_PATHS','UEP_08229_RELEASE_NOTES',"const CURRENT='0.82.29';",'function scoreAverage(rows) {','return uepCommonWeightedAverage(rows,row=>Number(row.level));','weightedStudentBase=admissionBase(live.id)')){if(-not $g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('__UEP_08217_LOGIN_WATCHDOG__','setInterval(sync,2500)','values.reduce((sum, value) => sum + value, 0) / values.length')){if($g.Contains($x)){throw "forbidden regression/simple-average marker: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.29
          - 성적 > 종합성적 > 개인별 조회의 최근 내신 평균을 이수단위 가중평균으로 수정
          - 학생정보 개인 대시보드의 최근 내신 평균도 같은 가중평균으로 수정
          - 성적 > 내신 개인별 조회 / 내신 통계 / 종합성적 / 학생정보 대시보드의 기본 내신 평균 계산을 통일
          - 신승민(1414) 검증 기대값: 모든 해당 화면 1.15
          '@
          gh release create v0.82.29 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.29' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.29'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.29/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.29 · 종합성적/학생정보까지 교육과정DB 이수단위 가중평균 완전 통일'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.29 RELEASE SUCCESS","base=v0.82.28","combined-individual=weighted","student-dashboard=weighted","verification-1414=1.15","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.29 remaining weighted grade paths'
          git push origin HEAD:main

name: Inspect UEP 0.82.49 Sync Functions
on: {push: {paths: ['inspect-08249-sync-functions.trigger']}}
permissions: {contents: read}
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop';mkdir source,app -Force|Out-Null;gh release download v0.82.49 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source;if($LASTEXITCODE){throw 'download'};Expand-Archive source/UEP-update.zip app -Force
          $out='';foreach($f in @('app/resources/app/electron/main.cjs','app/resources/app/electron/google-data.cjs','app/resources/app/electron/preload.cjs','app/resources/app/gyomuon.js')){$t=Get-Content $f -Raw;$out+="### $f`n";foreach($n in @('previewReadonlySync','readReadonlyCache','syncReadonly','readonlyCache=','loadReadonly','buildReadonly','readGoogle','fetchReadonly')){$i=0;while(($i=$t.IndexOf($n,$i)) -ge 0){$s=[Math]::Max(0,$i-3500);$l=[Math]::Min(9000,$t.Length-$s);$out+=$t.Substring($s,$l)+"`n---`n";$i+=$n.Length}}};$out|Set-Content sync.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with: {name: sync-functions, path: sync.txt}

name: Inspect UEP 0.82.27 source anchors
'on':
  push:
    branches: [main]
    paths: [inspect-08227-source.trigger]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.26 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $out=@()
          foreach($f in @('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs')){
            $out += "===== FILE: $f ====="
            $lines=Get-Content $f -Encoding UTF8
            $hits=Select-String -Path $f -Pattern '57_내신산정DB|admissionGrade|uep08210MatrixObjects|matrices\[|readonlyCache|parseGoogleSheetData|fetchLiveData|A1:Y1200|A1:T500' -Encoding UTF8
            $seen=@{}
            foreach($hit in $hits){
              $i=$hit.LineNumber-1
              $a=[Math]::Max(0,$i-8); $b=[Math]::Min($lines.Count-1,$i+12)
              $key="$a-$b"
              if($seen.ContainsKey($key)){continue}; $seen[$key]=$true
              $out += "--- match line $($i+1): $($hit.Line.Trim()) ---"
              for($j=$a;$j -le $b;$j++){ $out += ('{0}: {1}' -f ($j+1),$lines[$j]) }
            }
          }
          $out | Set-Content inspect-08227-source.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspect-08227-source.txt
          git commit -m 'Inspect v0.82.26 anchors for 0.82.27'
          git push origin HEAD:main

name: Build UEP 0.81.95 Selection Safe Runtime
'on':
  push:
    branches:
      - candidate/0.81.95-selection-safe-runtime
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download clean official 0.81.94
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,out,verify | Out-Null
          gh release download v0.81.94 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $gy=Get-ChildItem -Path app -Recurse -Filter 'gyomuon.js' | Where-Object {$_.FullName -match 'resources[\\/]app[\\/]gyomuon\.js$'} | Select-Object -First 1
          if(-not $gy){throw 'official 0.81.94 gyomuon.js missing'}
          $appDir=Split-Path $gy.FullName -Parent
          $resourcesDir=Split-Path $appDir -Parent
          $root=Split-Path $resourcesDir -Parent
          "UEP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Apply only validated selection patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-08195-selection-normalizer.js "$env:UEP_ROOT"
          if($LASTEXITCODE -ne 0){throw 'normalizer patch failed'}
          node scripts/patch-uep-08195-selection-priorterm-fix.js "$env:UEP_ROOT"
          if($LASTEXITCODE -ne 0){throw 'prior-term fix failed'}
          node scripts/patch-uep-08195-selection-output.js "$env:UEP_ROOT"
          if($LASTEXITCODE -ne 0){throw 'output patch failed'}
          node scripts/patch-uep-08195-selection-finalize.js "$env:UEP_ROOT"
          if($LASTEXITCODE -ne 0){throw 'finalize patch failed'}
          node scripts/patch-uep-08195-selection-finalize-writefix.js "$env:UEP_ROOT"
          if($LASTEXITCODE -ne 0){throw 'decision writefix failed'}
          node scripts/patch-uep-08195-selection-safe-sync.js "$env:UEP_ROOT"
          if($LASTEXITCODE -ne 0){throw 'safe sync patch failed'}
      - name: Verify UI bindings and persistence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/verify-uep-08195-selection-normalizer.js "$env:UEP_ROOT"
          if($LASTEXITCODE -ne 0){throw 'candidate verifier failed'}
          $gy="$env:UEP_ROOT/resources/app/gyomuon.js"
          $text=Get-Content $gy -Raw
          if($text -notmatch 'UEP_08195_SELECTION_SAFE_SYNC_START'){throw 'safe sync marker missing'}
          if($text -match 'UEP_08195_SELECTION_SYNC_REGENERATE_START'){throw 'failed sync-regenerate patch must not be present'}
          if($text -notmatch [regex]::Escape("$$('[data-curriculum-workspace]').forEach(b=>b.onclick=async()=>{/* __UEP_08163_CURRICULUM_BINDINGS__ */")){throw 'original curriculum workspace binder missing'}
          foreach($f in @("$env:UEP_ROOT/resources/app/gyomuon.js","$env:UEP_ROOT/resources/app/electron/main.cjs","$env:UEP_ROOT/resources/app/electron/preload.cjs")){
            node --check $f
            if($LASTEXITCODE -ne 0){throw "syntax failed: $f"}
          }
      - name: Package safe runtime candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path "$env:UEP_ROOT/*" -DestinationPath out/UEP-update-0.81.95-selection-safe-runtime.zip -CompressionLevel Optimal
          Expand-Archive out/UEP-update-0.81.95-selection-safe-runtime.zip verify -Force
          foreach($f in @('verify/resources/app/gyomuon.js','verify/resources/app/electron/main.cjs','verify/resources/app/electron/preload.cjs')){
            node --check $f
            if($LASTEXITCODE -ne 0){throw "archive syntax failed: $f"}
          }
          $sha=(Get-FileHash out/UEP-update-0.81.95-selection-safe-runtime.zip -Algorithm SHA256).Hash.ToLower()
          @('candidate=0.81.95-selection-safe-runtime','base=0.81.94-official','ui-bindings=0.81.94-preserved','06=read-only-source','51=direct-persist','52=direct-persist','apps-script=not-required',"sha256=$sha") | Set-Content out/UEP-0.81.95-selection-safe-runtime-report.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.95-selection-safe-runtime
          path: out/*
          retention-days: 7

name: Audit UEP 0.83.01 Board menu
on:
  push:
    branches: [main]
    paths:
      - audit-08301-board-menu.trigger
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.83.01 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/uep08301
          gh release download v0.83.01 -R "$GITHUB_REPOSITORY" -p 'UEP-update.zip' -D /tmp/uep08301
          unzip -q /tmp/uep08301/UEP-update.zip -d /tmp/uep08301/app
      - name: Inspect Board menu and backend
        run: |
          set -euo pipefail
          ROOT=/tmp/uep08301/app/resources/app
          echo '=== GYOMUON BOARD UI 1180-1600 ==='
          sed -n '1180,1600p' "$ROOT/gyomuon.js"
          echo '=== MAIN BOARD BACKEND 2200-2660 ==='
          sed -n '2200,2660p' "$ROOT/electron/main.cjs"

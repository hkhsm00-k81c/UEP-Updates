name: Inspect UEP 0.80.85 Dashboard

on:
  push:
    paths:
      - inspect-085-dashboard.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-dashboard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.80.85 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.80.85
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diagnostics | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Capture dashboard render code
        shell: pwsh
        run: |
          $out='diagnostics/dashboard-085.txt'
          'UEP 0.80.85 dashboard render inspection' | Set-Content $out -Encoding UTF8
          $g='app/resources/app/gyomuon.js'
          $lines=Get-Content $g -Encoding UTF8
          Add-Content $out "`n=== navigate/render exact block ===" -Encoding UTF8
          for($i=990;$i -le 1135;$i++){ if($i -le $lines.Count){ Add-Content $out (('{0}: {1}' -f $i,$lines[$i-1])) -Encoding UTF8 } }
          Add-Content $out "`n=== dashboard definitions ===" -Encoding UTF8
          Select-String -Path $g -Pattern 'dashboardView|function dashboard|const dashboard|let dashboard' -Context 5,25 | Select-Object -First 120 | ForEach-Object {Add-Content $out $_.ToString() -Encoding UTF8}
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/dashboard-085.txt
          git commit -m 'Inspect exact UEP 0.80.85 dashboard renderer' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

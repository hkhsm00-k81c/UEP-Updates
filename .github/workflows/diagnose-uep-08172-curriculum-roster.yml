name: Diagnose UEP 0.81.72 Curriculum Roster Renderer
'on':
  push:
    branches: [main]
    paths:
      - diagnose-uep-08172-curriculum-roster.trigger
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.72
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.72 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Locate native roster renderer
        shell: pwsh
        run: node scripts/diagnose-uep-08172-curriculum-roster-source.js

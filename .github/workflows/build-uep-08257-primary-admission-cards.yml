name: Build and Release UEP 0.82.57 Primary Admission Cards
on: {push: {paths: ['release-08257.trigger']}}
permissions: {contents: write}
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop';function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.56 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download'
          Expand-Archive source/UEP-update.zip app -Force;$root='app/resources/app'
          Run-Native {node scripts/patch-uep-08257-primary-admission-cards.js $root} 'patch'
          Run-Native {node --check "$root/gyomuon.js"} 'renderer syntax'
          Run-Native {node scripts/test-uep-08257-primary-admission-cards.js $root} 'regression test'
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt
          Run-Native {gh release create v0.82.57 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.57' --notes "UEP v0.82.57`n- 오늘의 대학 기본 화면은 학생부교과·학생부종합 일반전형만 표시`n- 논술·실기·정시·지원자격 제한·운호고 지원불가 전형은 다른 전형 자세히 보기로 이동`n- 교과·종합·논술·정시 카드 색상 구분`n- 53B UEP전형그룹에 실기·정시 추가`n- UEP자격제한·UEP운호고지원 시트값 우선 및 기존 호환분류 유지`n- 상담포인트 자식 팝업 구조 유지"} 'release'
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json;$policy.latestVersion='0.82.57';$policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.57/UEP-update.zip';$policy.sha256=$sha;$policy.message='UEP 0.82.57 · 교과·종합 중심 오늘의 대학 전형화면';$policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          Run-Native {git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json;git commit -m 'Publish UEP 0.82.57 policy';git push} 'policy push'

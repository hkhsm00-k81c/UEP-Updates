name: Publish UEP 0.81.73 Curriculum Stable
'on':
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.73-curriculum.trigger
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.73-curriculum
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.72 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.72 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          if(!(Test-Path app/UEP.exe)){throw '0.81.72 baseline UEP.exe missing'}
      - name: Apply verified 0.81.73 R13 curriculum chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $scripts=@('scripts/patch-uep-08173-curriculum-workspace.js','scripts/fix-uep-08173-curriculum-workspace-syntax.js','scripts/fix-uep-08173-curriculum-runtime.js','scripts/fix-uep-08173-curriculum-runtime-boundary.js','scripts/patch-uep-08173-native-roster-print.js')
          foreach($script in $scripts){node --check $script;if($LASTEXITCODE -ne 0){throw "patch syntax failed: $script"};node $script;if($LASTEXITCODE -ne 0){throw "patch failed: $script"}}
          foreach($f in @('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs')){node --check $f;if($LASTEXITCODE -ne 0){throw "runtime syntax failed: $f"}}
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.73';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
      - name: Verify curriculum security, decisions and native roster print
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($good in @('const APP_VERSION = "0.81.73";','subjectConfidentialPasswordHash','SUBJECT_CONFIDENTIAL_PIN_HASH','문이과 교차오류','과목별 신청현황','__uepCurriculumWorkspace08173','UEP_08173_CURRICULUM_WORKSPACE_START','폐강대상','개설 유지','폐강 확정','runRenderPostProcess08172','GROWTH_RENDER_PAGES08172','function ownCourseSummary','summaryCount(card)!==1','function existingStatusBadge','function applyCourseStatus','UEP_08173_CURRICULUM_BOUNDARY_WRAPPER','curriculum enhancement skipped',"if(!card)return ''",'function uepOpenSubjectModal08128(key)','function uepPrintSubjectRoster08173(selected)','data-native-roster-print="1"','신청명단 출력')){if(-not $g.Contains($good)){throw "0.81.73 runtime marker missing: $good"}}
          foreach($good in @('uepCrossTrackRows08161','uepCrossTrackView08161','uepSelectionDataset','curriculumWorkspaceMode','curriculumTermFilter','curriculumRosterSort')){if(-not $g.Contains($good)){throw "existing curriculum function missing: $good"}}
          if($g.Contains('observe(document.documentElement')){throw 'document-wide MutationObserver regression'}
          if($g.Contains('function visibleRosterSortButtons')){throw 'legacy roster DOM attachment remains'}
          if(-not $g.Contains("window.__uepCurriculumWorkspace08173?.()")){throw 'page-scoped curriculum post-render hook missing'}
          Write-Host '0.81.73 R13 curriculum verification PASS'
      - name: Reopen final package and verify hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path verify/UEP.exe)){throw 'final UEP.exe missing'}
          foreach($f in @('verify/resources/app/gyomuon.js','verify/resources/app/electron/main.cjs','verify/resources/app/electron/preload.cjs')){node --check $f;if($LASTEXITCODE -ne 0){throw "archive syntax failed: $f"}}
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json;if($pkg.version -ne '0.81.73'){throw "package version mismatch: $($pkg.version)"}
          $vg=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($good in @('const APP_VERSION = "0.81.73";','subjectConfidentialPasswordHash','폐강 확정','function uepPrintSubjectRoster08173(selected)','data-native-roster-print="1"','신청명단 출력')){if(-not $vg.Contains($good)){throw "archive marker missing: $good"}}
          if($vg.Contains('function visibleRosterSortButtons')){throw 'archive contains legacy roster DOM attachment'}
          $src=(Get-FileHash app/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower().Trim();$dst=(Get-FileHash verify/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower().Trim();if($src -ne $dst){throw 'gyomuon hash mismatch after package reopen'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower().Trim();"UEP_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "0.81.73 final package PASS sha256=$sha"
      - name: Publish v0.81.73 and promote stable auto-update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $exists=$false;try{gh release view v0.81.73 --repo $env:GITHUB_REPOSITORY *> $null;$exists=$true}catch{$exists=$false};if($exists){throw 'v0.81.73 release already exists; refusing to overwrite a stable release'}
          $notes=@('UEP 0.81.73은 교육과정 작업공간의 UX와 선택과목 운영 기능을 정리한 안정화 버전입니다.','','- 교육과정 화면을 프로그램 페이지와 일관된 카드형 작업공간으로 정리했습니다.','- 문이과 교차오류·과목별 신청현황의 기존 비밀번호 보호와 성적 분석 기능을 유지합니다.','- 과목별 신청인원을 기준으로 25명 이하 과목을 폐강대상으로 표시하고, 개설 유지·폐강 확정 상태를 선택할 수 있습니다.','- 과목카드별 상태 선택은 실제 과목카드에만 1개씩 표시되도록 구조를 정리했습니다.','- 과목별 신청현황 우측 원본 패널에 신청명단 출력 기능을 정식 연결했습니다.','- 출력 명단은 성적정보를 제외하고 학년·반·번호·학번·성명 순으로 정리하며 과목명·신청인원·출력시각을 함께 표시합니다.','- 기존 교육과정 렌더링과 보안 기능은 그대로 유지하며 신규 보조 기능 오류가 본 화면을 중단하지 않도록 경계를 두었습니다.') -join [Environment]::NewLine
          gh release create v0.81.73 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.73 Curriculum Workspace & Roster Print' --notes $notes
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.73/UEP-update.zip'
          git pull --rebase origin main
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.73';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256.Trim();$policy.message='교육과정 UX 개선 · 폐강대상/개설상태 관리 · 과목별 신청명단 출력';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.73';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256.Trim();notes='교육과정 카드 UX · 선택과목 보안 유지 · 25명 이하 폐강대상 · 개설상태 관리 · 과목별 신청명단 출력'}|ConvertTo-Json;Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json
          git commit -m 'release: promote UEP 0.81.73 curriculum stable'
          git push

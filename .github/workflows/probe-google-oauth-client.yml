name: Probe UEP Google OAuth Client
on:
  push:
    paths:
      - probe-google-oauth.trigger
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe token endpoint without client secret
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID=$(python - <<'PY'
import json
print(json.load(open('uep-policy.json',encoding='utf-8'))['googleOAuthClientId'])
PY
)
          echo "client_id=$CLIENT_ID"
          RESP=$(curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -X POST 'https://oauth2.googleapis.com/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode 'code=UEP_DIAGNOSTIC_INVALID_CODE' \
            --data-urlencode 'code_verifier=UEP_DIAGNOSTIC_INVALID_VERIFIER' \
            --data-urlencode 'redirect_uri=http://127.0.0.1:53682' \
            --data-urlencode 'grant_type=authorization_code')
          echo "$RESP"
          if echo "$RESP" | grep -q '"error": "invalid_client"'; then
            echo 'RESULT=INVALID_CLIENT'
            exit 2
          fi
          if echo "$RESP" | grep -q '"error": "invalid_grant"'; then
            echo 'RESULT=CLIENT_ACCEPTED_SECRETLESS'
            exit 0
          fi
          if echo "$RESP" | grep -q '"error": "unauthorized_client"'; then
            echo 'RESULT=UNAUTHORIZED_CLIENT'
            exit 3
          fi
          echo 'RESULT=UNEXPECTED_RESPONSE'
          exit 4

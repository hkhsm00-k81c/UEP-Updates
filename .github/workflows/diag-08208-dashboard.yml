name: Diagnose UEP 0.82.08 Dashboard
on:
  push:
    branches: [main]
    paths: [diag-08208.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.08 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $p='app/resources/app/gyomuon.js'
          $g=Get-Content $p -Raw
          $patterns=@('readonlyCache','학교업무공지·마감','게시 중 직접공지','자동 마감공지','dashboardReportStatusRows','loadReadonly','readOnly','sheet','spreadsheet','google','apiFetch','fetch(','ipcRenderer','invoke(')
          $out=@()
          foreach($pat in $patterns){
            $out += "===== PATTERN: $pat ====="
            $m=[regex]::Matches($g,[regex]::Escape($pat))
            $count=[Math]::Min($m.Count,12)
            for($i=0;$i -lt $count;$i++){
              $idx=$m[$i].Index; $start=[Math]::Max(0,$idx-900); $len=[Math]::Min(2200,$g.Length-$start)
              $out += $g.Substring($start,$len)
              $out += "`n---`n"
            }
          }
          $out | Set-Content diag-08208-dashboard.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag-08208-dashboard.txt
          git commit -m 'Capture UEP 0.82.08 dashboard diagnostics'
          git push origin HEAD:main

name: Diagnose UEP 0.81.74 Date Paths
'on':
  push:
    branches: [main]
    paths:
      - diag-uep-0.81.74-date-paths.trigger
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect stable 0.81.74
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force app | Out-Null
          gh release download v0.81.74 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip app -Force
          @'
          const fs=require('fs');
          const g=fs.readFileSync('app/resources/app/gyomuon.js','utf8');
          const keys=['참여 프로그램 전체 이력','차시별 일정','오후자습','야자연계여부','programHistory','sessionDate','startTime','endTime','formatDate','toISOString','new Date(','excel','serial','sheetDate','방과후학교'];
          const lines=g.split(/\r?\n/);
          for(const key of keys){
            console.log('\n===== KEY '+key+' =====');
            let n=0;
            lines.forEach((line,i)=>{if(line.includes(key)&&n<20){const s=Math.max(0,i-3),e=Math.min(lines.length,i+4);console.log('--- line '+(i+1)+' ---\n'+lines.slice(s,e).join('\n'));n++;}});
            console.log('matches shown='+n);
          }
          '@ | Set-Content diag.js -Encoding UTF8
          node diag.js

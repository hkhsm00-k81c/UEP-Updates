name: Inspect UEP 0.82.52 Google Write
on:
  push:
    paths: ['inspect-08252-google-write.trigger']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.52 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source; if($LASTEXITCODE){throw 'download'}
          Expand-Archive source/UEP-update.zip app -Force
          $files=@('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs','app/resources/app/electron/google-data.cjs')
          $patterns=@('ipcRenderer.invoke','ipcMain.handle','append','write','update','sheet','save','state:save','google')
          $out=''
          foreach($f in $files){$out+="### $f`n";$lines=Get-Content $f;for($i=0;$i -lt $lines.Count;$i++){foreach($p in $patterns){if($lines[$i] -match [regex]::Escape($p)){$s=[Math]::Max(0,$i-5);$e=[Math]::Min($lines.Count-1,$i+12);$out+=($lines[$s..$e]-join "`n")+"`n---`n";break}}}}
          $out|Set-Content write.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with: {name: google-write-inspection, path: write.txt}

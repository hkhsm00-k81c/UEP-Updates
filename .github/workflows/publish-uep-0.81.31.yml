name: Publish UEP 0.81.31 Student Selection Fix

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-uep-0.81.31.yml
      - scripts/patch-uep-0.81.31.js
      - publish-uep-0.81.31.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.31
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download shipped 0.81.30
        shell: pwsh
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,out | Out-Null
          gh release download v0.81.30 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force

      - name: Apply student selection and subject popup fix
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.31.js app
          node --check app/resources/app/gyomuon.js

      - name: Verify student selection invariants
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs=require('fs');
          const g=fs.readFileSync('app/resources/app/gyomuon.js','utf8');
          const checks=[
            'const APP_VERSION = "0.81.31";',
            'return controls+detail+list;',
            'data-record-student=',
            'data-uep-student-prev',
            'data-uep-student-next',
            "$$('[data-curriculum-subject]').forEach(b=>b.onclick=()=>{curriculumSubjectKey=b.dataset.curriculumSubject;uepOpenSubjectModal08128(curriculumSubjectKey);});",
            'function uepOpenSubjectModal08128(',
            '<span>학사여부</span>',
            '<span>1학년 내신평균</span>',
            '<span>예상등수</span>',
            '<span>예상등급</span>'
          ];
          for(const x of checks) if(!g.includes(x)) throw new Error('missing 0.81.31 invariant: '+x);
          const bad=/(?<!\$)\$\('\[data-curriculum-subject\]'\)\.forEach/g;
          if(bad.test(g)) throw new Error('broken single-element subject card binding remains');
          const legacy=/\$\$\('\[data-curriculum-subject\]'\)\.forEach\(b=>b\.onclick=\(\)=>\{curriculumSubjectKey=b\.dataset\.curriculumSubject;render\('records'\);\}\);/;
          if(legacy.test(g)) throw new Error('legacy subject-card render binding remains');
          console.log('0.81.31 student navigation and subject popup invariants PASS');
          '@ | Set-Content verify-08131.js -Encoding UTF8
          node verify-08131.js

      - name: Build 0.81.31 package
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $pkg='app/resources/app/package.json'
          $j=Get-Content $pkg -Raw -Encoding UTF8 | ConvertFrom-Json
          $j.version='0.81.31'
          $j | ConvertTo-Json -Depth 50 | Set-Content $pkg -Encoding UTF8
          Compress-Archive -Path app/* -DestinationPath out/UEP-update.zip -Force
          $hash=(Get-FileHash out/UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish v0.81.31
        shell: pwsh
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.31'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){ gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          $global:LASTEXITCODE=0
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.31' --notes 'Student selection and subject popup fix: selected student detail appears immediately above the roster, prev/next navigation is preserved, and every subject card opens the applicant popup with dormitory, grade, expected rank and expected grade.' --draft
          gh release upload $tag out/UEP-update.zip --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false

      - name: Promote updater fields to 0.81.31
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.31/UEP-update.zip'
          $notes='학생 선택 상세 상단 표시·좌우이동 및 과목카드 신청학생 팝업 연결 수정'
          $manifest=@{version='0.81.31';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes=$notes} | ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8
          Set-Content uep-version.json $manifest -Encoding UTF8
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.31'
          $policy.downloadUrl=$url
          $policy.sha256=$env:UEP_SHA256
          $policy.message=$notes
          if($policy.homeroomStableVersion){$policy.homeroomStableVersion='0.81.31'}
          if($policy.sharedBoardStableVersion){$policy.sharedBoardStableVersion='0.81.31'}
          $policy | ConvertTo-Json -Depth 50 | Set-Content uep-policy.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-update.json uep-version.json uep-policy.json
          if(-not (git diff --cached --quiet)){git commit -m 'release: promote UEP 0.81.31 all updater fields';git push}

      - name: Final release consistency check
        shell: pwsh
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force verify | Out-Null
          gh release download v0.81.31 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir verify
          $actual=(Get-FileHash verify/UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          if($actual -ne $env:UEP_SHA256){throw 'published ZIP SHA mismatch'}
          Expand-Archive verify/UEP-update.zip verify/app -Force
          $g=Get-Content verify/app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $pkg=Get-Content verify/app/resources/app/package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if(-not $g.Contains('const APP_VERSION = "0.81.31";')){throw 'published runtime is not 0.81.31'}
          if($pkg.version -ne '0.81.31'){throw 'published package is not 0.81.31'}
          if(-not $g.Contains('function uepOpenSubjectModal08128(')){throw 'published runtime is missing subject popup function'}
          Write-Host 'UEP 0.81.31 package and updater manifests are consistent.'

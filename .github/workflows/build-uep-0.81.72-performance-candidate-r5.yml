name: Build UEP 0.81.72 Performance Candidate R5
'on':
  push:
    branches: [main]
    paths:
      - build-uep-0.81.72-performance-candidate-r5.trigger
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.71
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,out | Out-Null
          gh release download v0.81.71 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Apply all 0.81.72 structural scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('scripts/patch-uep-08172-structure.js','scripts/patch-uep-08172-operational-writes.js','scripts/patch-uep-08172-refresh-policy.js','scripts/patch-uep-08172-input-contact.js')){
            node $script
            if($LASTEXITCODE -ne 0){throw "patch failed: $script"}
          }
      - name: Hard syntax checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs')){node --check $file;if($LASTEXITCODE -ne 0){throw "syntax failed: $file"}}
      - name: Structural and hot-path checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          $p=Get-Content app/resources/app/electron/preload.cjs -Raw -Encoding UTF8
          foreach($bad in @('UEP_08134_CURRICULUM_SECURITY_START','setInterval(tick,2000)','setInterval(syncSchoolReadAuthBadge,5000)')){if($g.Contains($bad)){throw "legacy marker remains: $bad"}}
          foreach($good in @('refreshOperationalCacheSilently','refreshInputCenterSourceSilently','READONLY_FULL_REFRESH_MAX_AGE_MS','syncSchoolReadAuthBadgeFromState')){if(-not $g.Contains($good)){throw "renderer marker missing: $good"}}
          foreach($good in @('fetchOperationalData','fetchInputCenterSourceData','inputCenter:refreshSource')){if(-not $m.Contains($good)){throw "main marker missing: $good"}}
          foreach($good in @('previewOperationalSync','refreshInputCenterSource')){if(-not $p.Contains($good)){throw "preload marker missing: $good"}}
          if($g -match 'inputCenterDrafts=\[\];\s*await refreshReadonlyCacheSilently'){throw 'input save still full-refreshes'}
          if($g -match 'classifyInputBatch[\s\S]{0,1600}?await refreshReadonlyCacheSilently'){throw 'input classify still full-refreshes'}
          if($g -match 'saveStudentContact[\s\S]{0,1600}?readonlyCache=result\.data\|\|readonlyCache'){throw 'contact renderer still whole-cache replaces'}
          $contactStart=$m.IndexOf('async function saveStudentContact');$contactEnd=$m.IndexOf('async function ',$contactStart+20);$contact=$m.Substring($contactStart,$contactEnd-$contactStart);if($contact -match 'fetchLiveData\(\{\s*force\s*:\s*true'){throw 'contact save still full-refreshes'}
          $normalizeStart=$g.IndexOf('normalizeInputBatch');if($normalizeStart -lt 0){throw 'normalize input path missing'}
          if(-not $g.Substring($normalizeStart,[Math]::Min(2500,$g.Length-$normalizeStart)).Contains('refreshReadonlyCacheSilently({force:true,rerender:false})')){throw 'normalize full refresh was removed unexpectedly'}
      - name: Input-source parser fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const headers=['입력ID','배치ID','입력경로','자료유형','세부유형','학년도','학기','학생ID','학번','성명','학년','반','원본파일명','원본보관경로','자료제목','원본텍스트','구조화데이터','처리상태','매칭상태','프로그램ID','프로그램구분','등록교사','등록일시','비고'];
          const row=['SRC-1','B1','교사 파일','보고서','보고서 제출','2026','2','S1','1101','테스트','1','1','a.xlsx','','테스트자료','본문','{}','원문등록','정상','P1','selected','교사','2026-08-26T00:00:00Z',''];
          const o=Object.fromEntries(headers.map((h,i)=>[h,row[i]??'']));
          const mapped={id:o['입력ID'],batchId:o['배치ID'],studentNo:o['학번'],name:o['성명'],programId:o['프로그램ID'],status:o['처리상태']};
          if(mapped.id!=='SRC-1'||mapped.studentNo!=='1101'||mapped.programId!=='P1')throw new Error('input source mapping failed');
          console.log('input source fixture PASS');
          '@ | Set-Content test-r5-input.js -Encoding UTF8
          node test-r5-input.js
          if($LASTEXITCODE -ne 0){throw 'input source fixture failed'}
      - name: Package and archive revalidation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path app/* -DestinationPath out/UEP-update-0.81.72-candidate-r5.zip -CompressionLevel Optimal
          New-Item -ItemType Directory -Force verify | Out-Null
          Expand-Archive out/UEP-update-0.81.72-candidate-r5.zip verify -Force
          foreach($file in @('verify/resources/app/gyomuon.js','verify/resources/app/electron/main.cjs','verify/resources/app/electron/preload.cjs')){node --check $file;if($LASTEXITCODE -ne 0){throw "archive syntax failed: $file"}}
          $sha=(Get-FileHash out/UEP-update-0.81.72-candidate-r5.zip -Algorithm SHA256).Hash.ToLower()
          @("candidate=0.81.72-r5","base=0.81.71-stable","sha256=$sha","input-save=source-only","input-classify=source-only","input-normalize=full-intentional","contact=record-patch","program-admin=full-intentional","release=no") | Set-Content out/UEP-0.81.72-candidate-r5-report.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.72-performance-candidate-r5
          path: out/*
          retention-days: 7

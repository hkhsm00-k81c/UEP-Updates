name: Inspect UEP Grade Average Formula
'on':
  push:
    branches: [main]
    paths: [inspect-grade-average.trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.25 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $p='app/resources/app/gyomuon.js'
          $lines=Get-Content $p -Encoding UTF8
          $start=(Select-String -Path $p -Pattern 'function admissionBase' -SimpleMatch -Encoding UTF8 | Select-Object -First 1).LineNumber
          if(-not $start){ throw 'function admissionBase not found' }
          $next=(Select-String -Path $p -Pattern '^function ' -Encoding UTF8 | Where-Object {$_.LineNumber -gt $start} | Select-Object -First 1).LineNumber
          if(-not $next){$next=[Math]::Min($lines.Count,$start+250)}
          Write-Host ("===== admissionBase lines {0}-{1} =====" -f $start,($next-1))
          for($i=$start;$i -lt $next;$i++){
            Write-Host ("{0}: {1}" -f $i,$lines[$i-1])
          }
          Write-Host '===== DIRECT avg5 / actual9 references ====='
          Select-String -Path $p -Pattern 'avg5|actual9|actualDetails|rankTo|percentile|enrollment' -Encoding UTF8 -Context 8,12 | Select-Object -First 120 | ForEach-Object {
            Write-Host ("LINE {0}: {1}" -f $_.LineNumber,$_.Line)
            foreach($c in $_.Context.PreContext){Write-Host ('  PRE: '+$c)}
            foreach($c in $_.Context.PostContext){Write-Host (' POST: '+$c)}
          }

name: Inspect UEP 0.81.94 selection backend
on:
  workflow_dispatch:
  push:
    branches:
      - candidate/0.81.95-selection-normalizer
    paths:
      - .github/workflows/inspect-uep-08194-selection-backend.yml
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official 0.81.94 package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.94/UEP-update.zip' -OutFile 'UEP-update-0.81.94.zip'
          Expand-Archive -Path 'UEP-update-0.81.94.zip' -DestinationPath 'unpacked' -Force
      - name: Inspect anchors
        shell: pwsh
        run: |
          $gy = Get-ChildItem unpacked -Recurse -Filter gyomuon.js | Where-Object {$_.FullName -match 'resources[\\/]app[\\/]gyomuon\.js$'} | Select-Object -First 1
          $app = Split-Path $gy.FullName -Parent
          $main = Join-Path $app 'electron/main.cjs'
          $gd = Join-Path $app 'electron/google-data.cjs'
          Write-Host '--- main configured spreadsheet identifiers ---'
          Select-String -Path $main -Pattern 'UEP_RULES_SPREADSHEET_ID|UEP_PROCESSING_SPREADSHEET_ID|readSheetBatch|updateSheetValues|clearSheetValues|appendSheetValues' | ForEach-Object {$_.Line} | Select-Object -First 120
          Write-Host '--- google-data selection config ---'
          Select-String -Path $gd -Pattern 'UEP_RULES_SPREADSHEET_ID|UEP_PROCESSING_SPREADSHEET_ID|41_선택과목규칙|51_선택과목오류' | ForEach-Object {$_.Line} | Select-Object -First 80
          Write-Host '--- legacy decision authority full contexts ---'
          Select-String -Path $gy.FullName -Pattern 'DECISION_KEY|loadDecisions|saveDecisions|courseDecision|폐강확정|개설유지' -Context 4,6 | ForEach-Object { '---'; $_.Context.PreContext; $_.Line; $_.Context.PostContext } | Select-Object -First 500

name: Inspect UEP 0.82.63 Night Schedule

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-uep-08263-night-schedule.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.82.63 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v0.82.63 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip work -Force
          if(-not (Test-Path 'work/resources/app/gyomuon.js')) { throw 'gyomuon.js missing' }
          if(-not (Test-Path 'work/resources/app/electron/google-data.cjs')) { throw 'google-data.cjs missing' }
      - name: Extract focused generation contexts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@('work/resources/app/gyomuon.js','work/resources/app/electron/google-data.cjs')
          $terms=@('function afterSchoolProgramGroups','afterSchoolProgramGroups=','function programHasNightStudyImpact','programHasNightStudyImpact=','function programWithOverride','programWithOverride=','isCourseMaster','programType==="방과후학교"','프로그램유형','실제수업일','sessionRows','readonlyCache?.programs')
          $out=New-Object System.Collections.Generic.List[string]
          $out.Add('UEP 0.82.63 focused night schedule generation inspection')
          foreach($p in $files){
            $s=Get-Content $p -Raw -Encoding UTF8
            $out.Add('')
            $out.Add(('######## FILE: ' + $p + ' length=' + $s.Length + ' ########'))
            foreach($term in $terms){
              $out.Add('')
              $out.Add(('===== TERM: ' + $term + ' ====='))
              $start=0;$count=0
              while($count -lt 8){
                $i=$s.IndexOf($term,$start,[System.StringComparison]::OrdinalIgnoreCase)
                if($i -lt 0){break}
                $a=[Math]::Max(0,$i-6000);$b=[Math]::Min($s.Length,$i+$term.Length+9000)
                $snippet=$s.Substring($a,$b-$a)
                $snippet=$snippet -replace ';\s*',';`n' -replace '\}\s*function ','}`nfunction '
                $out.Add(('--- match ' + ($count+1) + ' at ' + $i + ' ---'))
                $out.Add($snippet)
                $start=$i+$term.Length;$count++
              }
              if($count -eq 0){$out.Add('(no match)')}
            }
          }
          $out | Set-Content 'night-schedule-08263-focused.txt' -Encoding UTF8
      - name: Commit focused inspection output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add night-schedule-08263-focused.txt
          git commit -m 'Inspect focused UEP 0.82.63 night generation paths'
          git push

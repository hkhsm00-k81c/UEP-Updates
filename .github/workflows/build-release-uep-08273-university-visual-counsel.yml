name: Build and Release UEP 0.82.73 University Visual Counsel
on:
  push:
    paths: ['release-08273.trigger']
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.72 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download 0.82.72'
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          Run-Native {node scripts/patch-uep-08273-university-visual-counsel.js $root} '08273 patch'
          Run-Native {node --check "$root/gyomuon.js"} 'gyomuon syntax'
          Run-Native {node --check "$root/electron/google-data.cjs"} 'google-data syntax'
          Run-Native {node --check "$root/electron/main.cjs"} 'main syntax'
          Run-Native {node scripts/test-uep-08273-university-visual-counsel.js $root} '08273 regression'
          $pkg=Get-Content "$root/package.json" -Raw|ConvertFrom-Json
          if([string]$pkg.version -ne '0.82.73'){throw "package version mismatch: $($pkg.version)"}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt
          Run-Native {gh release create v0.82.73 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.73' --notes "UEP v0.82.73`n- 오늘의 대학을 주요전형 카드의 시각 문법으로 통일`n- 대학 프로필 아래 5개 핵심 배지: 성취도·교과전형 정성평가·지역의사제·대표 수능최저·운호고 합격이력`n- 내신산정에서 성취도 반영 여부를 최우선 카드로 상시 노출`n- 수능최저 핵심 모집단위를 우선 카드로 노출하고 기타 모집단위는 접기`n- 수능최저 원문은 DB 값을 그대로 사용하여 임의 숫자 생성 없음`n- 권장과목 카드·운호고 실제 합격사례 접기·담임상담포인트 유지`n- 설립구분·설립연도·소재지·로고 필드가 DB에 존재하면 대학 프로필에 표시`n- MutationObserver·setTimeout DOM 보정 추가 없음"} 'release'
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.73';$policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.73/UEP-update.zip';$policy.sha256=$sha;$policy.message='UEP 0.82.73 · 오늘의 대학 시안형 상담 카드 개편'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          Run-Native {git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json;git commit -m 'Publish UEP 0.82.73 policy';git pull --rebase origin main;git push} 'policy push'

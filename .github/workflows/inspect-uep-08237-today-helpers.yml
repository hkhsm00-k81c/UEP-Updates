name: Inspect UEP 0.82.37 Today Helpers
'on':
  push:
    branches: [main]
    paths: [inspect-08237-helpers.trigger]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.37 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/inspect-uep-08237-today-helpers.js app
          node scripts/inspect-uep-08237-region-fn.js app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add today-helper-inspection.txt region-fn.txt
          git commit -m 'Inspect UEP 0.82.37 today helpers'
          git push origin HEAD:main

name: Verify UEP 0.81.86 Grade Transfer
on:
  push:
    branches:
      - build/0.81.86-grade-transfer-fix
    paths:
      - verify-uep-0.81.86.trigger
      - scripts/patch-uep-08186-grade-transfer.js
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.85 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.85 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          if(!(Test-Path app/UEP.exe)){throw '0.81.85 baseline UEP.exe missing'}
      - name: Apply and validate 0.81.86
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08186-grade-transfer.js
          node scripts/patch-uep-08186-grade-transfer.js app
          node --check app/resources/app/gyomuon.js
          $pkg=Get-Content app/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.86'){throw 'package version mismatch'}
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('const APP_VERSION = "0.81.86";','UEP_08186_GRADE_TRANSFER_START','학기말고사','1학기말 평균등급','전입교','전입생 · 성적자료 없음','expectedRank=null')){if(!$g.Contains($m)){throw "marker missing: $m"}}
          foreach($keep in @('UEP_08185_CURRICULUM_STABLE_CORE_START','uep-roster-08185','refreshRosterUntilStable','function uepSelectionErrors08129')){if(!$g.Contains($keep)){throw "existing feature missing: $keep"}}
      - name: Grade rule unit check
        shell: pwsh
        run: |
          node -e "const rows=[{schoolYear:'2026',semester:'1',exam:'1차고사',level:2},{schoolYear:'2026',semester:'1',exam:'2차고사',level:1},{schoolYear:'2026',semester:'1',exam:'학기말고사',level:1},{schoolYear:'2026',semester:'1',exam:'학기말고사',level:1},{schoolYear:'2026',semester:'1',exam:'학기말고사',level:'산출제외'}];const x=rows.filter(r=>r.schoolYear==='2026'&&r.semester==='1'&&r.exam==='학기말고사').map(r=>Number(r.level)).filter(Number.isFinite);const avg=x.reduce((a,b)=>a+b,0)/x.length;if(avg!==1)throw Error('final grade rule failed');console.log('final grade average =',avg)"
      - name: Package reopen verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path app/* -DestinationPath UEP-update-test.zip -CompressionLevel Optimal
          Expand-Archive UEP-update-test.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.86'){throw 'reopened package version mismatch'}
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          if(!$g.Contains('UEP_08186_GRADE_TRANSFER_END')){throw 'reopened marker missing'}
          Write-Host 'UEP 0.81.86 verification PASS'

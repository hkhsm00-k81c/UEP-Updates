name: Inspect UEP 0.81.73 Score Transfer Paths
'on':
  push:
    branches: [main]
    paths:
      - inspect-uep-08173-score-transfer.trigger
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force app | Out-Null
          gh release download v0.81.73 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip app -Force
      - name: Extract score and mock contexts
        shell: pwsh
        run: |
          $g='app/resources/app/gyomuon.js'
          $patterns=@('scoreRecords','mock','모의고사','내신','scoreType','examDate','시험일','grades','성적표','성적 데이터','자료 없음')
          $out=@()
          foreach($p in $patterns){
            $out += "===== PATTERN: $p ====="
            $matches=Select-String -Path $g -Pattern $p -SimpleMatch -Context 12,35
            if(-not $matches){$out+='NOT FOUND';continue}
            foreach($m in $matches | Select-Object -First 12){$out += ($m.Context.PreContext -join "`r`n");$out += $m.Line;$out += ($m.Context.PostContext -join "`r`n");$out += '-----'}
          }
          Set-Content score-transfer-inspection-08173.txt ($out -join "`r`n") -Encoding UTF8
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add score-transfer-inspection-08173.txt
          git commit -m 'diag: capture 0.81.73 score transfer paths'
          git push

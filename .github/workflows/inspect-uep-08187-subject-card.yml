name: Inspect UEP 0.81.86 Subject Cards
on:
  push:
    branches:
      - build/0.81.87-subject-card-distribution
    paths:
      - inspect-uep-0.81.87-subject-card.trigger
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.86 and inspect selection cards / dorm cards / grade helpers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.86 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $g='app/resources/app/gyomuon.js'
          node --check $g
          $text=Get-Content $g -Raw -Encoding UTF8
          foreach($needle in @('function uepSelectionDataset','function uepOpenSubjectModal08128','function uepSelectionErrors08129','과목별 신청현황','학사생','expectedRank','expectedGrade','1학기말 평균등급','science','선택과목')){
            Write-Host "===== $needle ====="
            $idx=$text.IndexOf($needle)
            if($idx -lt 0){ Write-Host 'NOT FOUND'; continue }
            $start=[Math]::Max(0,$idx-6500); $len=[Math]::Min(28000,$text.Length-$start)
            Write-Host $text.Substring($start,$len)
          }

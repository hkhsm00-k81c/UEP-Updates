name: Build UEP Homeroom Installer

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Homeroom release tag containing UEP source ZIP"
        required: true
        default: "v0.80.62-homeroom"
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download UEP source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_tag }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          $assets=(gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
          $asset=$assets | Where-Object { $_.name -match '(?i).*homeroom.*\.zip$|(?i)^UEP.*source.*\.zip$' } | Select-Object -First 1
          if(-not $asset){ throw 'UEP source ZIP not found in release' }
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $asset.name --dir source
          Expand-Archive -LiteralPath (Join-Path source $asset.name) -DestinationPath app -Force
          $exe=Get-ChildItem app -Filter UEP.exe -File -Recurse | Select-Object -First 1
          if(-not $exe){throw 'UEP.exe not found'}
          if($exe.Directory.FullName -ne (Resolve-Path app).Path){
            $tmp=Join-Path $env:RUNNER_TEMP 'uep-flat'; New-Item -ItemType Directory -Force $tmp|Out-Null
            Copy-Item (Join-Path $exe.Directory.FullName '*') $tmp -Recurse -Force
            Remove-Item app -Recurse -Force; New-Item -ItemType Directory app|Out-Null; Copy-Item (Join-Path $tmp '*') app -Recurse -Force
          }
      - name: Build independent launcher
        shell: pwsh
        run: |
          npm install --global electron-packager
          electron-packager launcher "UEP Launcher" --platform=win32 --arch=x64 --electron-version=39.2.7 --out=launcher-build --overwrite --asar
          New-Item -ItemType Directory -Force launcher-dist | Out-Null
          Copy-Item "launcher-build/UEP Launcher-win32-x64/UEP Launcher.exe" "launcher-dist/UEP-Launcher.exe"
          Copy-Item "launcher-build/UEP Launcher-win32-x64/resources" "launcher-dist/resources" -Recurse
          Copy-Item "launcher-build/UEP Launcher-win32-x64/*.dll" "launcher-dist/" -ErrorAction SilentlyContinue
          Copy-Item "launcher-build/UEP Launcher-win32-x64/*.pak" "launcher-dist/" -ErrorAction SilentlyContinue
          Copy-Item "launcher-build/UEP Launcher-win32-x64/*.bin" "launcher-dist/" -ErrorAction SilentlyContinue
          Copy-Item "launcher-build/UEP Launcher-win32-x64/*.dat" "launcher-dist/" -ErrorAction SilentlyContinue
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build transition setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/UEP-Homeroom.iss
      - name: Upload transition installer
        uses: actions/upload-artifact@v4
        with:
          name: UEP-AutoUpdater-Transition-Setup
          path: dist/UEP-Setup-With-AutoUpdater.exe

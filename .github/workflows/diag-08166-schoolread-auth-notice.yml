name: Diagnose UEP 0.81.66 School Read Auth Notice
'on':
  push:
    branches: [main]
    paths: [diag-08166-schoolread-auth-notice.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.66
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.66 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Extract exact functions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file='app/resources/app/electron/main.cjs'
          $lines=Get-Content $file -Encoding UTF8
          $names=@('schoolReadApiRequest','schoolReadBatchRead','resolveGoogleReadAuth','readSchoolReadSession','saveSchoolReadSession','fetchLiveData','parseGoogleSheetData')
          $out=@()
          foreach($name in $names){
            $idx=-1
            for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match "function\s+$name\b" -or $lines[$i] -match "const\s+$name\s*=" -or $lines[$i] -match "async\s+function\s+$name\b"){$idx=$i;break}}
            $out+="===== $name @ $($idx+1) ====="
            if($idx -ge 0){$s=[Math]::Max(0,$idx-8);$e=[Math]::Min($lines.Count-1,$idx+120);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$lines[$j])}}
          }
          $out+='===== references 00_UEP설정 / settings / notice-receipt-save ====='
          for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match '00_UEP설정|notice-receipt-save|settings'){$s=[Math]::Max(0,$i-8);$e=[Math]::Min($lines.Count-1,$i+18);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$lines[$j])}}}
          $out|Set-Content diag-08166-schoolread-auth-notice.txt -Encoding UTF8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag-08166-schoolread-auth-notice.txt
          git commit -m 'diag: capture 0.81.66 school read auth notice functions'
          git push

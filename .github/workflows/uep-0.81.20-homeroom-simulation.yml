name: UEP 0.81.20 Homeroom No-Google Simulation

on:
  push:
    branches: [fix/0.81.20-school-read-api]
    paths:
      - .github/workflows/uep-0.81.20-homeroom-simulation.yml
      - tools/apply-school-read-api-0.81.20.js
      - tools/normalize-readonly-auth-0.81.20.js
      - scripts/build-update-0.81.20.ps1
      - uep-policy.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate-homeroom:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify School Read API endpoint responds without Google OAuth
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $url=String($policy.schoolReadApiUrl).Trim()
          if(-not $url){throw 'schoolReadApiUrl missing'}
          $payload=@{action='login';name='UEP_SIMULATION_INVALID_USER';email='uep-simulation-invalid@example.invalid';deviceId='UEP-SIMULATION-NO-GOOGLE'} | ConvertTo-Json -Compress
          $resp=Invoke-WebRequest -UseBasicParsing -Uri $url -Method Post -ContentType 'application/json; charset=utf-8' -Body $payload -TimeoutSec 20
          if($resp.StatusCode -ne 200){throw "School Read API HTTP $($resp.StatusCode)"}
          $body=String($resp.Content)
          if($body -match '<html|accounts\.google\.com|oauth'){throw 'School Read API unexpectedly redirected to browser/Google OAuth'}
          $json=$body | ConvertFrom-Json
          if($null -eq $json.ok){throw 'School Read API did not return JSON API response'}
          Write-Host "School Read API reachable; invalid-user response ok=$($json.ok) code=$($json.code)"

      - name: Download shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object {
            $version='0.81.{0:d2}' -f $_
            $script="scripts/build-update-$version.ps1"
            if(-not(Test-Path $script)){throw "missing $script"}
            & $script
          }

      - name: Apply verified 0.81.19 cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patches=@(
            'tools/apply-performance1-0.81.19.js',
            'tools/apply-performance2-0.81.19.js',
            'tools/apply-dashboardview-memoization-0.81.19.js',
            'tools/apply-dashboardview-sort-rank-0.81.19.js',
            'tools/apply-dashboard-calendar-mode-cache-0.81.19.js',
            'tools/apply-openstudentdrawer-summary-pass-0.81.19.js',
            'tools/apply-openstudentdrawer-status-pass-0.81.19.js',
            'tools/apply-openstudentdrawer-after-index-0.81.19.js'
          )
          foreach($p in $patches){node $p app;if($LASTEXITCODE-ne 0){throw "patch failed: $p"}}

      - name: Build 0.81.20 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & scripts/build-update-0.81.20.ps1

      - name: Remove all local Google credential artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path app -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'google-service-account|oauth|refresh-token|credential.*\.bin' } |
            Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          Write-Host 'Simulation environment contains no local Google credential artifacts.'

      - name: Assert homeroom readonly path cannot require local Google credentials
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content 'app/resources/app/electron/main.cjs' -Raw -Encoding UTF8
          $preload=Get-Content 'app/resources/app/electron/preload.cjs' -Raw -Encoding UTF8
          $gyo=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $checks=[ordered]@{
            schoolReadMarker=$main.Contains('__UEP_SCHOOL_READ_API_PRIMARY_08120__')
            deviceId=$main.Contains('getOrCreateSchoolReadDeviceId')
            encryptedSession=$main.Contains('uep-school-read-session.bin')
            loginIpc=$main.Contains('uep:schoolReadLogin') -and $preload.Contains('schoolReadLogin:')
            verifyIpc=$main.Contains('uep:schoolReadSessionStatus') -and $preload.Contains('schoolReadSessionStatus:')
            logoutIpc=$main.Contains('uep:schoolReadLogout') -and $preload.Contains('schoolReadLogout:')
            batchRead=$main.Contains('schoolReadBatchRead(spreadsheetId,ranges)')
            rendererLogin=$gyo.Contains('window.schoolBoard.schoolReadLogin({name,email})')
            rendererStartup=$gyo.Contains('window.schoolBoard?.schoolReadSessionStatus')
            noReadonlyOAuthFallback=(-not ($main -match 'getReadonlySheetsAuth[\s\S]{0,1800}readGoogleUserOAuth'))
            noReadonlyServiceFallback=(-not ($main -match 'getReadonlySheetsAuth[\s\S]{0,1800}readEncrypted\(credentialPath\(\)\)'))
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host ("HOMEROOM SIM {0} = {1}" -f $_.Key,$_.Value)}
          if($checks.Values-contains $false){throw 'Homeroom no-Google credential simulation failed'}

      - name: Verify syntax after credential removal
        shell: pwsh
        run: |
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/preload.cjs
          node --check app/resources/app/gyomuon.js

      - name: Persist successful simulation result
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force audit-output | Out-Null
          @(
            'UEP 0.81.20 HOMEROOM NO-GOOGLE SIMULATION: PASS',
            "commit=$env:GITHUB_SHA",
            "time=$([DateTime]::UtcNow.ToString('o'))",
            'endpoint=School Read API JSON response without browser OAuth',
            'local_google_credentials=removed before final assertions',
            'readonly_path=UEP login -> deviceId -> UEP session -> School Read API -> batch-read'
          ) | Set-Content audit-output/homeroom-no-google-0.81.20.txt -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/homeroom-no-google-0.81.20.txt
          git commit -m 'audit: persist 0.81.20 homeroom no-Google simulation pass' || exit 0
          git push

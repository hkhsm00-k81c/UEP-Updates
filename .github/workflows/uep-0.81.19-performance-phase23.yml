name: UEP 0.81.19 Performance Phase23
on:
  push:
    branches: [audit/0.81.19-performance-phase23]
    paths:
      - tools/audit-openstudentdrawer-aftergroup-0.81.19.js
      - .github/workflows/uep-0.81.19-performance-phase23.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-after-school-grouping:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified performance patches through Phase21
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node ./tools/apply-performance1-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase1 failed'}
          node ./tools/apply-performance2-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase2 failed'}
          node ./tools/apply-dashboardview-memoization-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase13 failed'}
          node ./tools/apply-dashboardview-sort-rank-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase14 failed'}
          node ./tools/apply-dashboard-calendar-mode-cache-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase16 failed'}
          node ./tools/apply-openstudentdrawer-summary-pass-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase20 failed'}
          node ./tools/apply-openstudentdrawer-status-pass-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase21 failed'}
          node --check app/resources/app/gyomuon.js
      - name: Audit after-school grouping scans
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node ./tools/audit-openstudentdrawer-aftergroup-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase23 after-school grouping audit failed'}
      - name: Persist Phase23 results
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force audit-output/performance-0.81.19 | Out-Null
          Copy-Item performance-phase23-output/openstudentdrawer-aftergroup.json audit-output/performance-0.81.19/openstudentdrawer-aftergroup-phase23.json -Force
          Copy-Item performance-phase23-output/OPENSTUDENTDRAWER-AFTERGROUP.md audit-output/performance-0.81.19/OPENSTUDENTDRAWER-AFTERGROUP-PHASE23.md -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/performance-0.81.19/openstudentdrawer-aftergroup-phase23.json audit-output/performance-0.81.19/OPENSTUDENTDRAWER-AFTERGROUP-PHASE23.md
          if(-not (git diff --cached --quiet)){ git commit -m 'Persist 0.81.19 Phase23 after-school grouping audit'; git push }

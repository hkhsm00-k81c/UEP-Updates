name: Audit UEP 0.82.82 Patch Failure
on:
  push:
    paths: ['audit-08282-patch-failure.trigger']
permissions:
  contents: write
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Continue'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.81 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          $out = node scripts/patch-uep-08282-bidirectional-role-write.js $root 2>&1 | Out-String
          $code=$LASTEXITCODE
          "exit=$code`n$out" | Set-Content audit-08282-patch-failure.txt -Encoding utf8
          if($code -eq 0){
            $test = node scripts/test-uep-08282-bidirectional-role-write.js $root 2>&1 | Out-String
            "`nTEST exit=$LASTEXITCODE`n$test" | Add-Content audit-08282-patch-failure.txt -Encoding utf8
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-08282-patch-failure.txt
          git commit -m 'Add 0.82.82 patch failure report'
          git pull --rebase origin main
          git push

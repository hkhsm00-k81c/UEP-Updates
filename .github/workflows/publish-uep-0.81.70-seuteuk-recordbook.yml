name: Publish UEP 0.81.70 Seuteuk Recordbook Parser
'on':
  push:
    branches: [main]
    paths: [publish-uep-0.81.70-seuteuk-recordbook.trigger]
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.70-seuteuk-recordbook
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download known-good 0.81.69
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.69 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Apply 0.81.70 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node --check scripts/patch-uep-0.81.70-seuteuk-recordbook.js
          node scripts/patch-uep-0.81.70-seuteuk-recordbook.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/preload.cjs
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.70';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
          $g=(Get-FileHash app/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();"GYOMUON_SHA256=$g"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Reopen and verify exact payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path verify/UEP.exe)){throw 'root UEP.exe missing'}
          node --check verify/resources/app/gyomuon.js
          $g=(Get-FileHash verify/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();if($g -ne $env:GYOMUON_SHA256){throw 'gyomuon hash mismatch'}
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json;if($pkg.version -ne '0.81.70'){throw "package version mismatch: $($pkg.version)"}
          $gy=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('__UEP_08169_SUBJECT_SHARED_HASH__','uepNeisRuleStorageKey08169',"category:'반 확인'")){if(!$gy.Contains($x)){throw "0.81.70 marker missing: $x"}}
          if($gy.Contains("category:'학번 확인',hits:[],reason:'학년·반·번호를 안정적으로 복원하지 못했습니다")){throw 'legacy all-students number error remains'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host '0.81.70 package verification PASS'
      - name: Publish only after verification passes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $exists=$false;try{gh release view v0.81.70 --repo $env:GITHUB_REPOSITORY *> $null;$exists=$true}catch{$exists=$false};if($exists){gh release delete v0.81.70 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          gh release create v0.81.70 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.70 Seuteuk Recordbook Parser' --notes '교과세특 오류검증을 나이스 학교생활기록부 출력 형식 중심으로 조정합니다. 학번 열이 없는 정상 출력물을 전원 오류로 처리하지 않고 반·학생·과목·세특 본문 중심으로 검증하며, 학교 메타데이터의 과목 오인식과 일반어 다음의 브랜드 오탐을 줄입니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.70/UEP-update.zip'
          git pull --rebase origin main
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.70';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='교과세특 나이스 생활기록부 전용 파서 보정';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.70';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='교과세특 생활기록부 전용 파서 보정'}|ConvertTo-Json;Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.70 seuteuk recordbook parser';git push

name: Publish UEP 0.81.51 All Subject Mock Trends

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: [publish-uep-0.81.51.trigger]

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.51
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.50
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.50 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $zip=Get-ChildItem source -File -Filter '*.zip' | Select-Object -First 1
          if(!$zip){throw '0.81.50 release zip not found'}
          Expand-Archive $zip.FullName app -Force
          if(!(Test-Path 'app/UEP.exe')){throw '0.81.50 base has no root UEP.exe'}
      - name: Apply and verify label repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.51.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/google-data.cjs
          $pkg='app/resources/app/package.json'
          $p=Get-Content $pkg -Raw -Encoding UTF8 | ConvertFrom-Json
          $p.version='0.81.51'
          $p | ConvertTo-Json -Depth 50 | Set-Content $pkg -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.51";','chartMax=Math.max(rawMax+4,Math.ceil(rawMax*1.12))','visibleSubjects=subject==="__all__"?subjects:[subject]','>전체 과목</option>','시험별 등급 분포 비교',"const result=await sensitivePasswordModal({mode:'unlock',configured:true});",'<b>게시 중 직접공지</b>','function teacherTimetableMasterRows(teacher="")')){if(!$g.Contains($x)){throw "regression marker missing: $x"}}
      - name: Build package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.51";','chartMax=Math.max(rawMax+4,Math.ceil(rawMax*1.12))')){if(!$g.Contains($x)){throw "packaged marker missing: $x"}}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.51
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.51 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete v0.81.51 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          $global:LASTEXITCODE=0
          gh release create v0.81.51 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.51 All Subject Mock Trends' --notes '시험별 추이의 최대 막대 위 숫자 여백을 확보하고 연결된 전체 과목 그래프를 한 화면에 표시합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.51/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.51';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='시험별 추이 숫자 보정·전체 과목 한 화면 표시';$policy.forceUpdate=$false
          $policy | ConvertTo-Json -Depth 50 | Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.51';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='시험별 추이 숫자 보정·전체 과목 한 화면 표시'} | ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8
          Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json
          git commit -m 'release: promote UEP 0.81.51 mock bar label headroom'
          git push

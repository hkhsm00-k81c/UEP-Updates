name: UEP 0.81.19 Performance Phase6
on:
  push:
    branches: [audit/0.81.19-performance]
    paths:
      - tools/audit-readonly-autorefresh-0.81.19.js
      - .github/workflows/uep-0.81.19-performance-phase6.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-readonly-autorefresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified performance phase1
        shell: pwsh
        run: |
          node ./tools/apply-performance1-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase1 applicator failed'}
      - name: Audit readonly auto refresh
        shell: pwsh
        run: |
          node ./tools/audit-readonly-autorefresh-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'readonly auto refresh audit failed'}
          node --check app/resources/app/gyomuon.js
      - name: Persist phase6 audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'audit-output/performance-0.81.19' | Out-Null
          Copy-Item 'performance-phase6-output/readonly-autorefresh.json' 'audit-output/performance-0.81.19/readonly-autorefresh.json' -Force
          Copy-Item 'performance-phase6-output/READONLY-AUTOREFRESH.md' 'audit-output/performance-0.81.19/READONLY-AUTOREFRESH.md' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/performance-0.81.19
          if(-not (git diff --cached --quiet)){git commit -m 'Persist 0.81.19 readonly auto refresh audit';git push origin HEAD:audit/0.81.19-performance}
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.19-Performance-Phase6
          path: performance-phase6-output

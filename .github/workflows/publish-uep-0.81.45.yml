name: Publish UEP 0.81.45 Complete Teacher Timetable Repair

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.45.trigger

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.45
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.44
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.44 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $zip=Get-ChildItem source -File -Filter '*.zip' | Select-Object -First 1
          if(!$zip){throw '0.81.44 release zip not found'}
          Expand-Archive $zip.FullName app -Force
          if(!(Test-Path 'app/UEP.exe')){throw '0.81.44 base has no root UEP.exe'}
      - name: Apply and verify teacher timetable repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.45.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/google-data.cjs
          $pkg='app/resources/app/package.json'
          $p=Get-Content $pkg -Raw -Encoding UTF8 | ConvertFrom-Json
          $p.version='0.81.45'
          $p | ConvertTo-Json -Depth 50 | Set-Content $pkg -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $d=Get-Content app/resources/app/electron/google-data.cjs -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.45";','function teacherTimetableMasterRows(teacher="")','const rows=teacherTimetableMasterRows(teacher);','const room=String(row["교실"]||"").trim();')){if(!$g.Contains($x)){throw "missing renderer marker: $x"}}
          foreach($x in @('"17A_교사시간표마스터":','teacherTimetableRows: rowsFrom("17A_교사시간표마스터")')){if(!$d.Contains($x)){throw "missing data marker: $x"}}
      - name: Build package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          $d=Get-Content verify/resources/app/electron/google-data.cjs -Raw -Encoding UTF8
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          if(!$g.Contains('const APP_VERSION = "0.81.45";')){throw 'packaged version mismatch'}
          if(!$g.Contains('function teacherTimetableMasterRows(teacher="")')){throw 'teacher renderer source missing'}
          if(!$d.Contains('teacherTimetableRows: rowsFrom("17A_교사시간표마스터")')){throw 'teacher data source missing'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.45
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.45 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete v0.81.45 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          $global:LASTEXITCODE=0
          gh release create v0.81.45 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.45 Complete Teacher Timetable Repair' --notes '교사별 PDF 원본 918개 수업을 별도 마스터로 연결하여 3학년 선택과목 동시수업 누락을 수정합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.45/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.45';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='교사별 시간표 PDF 원본 전체 연결';$policy.forceUpdate=$false
          $policy | ConvertTo-Json -Depth 50 | Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.45';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='교사별 시간표 PDF 원본 전체 연결'} | ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8
          Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json
          git commit -m 'release: promote UEP 0.81.45 complete teacher timetable'
          git push

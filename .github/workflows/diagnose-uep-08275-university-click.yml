name: Diagnose UEP 0.82.75 University Click
on:
  push:
    paths:
      - '.github/workflows/diagnose-uep-08275-university-click.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect university detail renderer and overrides
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.75 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw "download failed $LASTEXITCODE"}
          Expand-Archive source/UEP-update.zip app -Force
          $s=Get-Content 'app/resources/app/gyomuon.js' -Raw
          foreach($needle in @('function openDashboardUniversityDetail','openDashboardUniversityDetail=','dashboardAdmissionTodayUniversity','function openDashboardAdmissionDialog','function openDashboardAdmissionDialogBase','function universityRegion','function uep08223UniversityRegion')){
            Write-Host "===== $needle ====="
            $start=0;$n=0
            while(($i=$s.IndexOf($needle,$start,[System.StringComparison]::Ordinal)) -ge 0 -and $n -lt 12){
              $a=[Math]::Max(0,$i-1400);$l=[Math]::Min(10000,$s.Length-$a);Write-Host "--- at $i ---";Write-Host $s.Substring($a,$l);$start=$i+$needle.Length;$n++
            }
            Write-Host "COUNT=$n"
          }

name: Diagnose UEP 0.81.72 R4 Remaining Full Refresh
'on':
  push:
    branches: [main]
    paths:
      - diag-uep-0.81.72-r4-remaining-full-refresh.trigger
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download R4 artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force stage,app | Out-Null
          gh run download 32910080088 --repo $env:GITHUB_REPOSITORY -n UEP-0.81.72-performance-candidate-r4 -D stage
          Expand-Archive stage/UEP-update-0.81.72-candidate-r4.zip app -Force
      - name: Audit remaining full-refresh contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $m='app/resources/app/electron/main.cjs';$g='app/resources/app/gyomuon.js'
          $ml=Get-Content $m -Encoding UTF8;$gl=Get-Content $g -Encoding UTF8
          $out=@('# UEP 0.81.72 R4 remaining full refresh audit','')
          $out+='## main fetchLiveData(force:true) remaining'
          for($i=0;$i -lt $ml.Count;$i++){if($ml[$i] -match 'fetchLiveData\(\{\s*force\s*:\s*true'){$s=[Math]::Max(0,$i-18);$e=[Math]::Min($ml.Count-1,$i+12);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$ml[$j])};$out+='---'}}
          $out+='## renderer full readonly refresh callers'
          for($i=0;$i -lt $gl.Count;$i++){if($gl[$i] -match 'refreshReadonlyCacheSilently\(\{\s*force\s*:\s*true'){$s=[Math]::Max(0,$i-15);$e=[Math]::Min($gl.Count-1,$i+12);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$gl[$j])};$out+='---'}}
          $out+='## result.data whole-cache replacements'
          for($i=0;$i -lt $gl.Count;$i++){if($gl[$i] -match 'readonlyCache\s*=\s*result\??\.?data\s*\|\|\s*readonlyCache'){$s=[Math]::Max(0,$i-12);$e=[Math]::Min($gl.Count-1,$i+10);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$gl[$j])};$out+='---'}}
          $out+='## input center main functions'
          foreach($name in @('saveInputRecords','classifyInputBatch','normalizeInputBatch')){$idx=-1;for($i=0;$i -lt $ml.Count;$i++){if($ml[$i] -match "(?:async\s+)?function\s+$name\b"){$idx=$i;break}};$out+="### $name line=$($idx+1)";if($idx -ge 0){$e=[Math]::Min($ml.Count-1,$idx+180);for($j=$idx;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$ml[$j])}}}
          $out+='## saveStudentContact exact'
          $idx=($ml|Select-String '^async function saveStudentContact'|Select-Object -First 1).LineNumber;if($idx){for($j=$idx-1;$j -lt [Math]::Min($ml.Count,$idx+80);$j++){$out+=('{0}: {1}' -f ($j+1),$ml[$j])}}
          $out+='## saveProgramOperation exact tail'
          $idx=($ml|Select-String '^async function saveProgramOperation'|Select-Object -First 1).LineNumber;if($idx){for($j=$idx-1;$j -lt [Math]::Min($ml.Count,$idx+190);$j++){$out+=('{0}: {1}' -f ($j+1),$ml[$j])}}
          $out|Set-Content diag-uep-0.81.72-r4-remaining-full-refresh.txt -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add diag-uep-0.81.72-r4-remaining-full-refresh.txt
          git commit -m 'diag: capture UEP 0.81.72 R4 remaining full refresh paths'
          git push

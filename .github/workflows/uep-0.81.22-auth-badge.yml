name: UEP 0.81.22 School Read Auth Badge

'on':
  push:
    branches:
      - fix/0.81.22-auth-badge
    paths:
      - .github/workflows/uep-0.81.22-auth-badge.yml
      - tools/apply-auth-badge-0.81.22.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 0.81.21 shipped package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.21 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Patch auth badge to School Read API state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tools/apply-auth-badge-0.81.22.js app

      - name: Verify patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g='app/resources/app/gyomuon.js'
          $js=Get-Content $g -Raw -Encoding UTF8
          if(-not $js.Contains('const APP_VERSION = "0.81.22";')){throw 'version patch missing'}
          if(-not $js.Contains('__UEP_SCHOOL_READ_BADGE_08122__')){throw 'auth badge patch missing'}
          if(-not $js.Contains('schoolReadSessionStatus({verify:false})')){throw 'School Read session badge binding missing'}
          node --check $g

      - name: Build update package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content UEP-update.sha256 $sha -Encoding ascii
          Write-Host "UEP 0.81.22 SHA256=$sha"

      - name: Publish v0.81.22
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.22'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target 'fix/0.81.22-auth-badge' --title 'UEP 0.81.22 - School Read 인증 상태 표시 수정' --notes 'School Read API 로그인 세션이 정상일 때 우상단 구 인증 배지를 연결됨으로 표시하도록 수정합니다.'
          }
          gh release upload $tag UEP-update.zip UEP-update.sha256 --repo $env:GITHUB_REPOSITORY --clobber

      - name: Promote main auto-update policy to 0.81.22
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-Content UEP-update.sha256 -Raw).Trim()
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.22'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.22/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.81.22 School Read API 인증 상태 표시 수정'
          $policy | ConvertTo-Json -Depth 10 | Set-Content uep-policy.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json
          git commit -m 'release: promote UEP 0.81.22 auto-update'
          git push origin main

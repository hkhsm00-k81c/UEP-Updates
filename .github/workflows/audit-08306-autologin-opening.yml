name: Audit UEP PC 0.83.06 AutoLogin Opening
on:
  push:
    branches: [fix/pc-autologin-opening-08306]
    paths:
      - '.github/workflows/audit-08306-autologin-opening.yml'
      - 'audit-08306.trigger'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.83.05 stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.83.05 --repo "$GITHUB_REPOSITORY" --pattern UEP-update.zip --dir /tmp
          rm -rf /tmp/u && mkdir /tmp/u
          unzip -q /tmp/UEP-update.zip -d /tmp/u
          echo "APP_DIR=/tmp/u/resources/app" >> "$GITHUB_ENV"
      - name: Extract authentication persistence and boot lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['APP_DIR']); out=[]
          terms=['remember','자동로그인','autoLogin','autologin','schoolReadSession','saveSchoolReadSession','loadSchoolReadSession','initializeUserSessionGate','renderUserAuthGate','hideUserAuthGate','BootCoverHold','CoreDataReady','readonlyCache','schoolReadLogin']
          for fn in ['gyomuon.js','electron/main.cjs','electron/preload.cjs','index.html']:
            lines=(root/fn).read_text(errors='replace').splitlines(); out.append('\n===== '+fn+' =====')
            hits=[i for i,line in enumerate(lines) if any(t.lower() in line.lower() for t in terms)]
            ranges=[]
            for i in hits:
              a=max(0,i-5); b=min(len(lines),i+8)
              if ranges and a <= ranges[-1][1]: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else: ranges.append((a,b))
            for a,b in ranges:
              out.append(f'--- {a+1}-{b} ---')
              out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          Path('auth-audit.txt').write_text('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uep-08306-auth-audit
          path: auth-audit.txt
          retention-days: 3

name: Publish UEP 0.81.56 Dashboard Recovery

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: [publish-uep-0.81.56.trigger]

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.56
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.55
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.55 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $zip=Get-ChildItem source -File -Filter '*.zip'|Select-Object -First 1;if(!$zip){throw '0.81.55 release zip not found'};Expand-Archive $zip.FullName app -Force
      - name: Apply recovery and verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';node scripts/patch-uep-0.81.56.js app
          node --check app/resources/app/gyomuon.js;node --check app/resources/app/electron/main.cjs;node --check app/resources/app/electron/google-data.cjs
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.56';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8;$m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.56";','return connected.filter(item=>{','passwordInputs.forEach')){if(!$g.Contains($x)){throw "marker missing: $x"}}
          if($m.Contains('official-raw-')){throw 'unsafe attendance merge remains'}
      - name: Build package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal;Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'};node --check verify/resources/app/gyomuon.js;node --check verify/resources/app/electron/main.cjs
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.56
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';gh release view v0.81.56 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete v0.81.56 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes};$global:LASTEXITCODE=0
          gh release create v0.81.56 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.56 Dashboard Recovery' --notes '0.81.55 대시보드 회귀를 복구합니다. 유령공지 제거·공지 단일원본·비밀번호 키입력 수정은 유지하고 충돌한 공결 raw 강제 병합만 되돌립니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.56/UEP-update.zip';$policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.56';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='대시보드 긴급 복구';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.56';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='대시보드 긴급 복구'}|ConvertTo-Json;Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.56 dashboard recovery';git push

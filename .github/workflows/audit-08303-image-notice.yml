name: Audit UEP PC 0.83.03 image notice
on:
  push:
    branches: [main]
    paths:
      - audit-08303-image-notice.trigger
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull latest
        run: git pull --rebase origin main
      - name: Download UEP PC 0.83.02 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/u && mkdir -p /tmp/u
          gh release download v0.83.02 -R "$GITHUB_REPOSITORY" -p UEP-update.zip -D /tmp/u
          unzip -q /tmp/u/UEP-update.zip -d /tmp/u/app
      - name: Audit notice write and file support
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/u/app/resources/app')
          out=Path('audit/08302-board/08303-image-notice-audit.txt')
          needles=['boardDbWrite','boardManagedUpdate','공지','notice','image','이미지','file','파일','Drive','upload','첨부','media','asset']
          chunks=[]
          for rel in ['gyomuon.js','electron/main.cjs','electron/preload.cjs']:
              p=root/rel
              if not p.exists(): continue
              lines=p.read_text(encoding='utf-8').splitlines(); picks=set()
              for i,l in enumerate(lines):
                  if any(n.lower() in l.lower() for n in needles):
                      picks.update(range(max(0,i-18),min(len(lines),i+35)))
              chunks.append('=== '+rel+' ===\n'+'\n'.join(f'{i+1}: {lines[i]}' for i in sorted(picks)))
          out.write_text('\n\n'.join(chunks),encoding='utf-8')
          PY
      - name: Commit audit safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/08302-board/08303-image-notice-audit.txt
          git diff --cached --quiet && exit 0
          git commit -m 'audit: inspect UEP PC image notice flow'
          for n in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1

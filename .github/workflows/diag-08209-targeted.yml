name: Diagnose UEP 0.82.09 Targeted
on:
  push:
    branches: [main]
    paths: [diag-08209-targeted.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.09 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $out=@()
          function Add-Around($file,$pattern,$before=1800,$after=4200){
            $txt=Get-Content $file -Raw
            $m=[regex]::Matches($txt,[regex]::Escape($pattern))
            $out += "### $file :: $pattern :: count=$($m.Count)"
            foreach($x in $m | Select-Object -First 8){
              $s=[Math]::Max(0,$x.Index-$before); $l=[Math]::Min($before+$after,$txt.Length-$s)
              $out += $txt.Substring($s,$l); $out += "`n---`n"
            }
          }
          $g='app/resources/app/gyomuon.js'
          $m='app/resources/app/electron/main.cjs'
          $p='app/resources/app/electron/preload.cjs'
          Add-Around $g 'function uep08123NormalizeReadonlyCache' 0 10000
          Add-Around $g 'dashboardReportStatusRows' 2500 6000
          Add-Around $g '공결/지각' 3000 5000
          Add-Around $g '제출완료' 2500 5000
          Add-Around $m 'readReadonlyCache' 3000 8000
          Add-Around $m 'previewReadonlySync' 3000 8000
          Add-Around $m 'schoolRead:' 2500 7000
          Add-Around $m 'readonly-cache' 2500 7000
          Add-Around $m 'spreadsheetId' 1500 4500
          Add-Around $p 'readReadonlyCache' 1500 3500
          $out | Set-Content diag-08209-targeted.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag-08209-targeted.txt
          git commit -m 'Capture targeted UEP 0.82.09 diagnostics'
          git push origin HEAD:main

name: Publish UEP 0.81.65 Urgent Notice
'on':
  push:
    branches: [main]
    paths: [publish-uep-0.81.65-urgent-notice.trigger]
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.65-urgent-notice
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download actual 0.81.64
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.64 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Apply urgent notice patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';node scripts/patch-uep-0.81.65-urgent-notice.js app
          node --check app/resources/app/gyomuon.js
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.65';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
      - name: Build and re-open package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal;Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          node --check verify/resources/app/gyomuon.js
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('__UEP_08165_URGENT_NOTICE_BELL_POPUP__','uepUrgentBell','data-urgent-confirm','setInterval(uepUrgentNoticeTick,12000)')){if(!$g.Contains($x)){throw "urgent output missing: $x"}}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.65
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.65 --repo $env:GITHUB_REPOSITORY *> $null;if($LASTEXITCODE -eq 0){gh release delete v0.81.65 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes};$global:LASTEXITCODE=0
          gh release create v0.81.65 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.65 Urgent Notice Popup + Bell' --notes '학교업무 공지의 기존 긴급 유형을 담임 강제팝업과 최상단 종 알림 허브에 연결합니다. 미확인 긴급공지 수를 빨간 배지로 표시하고 종 클릭 시 긴급공지 목록을 확인할 수 있습니다. 확인 버튼은 중앙 확인저장을 우선 시도하고, 중앙 쓰기 기능이 준비되지 않은 경우 이 PC 확인상태를 기록하여 반복 강제팝업을 방지합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.65/UEP-update.zip';$policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.65';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='긴급공지 강제팝업 · 최상단 종 알림 허브';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.65';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='긴급공지 강제팝업 + 종 알림 허브'}|ConvertTo-Json;Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.65 urgent notice';git push

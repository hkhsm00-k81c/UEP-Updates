name: UEP 0.81.19 Performance Audit

on:
  push:
    branches:
      - audit/0.81.19-performance
    paths:
      - tools/audit-performance-0.81.19.js
      - tools/classify-bindpage-performance-0.81.19.js
      - .github/workflows/uep-0.81.19-performance-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  performance-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object {
            $version='0.81.{0:d2}' -f $_
            $script="scripts/build-update-$version.ps1"
            if(-not (Test-Path $script)){throw "missing $script"}
            & $script
          }
      - name: Run binding performance audit
        shell: pwsh
        run: |
          node ./tools/audit-performance-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'performance audit failed'}
          node ./tools/classify-bindpage-performance-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'bindPage classification failed'}
      - name: Verify audit is non-invasive
        shell: pwsh
        run: |
          node --check app/resources/app/gyomuon.js
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          if(-not $g.Contains('const APP_VERSION = "0.81.18";')){throw 'runtime version changed by audit'}
      - name: Persist audit results on audit branch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'audit-output/performance-0.81.19' | Out-Null
          Copy-Item 'performance-audit-output/performance-bindings.json' 'audit-output/performance-0.81.19/performance-bindings.json' -Force
          Copy-Item 'performance-audit-output/PERFORMANCE-BINDING-AUDIT.md' 'audit-output/performance-0.81.19/PERFORMANCE-BINDING-AUDIT.md' -Force
          Copy-Item 'performance-classification-output/bindpage-classification.json' 'audit-output/performance-0.81.19/bindpage-classification.json' -Force
          Copy-Item 'performance-classification-output/BINDPAGE-CLASSIFICATION.md' 'audit-output/performance-0.81.19/BINDPAGE-CLASSIFICATION.md' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/performance-0.81.19
          if(-not (git diff --cached --quiet)){
            git commit -m 'Persist 0.81.19 performance audit results'
            git push origin HEAD:audit/0.81.19-performance
          }
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.19-Performance-Audit
          path: |
            performance-audit-output
            performance-classification-output

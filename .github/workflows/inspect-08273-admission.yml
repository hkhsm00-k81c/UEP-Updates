name: Inspect UEP 0.82.73 Admission Load
on:
  push:
    paths: ['inspect-08273-admission.trigger']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.73 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $g='app/resources/app/gyomuon.js';$m='app/resources/app/electron/main.cjs'
          $gl=Get-Content $g;$ml=Get-Content $m
          Write-Host '=== staged loader exact context ===';$gl[3798..3815]
          Write-Host '=== main live loader start ===';$ml[1624..1668]
          Write-Host '=== admission fetch block ===';$ml[1786..1794]
          Write-Host '=== click router ===';$gl[11137..11144]

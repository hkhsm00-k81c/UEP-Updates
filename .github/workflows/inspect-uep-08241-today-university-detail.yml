name: Inspect UEP 0.82.41 Today University Detail
'on':
  push:
    branches: [main]
    paths: [inspect-08241-today-university.trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.41 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/inspect-uep-08241-today-university-detail.js app | Set-Content today-university-detail-inspection.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: today-university-detail-inspection
          path: today-university-detail-inspection.txt

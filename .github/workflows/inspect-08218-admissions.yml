name: Inspect UEP 0.82.18 admissions integration
on:
  push:
    branches: [main]
    paths: [inspect-08218-admissions.trigger]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.18 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $files=@('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs')
          $patterns=@('batch-read','schoolRead','ranges','readSchool','sheetName','openDashboardAdmissionBasics','openDashboardAdmissionTypes','openDashboardUniversityDetail','52_대입기초','53_전형이해','54_수능최저DB','55_대학입결DB','56_대학입시마스터','dashboardStudentStatusCompactMarkup')
          $out=@()
          foreach($f in $files){
            $lines=Get-Content $f
            $out += "===== $f ====="
            for($i=0;$i -lt $lines.Count;$i++){
              $line=$lines[$i]
              $matched=$false
              foreach($p in $patterns){ if($line -match [regex]::Escape($p)){ $matched=$true; break } }
              if($matched){
                $a=[Math]::Max(0,$i-8); $b=[Math]::Min($lines.Count-1,$i+14)
                $out += "--- around line $($i+1) ---"
                for($j=$a;$j -le $b;$j++){ $out += ('{0,7}: {1}' -f ($j+1),$lines[$j]) }
              }
            }
          }
          $out | Set-Content inspect-08218-admissions.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspect-08218-admissions.txt
          git commit -m 'Inspect 0.82.18 admissions and sheet read hooks'
          git push origin HEAD:main

name: Export UEP 0.82.52 Source
on:
  push:
    paths: ['export-08252-source.trigger']
permissions: {contents: read}
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force source,app,out|Out-Null
          gh release download v0.82.52 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source; if($LASTEXITCODE){throw 'download'}
          Expand-Archive source/UEP-update.zip app -Force
          Copy-Item app/resources/app/gyomuon.js out/gyomuon.js
          Copy-Item app/resources/app/electron/main.cjs out/main.cjs
          Copy-Item app/resources/app/electron/preload.cjs out/preload.cjs
          Copy-Item app/resources/app/electron/google-data.cjs out/google-data.cjs
          Copy-Item app/resources/app/package.json out/package.json
      - uses: actions/upload-artifact@v4
        with: {name: uep-08252-source, path: out}

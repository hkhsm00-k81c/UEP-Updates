name: Probe School Read Write Actions
'on':
  push:
    branches: [main]
    paths: [probe-schoolread-write-actions.trigger]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe action names without credentials
        shell: bash
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbyLEEam4L2sX653pii69TC3_84wTyfAed_UL8HRY6PBG467im1LmZJ0CIpSKSOj4r6-0w/exec'
          : > probe-schoolread-write-actions.txt
          actions=(batch-read batch-write write append append-row write-row update upsert save submit values-append sheet-append append-sheet sheet-write write-sheet batch-update mutate receipt receipt-save notice-receipt notice-receipt-save notice-confirm confirm-notice notice-save notice-status-save acknowledgement-save ack-save)
          for a in "${actions[@]}"; do
            printf '===== %s =====\n' "$a" >> probe-schoolread-write-actions.txt
            curl -sS -L --max-time 15 -H 'content-type: application/json' -d "{\"action\":\"$a\"}" "$URL" >> probe-schoolread-write-actions.txt || true
            printf '\n\n' >> probe-schoolread-write-actions.txt
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-schoolread-write-actions.txt
          git commit -m 'diag: record School Read write action probe'
          git push

name: Full UEP Codebase Audit

on:
  push:
    branches:
      - audit/full-codebase-20260822
    paths:
      - tools/full-codebase-audit.ps1
      - tools/full-codebase-audit-detail.ps1
      - tools/third-pass-classify.js
      - tools/full-codebase-audit-fourth.ps1
      - tools/fifth-pass-diff-and-smoke.js
      - tools/sixth-pass-reference-trace.js
      - tools/seventh-pass-cleanup-plan.js
      - .github/workflows/full-codebase-audit.yml
      - full-codebase-audit.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          if(-not (Test-Path 'source/UEP-update.zip')){throw 'UEP 0.81.01 base ZIP not found'}
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Reconstruct current runtime from complete patch chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scripts=Get-ChildItem scripts/build-update-*.ps1 | ForEach-Object {
            if($_.BaseName -match 'build-update-(\d+)\.(\d+)\.(\d+)'){
              [pscustomobject]@{File=$_.FullName;Major=[int]$matches[1];Minor=[int]$matches[2];Patch=[int]$matches[3]}
            }
          } | Sort-Object Major,Minor,Patch
          foreach($s in $scripts){
            if($s.Major -eq 0 -and ($s.Minor -eq 81 -and $s.Patch -ge 2 -and $s.Patch -le 16)){
              Write-Host ('APPLY '+$s.File)
              & $s.File
            }
          }

      - name: Run full repository and runtime audit
        shell: pwsh
        run: ./tools/full-codebase-audit.ps1 -AppRoot app -OutDir audit-output

      - name: Run second-pass location audit
        shell: pwsh
        run: ./tools/full-codebase-audit-detail.ps1 -AppRoot app -OutDir audit-output

      - name: Run third-pass classification audit
        shell: pwsh
        run: node ./tools/third-pass-classify.js app audit-output

      - name: Run fourth-pass safe classification audit
        shell: pwsh
        run: ./tools/full-codebase-audit-fourth.ps1 -AppRoot app -OutDir audit-output

      - name: Run fifth-pass function diff and smoke-plan audit
        shell: pwsh
        run: node ./tools/fifth-pass-diff-and-smoke.js app audit-output

      - name: Run sixth-pass runtime reference trace audit
        shell: pwsh
        run: node ./tools/sixth-pass-reference-trace.js app audit-output

      - name: Run seventh-pass structural cleanup planning audit
        shell: pwsh
        run: node ./tools/seventh-pass-cleanup-plan.js app audit-output

      - name: Show audit summary
        shell: pwsh
        run: |
          Get-Content audit-output/FULL-CODEBASE-AUDIT.md -Encoding UTF8
          Get-Content audit-output/SECOND-PASS-AUDIT.md -Encoding UTF8
          Get-Content audit-output/THIRD-PASS-CLASSIFICATION.md -Encoding UTF8
          Get-Content audit-output/FOURTH-PASS-SAFE-CLASSIFICATION.md -Encoding UTF8
          Get-Content audit-output/FIFTH-PASS-DIFF-SMOKE.md -Encoding UTF8
          Get-Content audit-output/SIXTH-PASS-REFERENCE-TRACE.md -Encoding UTF8
          Get-Content audit-output/SEVENTH-PASS-CLEANUP-PLAN.md -Encoding UTF8

      - name: Persist audit results to audit branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audit-output
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "Store full codebase audit results"
            git push origin HEAD:audit/full-codebase-20260822
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UEP-FULL-CODEBASE-AUDIT
          path: audit-output/

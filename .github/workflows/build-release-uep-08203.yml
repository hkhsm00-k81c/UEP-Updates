name: Build and Release UEP 0.82.03
on:
  push:
    branches: [main]
    paths: [release-08203.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.02 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08203-bundle.js app
          node --check app/resources/app/gyomuon.js
          if(Test-Path app/resources/app/electron/main.cjs){ node --check app/resources/app/electron/main.cjs }
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          foreach($marker in @('const APP_VERSION = "0.82.03";','[data-uep-grade-source08186]','individualOutingAllowed:true','UEP_08203_RELEASE_NOTES_ONCE_START','외출 후 학사 복귀','[학사 외출 안내]')){ if(-not $g.Contains($marker)){ throw "missing marker: $marker" } }
          if($g.Contains("querySelectorAll('[data-uep-grade-source-08186]')")){ throw 'old transfer-grade cleanup selector remains' }
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip" | Set-Content sha256.txt -Encoding ascii
          if(gh release view v0.82.03 --repo $env:GITHUB_REPOSITORY 2>$null){ gh release delete v0.82.03 --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          $notes=@'
          UEP v0.82.03 묶음 업데이트

          - 학사외출: 금요일 `학원 외출 후 학사 복귀`를 기존 금요일 학원 후 귀가와 분리 처리
          - 전문사감 메일: 외출 후 학사 복귀 / 조기 퇴소 / 늦은 입소 유형별 구분, 사유·학원명 제외
          - 선택과목 신청명단: 전입교 표기가 한 학생 셀에 반복되던 렌더링 오류 수정
          - 업데이트 완료 후 수정사항 팝업: 현재 버전에서 최초 1회만 표시
          '@
          gh release create v0.82.03 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.03' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw | ConvertFrom-Json
          $policy.latestVersion='0.82.03'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.03/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.03 학사외출 복귀형 · 사감메일 유형구분 · 전입교 반복표시 · 업데이트 팝업 1회'
          $policy | ConvertTo-Json -Depth 10 | Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.03 RELEASE SUCCESS","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA") | Set-Content release-08203-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08203-status.txt
          git commit -m 'Publish UEP 0.82.03 policy and status'
          git push origin HEAD:main

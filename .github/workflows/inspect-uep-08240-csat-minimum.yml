name: Inspect UEP 0.82.40 CSAT Minimum
'on':
  push:
    branches: [main]
    paths: [inspect-08240-csat.trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.40 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/inspect-uep-08240-csat-minimum.js app | Set-Content csat-minimum-inspection.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: csat-minimum-inspection
          path: csat-minimum-inspection.txt

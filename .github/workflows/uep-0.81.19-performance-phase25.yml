name: UEP 0.81.19 Performance Phase25
on:
  push:
    branches: [audit/0.81.19-performance-phase25]
    paths:
      - .github/workflows/uep-0.81.19-performance-phase25.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-openstudentdrawer-final:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified 0.81.19 performance patches through Phase24
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node ./tools/apply-performance1-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase1 failed'}
          node ./tools/apply-performance2-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase2 failed'}
          node ./tools/apply-dashboardview-memoization-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase13 failed'}
          node ./tools/apply-dashboardview-sort-rank-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase14 failed'}
          node ./tools/apply-dashboard-calendar-mode-cache-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase16 failed'}
          node ./tools/apply-openstudentdrawer-summary-pass-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase20 failed'}
          node ./tools/apply-openstudentdrawer-status-pass-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase21 failed'}
          node ./tools/apply-openstudentdrawer-after-index-0.81.19.js app; if($LASTEXITCODE -ne 0){throw 'phase24 failed'}
          node --check app/resources/app/gyomuon.js
      - name: Final audit of openStudentDrawer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node ./tools/audit-openstudentdrawer-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'openStudentDrawer audit failed'}
      - name: Persist Phase25 results
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force audit-output/performance-0.81.19 | Out-Null
          Copy-Item performance-phase19-output/openstudentdrawer-audit.json audit-output/performance-0.81.19/openstudentdrawer-phase25-final.json -Force
          Copy-Item performance-phase19-output/OPENSTUDENTDRAWER-AUDIT.md audit-output/performance-0.81.19/OPENSTUDENTDRAWER-PHASE25-FINAL.md -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/performance-0.81.19/openstudentdrawer-phase25-final.json audit-output/performance-0.81.19/OPENSTUDENTDRAWER-PHASE25-FINAL.md
          if(-not (git diff --cached --quiet)){ git commit -m 'Persist 0.81.19 Phase25 final openStudentDrawer audit'; git push }

name: Test UEP 0.81.63 Client Fixes
'on':
  push:
    branches: [main]
    paths: [test-uep-0.81.63.trigger]
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download actual 0.81.62 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.62 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Apply and validate emitted 0.81.63 files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.63.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/google-data.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          if(!$g.Contains("$$('[data-curriculum-workspace]').forEach")){throw 'actual output missing $$ workspace selector'}
          if(!$g.Contains("$$('[data-cross-student]').forEach")){throw 'actual output missing $$ cross selector'}
          if(!$g.Contains("$$('[data-curriculum-subject]').forEach")){throw 'actual output missing $$ subject selector'}
          if(!$m.Contains('__UEP_08163_SCHOOL_READ_OFFICIAL_DATE_SHIFT__')){throw 'actual output missing School Read attendance correction'}
          $d=[datetime]::ParseExact('2026-08-25','yyyy-MM-dd',$null).AddDays(1).ToString('yyyy-MM-dd');if($d -ne '2026-08-26'){throw 'date-shift unit check failed'}
          'PASS' | Set-Content test-08163-result.txt
      - name: Commit test result
        shell: pwsh
        run: |
          git config user.name 'UEP Tests';git config user.email 'actions@github.com'
          git add test-08163-result.txt;git commit -m 'test: 0.81.63 actual artifact validation passed' || exit 0;git push

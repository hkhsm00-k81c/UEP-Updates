name: Sync UEP update manifest

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (example: v0.80.65)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: uep-update-manifest
  cancel-in-progress: false

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download UEP update asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/uep-release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "UEP-update.zip" \
            --dir /tmp/uep-release
          test -f /tmp/uep-release/UEP-update.zip

      - name: Build manifest
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(sha256sum /tmp/uep-release/UEP-update.zip | awk '{print $1}')"
          DOWNLOAD_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="UEP-update.zip") | .url')"
          NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' | head -c 1000)"
          if [ -z "$NOTES" ]; then
            NOTES="UEP ${TAG#v} 업데이트"
          fi
          jq -n \
            --arg version "$VERSION" \
            --arg channel "stable" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg sha256 "$SHA256" \
            --arg notes "$NOTES" \
            '{version:$version, channel:$channel, downloadUrl:$downloadUrl, sha256:$sha256, notes:$notes}' \
            > /tmp/uep-update.json
          cat /tmp/uep-update.json

      - name: Update uep-update.json via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/uep-update.json?ref=main" --jq '.sha')"
          CURRENT_CONTENT="$(gh api "repos/$GITHUB_REPOSITORY/contents/uep-update.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d)"
          NEW_CONTENT="$(cat /tmp/uep-update.json)"
          if [ "$CURRENT_CONTENT" = "$NEW_CONTENT" ]; then
            echo "Manifest already up to date."
            exit 0
          fi
          ENCODED="$(base64 -w 0 /tmp/uep-update.json)"
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/contents/uep-update.json" \
            -f message="Sync update manifest for $TAG" \
            -f content="$ENCODED" \
            -f sha="$CURRENT_SHA" \
            -f branch="main"

name: Inspect UEP 0.82.67 session object
on:
  push:
    paths:
      - 'inspect-08267-session-object.trigger'
jobs:
  inspect:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v0.82.67 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip app -Force
          $d='app/resources/app/electron/google-data.cjs'
          $lines=Get-Content $d
          $from=630; $to=[Math]::Min(780,$lines.Length)
          $out='inspect-08267-session-object.txt'
          for($i=$from;$i -le $to;$i++){ '{0}: {1}' -f $i,$lines[$i-1] | Add-Content $out -Encoding UTF8 }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $out
          git commit -m 'inspect: 0.82.67 session object'
          git pull --rebase origin main
          git push

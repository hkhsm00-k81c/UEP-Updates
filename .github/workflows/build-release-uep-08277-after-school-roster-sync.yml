name: Build Release UEP 0.82.77 After School Roster Sync
on:
  push:
    paths:
      - 'release-08277-after-school-roster-sync.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $prev='v0.82.76'
          $next='v0.82.77'
          $ver='0.82.77'
          New-Item -ItemType Directory -Force source,app,out | Out-Null
          gh release download $prev --repo $repo --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw "download failed: $LASTEXITCODE"}
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          node scripts/patch-uep-08277-after-school-roster-sync.js $root
          if($LASTEXITCODE -ne 0){throw 'patch failed'}
          node --check "$root/electron/main.cjs"
          if($LASTEXITCODE -ne 0){throw 'main syntax failed'}
          node --check "$root/electron/google-data.cjs"
          if($LASTEXITCODE -ne 0){throw 'google-data syntax failed'}
          node --check "$root/gyomuon.js"
          if($LASTEXITCODE -ne 0){throw 'gyomuon syntax failed'}
          node scripts/test-uep-08277-after-school-roster-sync.js $root
          if($LASTEXITCODE -ne 0){throw 'after-school roster regression failed'}
          $main=Get-Content "$root/electron/main.cjs" -Raw
          $data=Get-Content "$root/electron/google-data.cjs" -Raw
          $gy=Get-Content "$root/gyomuon.js" -Raw
          foreach($needle in @("afterEntries=['11_방과후학교','12_차시일정','13_출석부']","assignValueRangesByRange(matrices,afterEntries,afterResult)",'freshAfterPrograms','afterSchoolAttendance:partial.afterSchoolAttendance||[]')){if(!$main.Contains($needle)){throw "missing runtime patch: $needle"}}
          foreach($needle in @('const participantRows =','sessionSpecific.length ? sessionSpecific : (rosterByProgram.get(normalizedProgramId) || [])','const eighthPeriod=/8교시/','slot.label==="오후자습"')){if(!$data.Contains($needle)){throw "missing parser regression symbol: $needle"}}
          foreach($needle in @('function afterSchoolProgramGroups()','function dashboardNightAttendanceRows','uep08223UniversityRegions','uep08273TodayUniversityRegionMatches','uep08275UniversitySupportEligible','uep08276RenderAdmissionUniversity')){if(!$gy.Contains($needle)){throw "existing feature regression symbol missing: $needle"}}
          $pkg=Get-Content "$root/package.json" -Raw | ConvertFrom-Json
          if([string]$pkg.version -ne $ver){throw "package version mismatch: $($pkg.version)"}
          Compress-Archive -Path app/* -DestinationPath out/UEP-update.zip -CompressionLevel Optimal
          $hash=(Get-FileHash out/UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  UEP-update.zip" | Set-Content out/sha256.txt -Encoding ascii
          gh release create $next out/UEP-update.zip out/sha256.txt --repo $repo --title "UEP v0.82.77" --notes "UEP v0.82.77`n- 방과후 운영동기화에 11_방과후학교·12_차시일정·13_출석부를 함께 연결`n- 차시ID가 비어 있는 2학기 신청명단도 프로그램ID 기준으로 해당 차시에 정상 연결`n- 8교시는 과거 야자영향타임 문자열보다 실제 시간대를 우선하여 오후자습으로 인정`n- 고등 기초 영문법 9/7 회귀: 출석부 12명·참여 12명·오후자습 프로그램인정 12명 검증`n- 야자1/야자2 최신 동기화 및 오늘의 대학 v0.82.76 기능 유지`n- DOM 사후수정·MutationObserver·전역 click 우회 추가 없음"
          if($LASTEXITCODE -ne 0){throw "release create failed: $LASTEXITCODE"}
          $policy=Get-Content uep-policy.json -Raw | ConvertFrom-Json
          $policy.latestVersion=$ver
          $policy.downloadUrl="https://github.com/$repo/releases/download/$next/UEP-update.zip"
          $policy.sha256=$hash
          $policy.message='UEP 0.82.77 · 방과후 출석부·차시 연결 정상화'
          $policy | ConvertTo-Json -Depth 20 | Set-Content uep-policy.json -Encoding utf8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json
          git commit -m 'Publish UEP 0.82.77 policy'
          if($LASTEXITCODE -ne 0){throw "policy commit failed: $LASTEXITCODE"}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw "policy pull failed: $LASTEXITCODE"}
          git push
          if($LASTEXITCODE -ne 0){throw "policy push failed: $LASTEXITCODE"}

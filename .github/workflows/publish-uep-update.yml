name: Publish UEP Update

on:
  push:
    paths:
      - publish-update.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.01 shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
          if(-not (Test-Path 'app/UEP.exe')){throw 'UEP.exe not found in shipped base'}
      - name: Reconstruct through 0.81.15
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..15 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Verify 0.81.15 release gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $d=Get-Content 'app/resources/app/electron/google-data.cjs' -Raw -Encoding UTF8
          $m=Get-Content 'app/resources/app/electron/main.cjs' -Raw -Encoding UTF8
          node --check 'app/resources/app/gyomuon.js'
          $checks=[ordered]@{
            version=$g.Contains('const APP_VERSION = "0.81.15";')
            single06=$d.Contains('"06_선택과목이력"') -and (-not $d.Contains('06A_학생별선택과목'))
            activeSelectionRows=$g.Contains('function uepActiveSelectionRows()')
            selectionHelpers=$g.Contains('function uepDormStudentIds()') -and $g.Contains('function uepSelectionTermSubjects(') -and $g.Contains('function uepStudentGradeAverage(') -and $g.Contains('function uepSelectionErrors(')
            curriculum=$g.Contains('function uepCurriculumFinalView()') -and $g.Contains('function uepStudentApplicationView()') -and $g.Contains('function uepSubjectApplicationView()')
            sdgs=$g.Contains('function uepSdgsEvidenceBridge()') -and $g.Contains('function uepSdgsSupplementPanel()')
            recordModeBinding=$g.Contains('__UEP_RECORD_MAIN_TAB_BIND_08114__')
            recordParser=$g.Contains('fourDigitCell') -and $g.Contains('validSubject') -and $g.Contains('studentNo,name,grade,classNo,number,subject,text,issues')
            recordcheck=$g.Contains('window.uepMountRecordbookValidator') -and $g.Contains('standaloneRecordcheckMount')
            schoolResolver=$m.Contains('resolveSchoolServiceAccount')
            noGlobalObserver=(-not [regex]::IsMatch($g,'observer\.observe\s*\(\s*document\.documentElement'))
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host ("RELEASE GATE {0} = {1}" -f $_.Key,$_.Value)}
          if($checks.Values-contains $false){throw 'UEP 0.81.15 release gate failed'}
      - name: Build update package
        id: package
        shell: pwsh
        run: |
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower(); "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish v0.81.15 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.81.15'; gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.15 - 생활기록부 런타임 복구' --notes 'SDGs·교육과정 화면에서 누락된 런타임 의존 함수를 복구하고 0.81.14 세특 파서 개선을 유지합니다.'}
          gh release upload $tag UEP-update.zip --repo $env:GITHUB_REPOSITORY --clobber
      - name: Enable automatic update policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.package.outputs.sha }}
        run: |
          $current=Get-Content 'uep-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy=[ordered]@{channel='homeroom-stable';latestVersion='0.81.15';minimumAllowedVersion='0.80.64';blockedVersions=@();forceUpdate=$false;updateEnabled=$true;downloadUrl="https://github.com/$env:GITHUB_REPOSITORY/releases/download/v0.81.15/UEP-update.zip";sha256=$env:SHA256;message='UEP 0.81.15 생활기록부 SDGs·교육과정 런타임 복구';offlineGraceHours=72;googleOAuthClientId=[string]$current.googleOAuthClientId}|ConvertTo-Json -Depth 4
          $info=gh api "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json?ref=main"|ConvertFrom-Json
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($policy)); $body=@{message='Enable UEP 0.81.15 automatic update';content=$encoded;sha=$info.sha;branch='main'}|ConvertTo-Json
          $body|gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json" --input -
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.15-Update-Package
          path: UEP-update.zip

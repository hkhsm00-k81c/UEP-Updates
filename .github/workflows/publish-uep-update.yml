name: Publish UEP Update

on:
  push:
    paths:
      - publish-update.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.01 shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
          if(-not (Test-Path 'app/UEP.exe')){throw 'UEP.exe not found in shipped base'}
      - name: Reconstruct through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Verify 0.81.18 release gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $c=Get-Content 'app/resources/app/gyomuon.css' -Raw -Encoding UTF8
          $d=Get-Content 'app/resources/app/electron/google-data.cjs' -Raw -Encoding UTF8
          $m=Get-Content 'app/resources/app/electron/main.cjs' -Raw -Encoding UTF8
          node --check 'app/resources/app/gyomuon.js'
          node --check 'app/resources/app/electron/main.cjs'
          node --check 'app/resources/app/electron/google-data.cjs'
          node ./scripts/verify-css-cleanup-0.81.17.js app
          $r1=Get-Content 'cleanup1-output/cleanup1-report.json' -Raw | ConvertFrom-Json
          $r2=Get-Content 'cleanup2-output/cleanup2-report.json' -Raw | ConvertFrom-Json
          $removed1=@($r1|Where-Object {$_.status -eq 'REMOVED'})
          $removed2=@($r2|Where-Object {$_.status -eq 'REMOVED'})
          $checks=[ordered]@{
            version=$g.Contains('const APP_VERSION = "0.81.18";')
            single06=$d.Contains('"06_선택과목이력"') -and (-not $d.Contains('06A_학생별선택과목'))
            activeSelectionRows=$g.Contains('function uepActiveSelectionRows()')
            selectionHelpers=$g.Contains('function uepDormStudentIds()') -and $g.Contains('function uepSelectionTermSubjects(') -and $g.Contains('function uepStudentGradeAverage(') -and $g.Contains('function uepSelectionErrors(') -and $g.Contains('function uepSelectionSms(')
            curriculum=$g.Contains('function uepCurriculumFinalView()') -and $g.Contains('function uepStudentApplicationView()') -and $g.Contains('function uepSubjectApplicationView()')
            sdgs=$g.Contains('function uepSdgsEvidenceBridge()') -and $g.Contains('function uepSdgsSupplementPanel()')
            strictClassParser=$g.Contains('classIndex=findIndex(/^반$|^학급$|^반명$/)') -and (-not $g.Contains('classIndex=indexOf(/^반$|학급|반명/,3)'))
            classRangeGuard=$g.Contains('if(!/^([1-9]|1[0-4])$/.test(String(classNo||"")))classNo=""')
            recordcheck=$g.Contains('window.uepMountRecordbookValidator') -and $g.Contains('standaloneRecordcheckMount')
            schoolResolver=$m.Contains('resolveSchoolServiceAccount')
            noGlobalObserver=(-not [regex]::IsMatch($g,'observer\.observe\s*\(\s*document\.documentElement'))
            cssSize=($c.Length -eq 36029)
            cleanup1=($removed1.Count -ge 8)
            cleanup2=($removed2.Count -ge 8)
            cleanupTotal=(($removed1.Count+$removed2.Count) -ge 16)
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host ("RELEASE GATE {0} = {1}" -f $_.Key,$_.Value)}
          if($checks.Values-contains $false){throw 'UEP 0.81.18 release gate failed'}
      - name: Build update package
        id: package
        shell: pwsh
        run: |
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower(); "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish v0.81.18 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.81.18'; gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.18 - JS 안전 정리' --notes '0.81.17 안정판을 기준으로 전체 JS 감사와 strict parser 검증을 거쳐 실제 런타임 미사용 함수 16개를 안전 제거했습니다. CSS 및 교육과정·SDGs·세특검증·학생정보·상담·시간표·Google 연결 핵심 기능은 유지한 안정화 버전입니다.'}
          gh release upload $tag UEP-update.zip --repo $env:GITHUB_REPOSITORY --clobber
      - name: Enable automatic update policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.package.outputs.sha }}
        run: |
          $current=Get-Content 'uep-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy=[ordered]@{channel='homeroom-stable';latestVersion='0.81.18';minimumAllowedVersion='0.80.64';blockedVersions=@();forceUpdate=$false;updateEnabled=$true;downloadUrl="https://github.com/$env:GITHUB_REPOSITORY/releases/download/v0.81.18/UEP-update.zip";sha256=$env:SHA256;message='UEP 0.81.18 JS 안전 정리 및 안정화';offlineGraceHours=72;googleOAuthClientId=[string]$current.googleOAuthClientId}|ConvertTo-Json -Depth 4
          $info=gh api "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json?ref=main"|ConvertFrom-Json
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($policy)); $body=@{message='Enable UEP 0.81.18 automatic update';content=$encoded;sha=$info.sha;branch='main'}|ConvertTo-Json
          $body|gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json" --input -
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.18-Update-Package
          path: UEP-update.zip

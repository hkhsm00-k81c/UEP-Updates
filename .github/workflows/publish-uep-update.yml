name: Publish UEP Update

on:
  push:
    paths:
      - publish-update.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 0.81.01 shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.81.01
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          if(-not (Test-Path 'source/UEP-update.zip')){throw 'UEP 0.81.01 update ZIP not found'}
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
          if(-not (Test-Path 'app/UEP.exe')){throw 'UEP.exe not found in 0.81.01 update'}

      - name: Apply 0.81.02 SDGs and local recordbook validation
        id: apply08102
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            & ./scripts/build-update-0.81.02.ps1 *>&1 | Tee-Object -FilePath build-08102-status.txt
          } catch {
            ($_ | Out-String) | Add-Content build-08102-status.txt
            exit 1
          }

      - name: Commit bounded failure status
        if: steps.apply08102.outcome == 'failure'
        shell: pwsh
        run: |
          Add-Content build-08102-status.txt 'BUILD_FAILED_BEFORE_RELEASE'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- build-08102-status.txt
          git commit -m 'Record UEP 0.81.02 build failure'
          git push
          throw 'UEP 0.81.02 apply failed; bounded status committed'

      - name: Verify 0.81.02 requested fixes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $m=Get-Content 'app/resources/app/electron/main.cjs' -Raw -Encoding UTF8
          $d=Get-Content 'app/resources/app/electron/google-data.cjs' -Raw -Encoding UTF8
          $checks=[ordered]@{
            'login identity gateway'=$m.Contains('mode:"login_identity"')
            'school service account path'=$m.Contains('mode:"service_account"')
            'approval disabled'=$m.Contains('approvalRequired:false')
            'token exchange disabled'=$m.Contains('tokenExchangeRequired:false')
            'authorize bypassed'=$m.Contains('skipped:true')
            'SDGs evidence cards'=$g.Contains('growth-sdg-evidence-card')
            'SDGs evidence list'=$g.Contains('growth-sdg-evidence-list')
            'SDGs rendered marker'=$g.Contains('sdgsEvidenceCardsRendered=true')
            'selection 06 UI preserved'=$g.Contains('for(const raw of (readonlyCache?.subjectSelections||[]))')
            'selection 06 range preserved'=$d.Contains('"06_선택과목이력": "''06_선택과목이력''!A1:X6000"')
            'selection final rows preserved'=$d.Contains("const selectedSubjectRows = legacySelectedSubjectRows.filter(row=>String(row.final||'').trim()==='Y');")
            'selection export preserved'=$d.Contains('subjectSelections:selectedSubjects')
            'SDGs primary evidence map'=$g.Contains('data-neis-local-validator')
            'NEIS local IPC'=$m.Contains('recordbook:inspectNeisExcel')
            'NEIS no sheet write'=$g.Contains('Google 시트 연결·입력센터 저장·자동동기화 없음')
          }
          $checks.GetEnumerator() | ForEach-Object { Write-Host ("CHECK {0} = {1}" -f $_.Key,$_.Value) }
          if($checks.Values -contains $false){throw 'UEP 0.81.02 requested feature verification failed'}

      - name: Build update package
        id: package
        shell: pwsh
        run: |
          if(Test-Path UEP-update.zip){Remove-Item UEP-update.zip -Force}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          if(-not (Test-Path UEP-update.zip)){throw 'UEP-update.zip build failed'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish v0.81.02 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.81.02'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.02 - SDGs 근거지도 + 생기부 로컬 검증' --notes 'SDGs 17개 근거지도를 성장 프로파일의 핵심 영역으로 올리고 근거 확인·연결 가능·근거 없음 상태를 모두 표시합니다. 나이스 교과 세특 엑셀은 현재 PC 메모리에서만 읽어 금지표현·기재요령·반복문장 등을 사전 검증하며 Google 시트·입력센터·자동동기화에는 저장하지 않습니다. 기존 완료 기능을 보존합니다.'
          }
          gh release upload $tag UEP-update.zip --repo $env:GITHUB_REPOSITORY --clobber

      - name: Enable automatic update policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.package.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.02'
          $asset=(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets | Where-Object {$_.name -eq 'UEP-update.zip'} | Select-Object -First 1
          if(-not $asset){throw 'Release asset not found'}
          $current=Get-Content 'uep-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $oauthClientId=[string]$current.googleOAuthClientId
          $policy=[ordered]@{
            channel='homeroom-stable'
            latestVersion='0.81.02'
            minimumAllowedVersion='0.80.64'
            blockedVersions=@()
            forceUpdate=$false
            updateEnabled=$true
            downloadUrl=$asset.url
            sha256=$env:SHA256
            message='UEP 0.81.02 SDGs 근거지도 및 로컬 생기부 검증'
            offlineGraceHours=72
            googleOAuthClientId=$oauthClientId
          } | ConvertTo-Json -Depth 4
          $info=gh api "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json?ref=main" | ConvertFrom-Json
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($policy))
          $body=@{message='Enable UEP 0.81.02 automatic update';content=$encoded;sha=$info.sha;branch='main'} | ConvertTo-Json
          $body | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json" --input -

      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.02-Update-Package
          path: UEP-update.zip

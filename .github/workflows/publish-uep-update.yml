name: Publish UEP Update

on:
  push:
    paths:
      - publish-update.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 0.80.95 shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.80.95
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          if(-not (Test-Path 'source/UEP-update.zip')){throw 'UEP 0.80.95 update ZIP not found'}
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
          if(-not (Test-Path 'app/UEP.exe')){throw 'UEP.exe not found in 0.80.95 update'}

      - name: Apply 0.80.96 one-point curriculum selection fix
        shell: pwsh
        run: ./scripts/build-update-0.80.96.ps1

      - name: Verify one-point selection runtime markers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $checks=[ordered]@{
            'subjectSelections only'=$g.Contains('for(const raw of (readonlyCache?.subjectSelections||[]))')
            'no composed comparison'=(-not $g.Contains('${profilePanel}${selectionComparisonMarkup(student)}'))
            'no composed history'=(-not $g.Contains('${profilePanel}${selectionErrorHistoryMarkup(student)}'))
            'cross support label'=$g.Contains('문이과 교차지원')
            'science hierarchy label'=$g.Contains('과학과목 위계오류')
            'duplicate term label'=$g.Contains('학기간 중복과목 오류')
          }
          $checks.GetEnumerator() | ForEach-Object { Write-Host ("CHECK {0} = {1}" -f $_.Key,$_.Value) }
          if($checks.Values -contains $false){throw 'One-point selection verification failed'}

      - name: Build update package
        id: package
        shell: pwsh
        run: |
          if(Test-Path UEP-update.zip){Remove-Item UEP-update.zip -Force}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          if(-not (Test-Path UEP-update.zip)){throw 'UEP-update.zip build failed'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish v0.80.96 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.80.96'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'UEP 0.80.96 - 선택과목 원포인트 연결' --notes '생활기록부 > 교육과정(선택과목)만 수정합니다. 기본정보연결시트 06_선택과목이력의 직접 이관된 리로스쿨 신청본만 단일 기준으로 읽고, 기존 사전신청·Google Form 비교·비교이력 화면은 제외합니다. 오류 표시는 현재 직접 이관 기록을 대상으로 문이과 교차지원, 과학과목 위계오류, 학기간 중복과목 오류 세 종류만 표시합니다. 0.80.95에서 완료된 급식지도·개인정보가리기·학사외출·결재라인 및 Google 연결 코드는 건드리지 않습니다.'
          }
          gh release upload $tag UEP-update.zip --repo $env:GITHUB_REPOSITORY --clobber

      - name: Enable automatic update policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.package.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.80.96'
          $asset=(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets | Where-Object {$_.name -eq 'UEP-update.zip'} | Select-Object -First 1
          if(-not $asset){throw 'Release asset not found'}
          $current=Get-Content 'uep-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $oauthClientId=[string]$current.googleOAuthClientId
          $policy=[ordered]@{
            channel='homeroom-stable'
            latestVersion='0.80.96'
            minimumAllowedVersion='0.80.64'
            blockedVersions=@()
            forceUpdate=$false
            updateEnabled=$true
            downloadUrl=$asset.url
            sha256=$env:SHA256
            message='UEP 0.80.96 선택과목 원포인트 연결'
            offlineGraceHours=72
            googleOAuthClientId=$oauthClientId
          } | ConvertTo-Json -Depth 4
          $info=gh api "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json?ref=main" | ConvertFrom-Json
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($policy))
          $body=@{message='Enable UEP 0.80.96 automatic update';content=$encoded;sha=$info.sha;branch='main'} | ConvertTo-Json
          $body | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json" --input -

      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.80.96-Update-Package
          path: UEP-update.zip

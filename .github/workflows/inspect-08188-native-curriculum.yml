name: Inspect UEP 0.81.88 Native Curriculum
on:
  push:
    branches: [main]
    paths:
      - inspect-08188.trigger
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.88
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force baseline,app,.github/inspection | Out-Null
          gh release download v0.81.88 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir baseline
          Expand-Archive baseline/UEP-update.zip app -Force
      - name: Extract native curriculum code
        shell: pwsh
        run: |
          node scripts/inspect-08188-native-curriculum.js app .github/inspection/08188-native-curriculum.txt
      - name: Commit inspection report
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/inspection/08188-native-curriculum.txt
          git diff --cached --quiet; if($LASTEXITCODE -ne 0){ git commit -m 'Inspect 0.81.88 native curriculum event flow'; git push }

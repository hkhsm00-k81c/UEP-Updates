name: Diagnose 0.81.29 Sheet Hooks

'on':
  push:
    branches: [main]
    paths:
      - diag-08129-sheet-hooks.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shipped 0.81.28 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diag | Out-Null
          gh release download v0.81.28 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
          @'
          const fs=require('fs');
          const f='app/resources/app/electron/google-data.cjs';
          const lines=fs.readFileSync(f,'utf8').split(/\r?\n/);
          const ranges=[[1,90],[990,1080],[1400,1730]];
          const out=[];
          for(const [a,b] of ranges){out.push('===== '+a+'-'+b+' =====');for(let i=a-1;i<Math.min(b,lines.length);i++)out.push(String(i+1).padStart(5,'0')+' '+lines[i]);}
          fs.writeFileSync('diag/08129-google-data-slices.txt',out.join('\n'),'utf8');
          '@ | Set-Content inspect.js -Encoding UTF8
          node inspect.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag/08129-google-data-slices.txt
          git commit -m 'diag: capture 0.81.28 google-data slices for 0.81.29' || echo no-change
          git push

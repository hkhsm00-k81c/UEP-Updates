name: Diagnose 0.81.29 Sheet Hooks

'on':
  push:
    branches: [main]
    paths:
      - diag-08129-sheet-hooks.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shipped 0.81.28 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diag | Out-Null
          gh release download v0.81.28 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $patterns=@('schoolRead','School Read','sheetName','sheetData','basicInfo','rule','규칙로그','기본정보','06_선택과목이력','18_학교교육과정DB','19_선택과목블록DB','41_선택과목규칙','linked','snapshot','getSheet','sheetRows')
          $lines=Get-Content app/resources/app/gyomuon.js -Encoding UTF8
          $out=@()
          foreach($p in $patterns){
            $out += "===== $p ====="
            $hits=Select-String -InputObject $lines -Pattern ([regex]::Escape($p)) -SimpleMatch:$false -Context 2,2
            foreach($h in $hits | Select-Object -First 20){$out += $h.Context.PreContext; $out += $h.Line; $out += $h.Context.PostContext; $out += '---'}
          }
          $out | Set-Content diag/08129-sheet-hooks.txt -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag/08129-sheet-hooks.txt
          git commit -m 'diag: capture 0.81.28 sheet hooks for 0.81.29'
          git push

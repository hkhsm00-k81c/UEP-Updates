name: Diagnose 0.81.29 Sheet Hooks

'on':
  push:
    branches: [main]
    paths:
      - diag-08129-sheet-hooks.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shipped 0.81.28 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diag | Out-Null
          gh release download v0.81.28 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
          @'
          const fs=require('fs'),path=require('path');
          const root='app/resources/app';
          const files=[];
          (function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(/\.(js|cjs|mjs)$/i.test(e.name))files.push(p);}})(root);
          const pats=['readReadonlyCache','previewReadonlySync','subjectSelections','06_선택과목이력','schoolRead','sheetName','sheetRows','getSheet','googleapis','spreadsheets.values','readonlyCache','normalizeReadonlyCache','contextBridge','ipcMain.handle'];
          const out=[];
          for(const f of files){const lines=fs.readFileSync(f,'utf8').split(/\r?\n/);let fileHit=false;for(const pat of pats){let n=0;for(let i=0;i<lines.length&&n<40;i++){if(lines[i].toLowerCase().includes(pat.toLowerCase())){if(!fileHit){out.push('\n######## '+f+' ########');fileHit=true;}out.push('===== '+pat+' @'+(i+1)+' =====',...lines.slice(Math.max(0,i-4),Math.min(lines.length,i+5)),'---');n++;}}}}
          fs.writeFileSync('diag/08129-sheet-hooks.txt',out.join('\n'),'utf8');
          '@ | Set-Content inspect.js -Encoding UTF8
          node inspect.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag/08129-sheet-hooks.txt
          git commit -m 'diag: capture js-cjs 0.81.28 sheet hooks for 0.81.29' || echo no-change
          git push

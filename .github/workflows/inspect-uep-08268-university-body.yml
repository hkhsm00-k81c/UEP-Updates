name: Inspect UEP 0.82.68 University Body
on:
  push:
    paths:
      - 'inspect-08268-university-body.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.68 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download'
          Expand-Archive source/UEP-update.zip app -Force
          Run-Native {node scripts/inspect-uep-08268-university-body.js app/resources/app inspection-08268-university-body.txt} 'inspect'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-08268-university-body.txt
          git commit -m 'inspect: capture 0.82.68 university detail body'
          git pull --rebase origin main
          git push

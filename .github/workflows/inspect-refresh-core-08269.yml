name: Inspect UEP 0.82.69 Refresh Core
on:
  push:
    paths:
      - 'inspect-refresh-core-08269.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.69 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw "download failed"}
          Expand-Archive source/UEP-update.zip app -Force
          $g=Get-Content 'app/resources/app/gyomuon.js'
          $out='inspection-refresh-core-08269.txt'
          "===== gyomuon.js 500-710 =====" | Set-Content $out -Encoding utf8
          for($i=499;$i -le 709;$i++){ Add-Content $out (("{0,7}: {1}" -f ($i+1),$g[$i])) }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $out
          git commit -m 'Inspect v0.82.69 refresh core'
          if($LASTEXITCODE -ne 0){throw "commit failed"}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw "pull failed"}
          git push
          if($LASTEXITCODE -ne 0){throw "push failed"}

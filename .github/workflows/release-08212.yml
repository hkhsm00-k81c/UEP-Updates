name: Build and Release UEP 0.82.18
on:
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08218-recovery.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.14 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08218-recovery.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          $c=Get-Content app/resources/app/gyomuon.css -Raw
          foreach($x in @('const APP_VERSION = "0.82.18";','UEP_08218_CHANGELOG_POPUP','UEP_08218_FOUR_STATUS_CARDS','function dashboardStudentStatusCompactMarkup()','function todayOperationsMarkup()','data-dashboard-official-ledger','openDashboardAdmissionBasics','openDashboardAdmissionTypes','openDashboardUniversityDetail')){if(-not (($g+$c).Contains($x))){throw "missing $x"}}
          foreach($x in @('UEP_08210_DASHBOARD_INTEGRATION_START','UEP_08211_ADMISSIONS_COUNSELING_START','setInterval(sync,2500)','__UEP_08217_LOGIN_WATCHDOG__')){if($g.Contains($x)){throw "forbidden regression patch remains: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.18
          - 구글시트 실시간 연결이 정상 확인된 v0.82.14 릴리스를 기준판으로 복구
          - v0.82.16/17의 재조립 및 로그인 우회 패치 제거
          - 새 버전 최초 실행 시 수정내역 팝업 1회 표시
          - 공결·지각 팝업 상단의 학교 공결대장·기준일·학생 수·조회 범위 4개 카드를 한 줄 배치
          - v0.82.14의 대입 기초·전형 이해·오늘의 대학 기본 구조 유지
          '@
          gh release create v0.82.18 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.18' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.18'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.18/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.18 · v0.82.14 정상 연결 기준판 복구 · 수정내역 1회 팝업 · 공결/지각 4카드 한 줄'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.18 RELEASE SUCCESS","base=v0.82.14","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.18 recovery policy and status'
          git push origin HEAD:main

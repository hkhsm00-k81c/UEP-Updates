name: Build and Release UEP 0.82.17
on:
  push:
    branches: [main]
    paths: [release-08212.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08217-login-localfirst.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.16 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08217-login-localfirst.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          $c=Get-Content app/resources/app/gyomuon.css -Raw
          foreach($x in @('const APP_VERSION = "0.82.17";','__UEP_08217_LOGIN_WATCHDOG__','학교 데이터 연결은 로그인 후 별도로 확인합니다.','UEP_08216_CHANGELOG_POPUP','UEP_08216_FOUR_STATUS_CARDS','dashboardAdmission2028Catalog','data-dashboard-official-ledger')){if(-not (($g+$c).Contains($x))){throw "missing $x"}}
          foreach($x in @('UEP_08210_DASHBOARD_INTEGRATION_START','UEP_08211_ADMISSIONS_COUNSELING_START','setInterval(sync,2500)')){if($g.Contains($x)){throw "forbidden legacy patch remains: $x"}}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.17
          - School Read API 404가 사용자 확인 화면에서 UEP 진입을 막지 않도록 로컬 사용자 우선 로그인 복구
          - 저장된 자동로그인 사용자는 기존 사용자정보가 일치하면 즉시 UEP 진입
          - 학교 데이터 연결은 로그인 후 별도 동기화 단계에서 확인
          - v0.82.16 수정내역 1회 팝업·공결/지각 상단 4카드 한 줄·대입 DB 연결 유지
          '@
          gh release create v0.82.17 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.17' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.17'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.17/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.17 School Read API 404 로그인 차단 긴급복구 · 로컬 사용자 우선 진입'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.17 RELEASE SUCCESS","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA")|Set-Content release-08212-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08212-status.txt
          git commit -m 'Publish UEP 0.82.17 policy and status'
          git push origin HEAD:main

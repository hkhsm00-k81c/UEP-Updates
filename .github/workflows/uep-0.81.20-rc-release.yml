name: UEP 0.81.20 School Read API RC

on:
  push:
    branches: [fix/0.81.20-school-read-api]
    paths:
      - .github/workflows/uep-0.81.20-rc-release.yml
      - scripts/build-update-0.81.20.ps1
      - tools/apply-school-read-api-0.81.20.js
      - tools/harden-school-read-auth-gate-0.81.20.js
      - tools/normalize-readonly-auth-0.81.20.js
      - uep-policy.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify configured School Read API endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $policy=Get-Content 'uep-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $url=[string]$policy.schoolReadApiUrl
          if($url -notmatch '^https://script\.google\.com/macros/s/[^/]+/exec(?:\?.*)?$'){throw 'schoolReadApiUrl is not configured'}
          Write-Host 'School Read API endpoint configured.'

      - name: Download shipped base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; & "scripts/build-update-$version.ps1"; if($LASTEXITCODE-ne 0){throw "reconstruct failed: $version"} }

      - name: Apply verified 0.81.19 cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patches=@(
            'tools/apply-performance1-0.81.19.js',
            'tools/apply-performance2-0.81.19.js',
            'tools/apply-dashboardview-memoization-0.81.19.js',
            'tools/apply-dashboardview-sort-rank-0.81.19.js',
            'tools/apply-dashboard-calendar-mode-cache-0.81.19.js',
            'tools/apply-openstudentdrawer-summary-pass-0.81.19.js',
            'tools/apply-openstudentdrawer-status-pass-0.81.19.js',
            'tools/apply-openstudentdrawer-after-index-0.81.19.js'
          )
          foreach($p in $patches){ node $p app; if($LASTEXITCODE-ne 0){throw "0.81.19 patch failed: $p"} }
          $g='app/resources/app/gyomuon.js'
          $js=Get-Content $g -Raw -Encoding UTF8
          $js=[regex]::Replace($js,'const APP_VERSION\s*=\s*["''][^"'']+["''];','const APP_VERSION = "0.81.19";',1)
          Set-Content -LiteralPath $g -Value $js -Encoding UTF8 -NoNewline

      - name: Apply 0.81.20 School Read API integration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./scripts/build-update-0.81.20.ps1
          if($LASTEXITCODE-ne 0){throw '0.81.20 integration failed'}

      - name: Final RC gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content 'app/resources/app/electron/main.cjs' -Raw -Encoding UTF8
          $p=Get-Content 'app/resources/app/electron/preload.cjs' -Raw -Encoding UTF8
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $gd=Get-Content 'app/resources/app/electron/google-data.cjs' -Raw -Encoding UTF8
          node --check 'app/resources/app/gyomuon.js'
          node --check 'app/resources/app/electron/main.cjs'
          node --check 'app/resources/app/electron/preload.cjs'
          node --check 'app/resources/app/electron/google-data.cjs'
          $checks=[ordered]@{
            version=$g.Contains('const APP_VERSION = "0.81.20";')
            schoolApiPrimary=$m.Contains('__UEP_SCHOOL_READ_API_PRIMARY_08120__')
            deviceId=$m.Contains('uep-device-id.txt')
            tokenStore=$m.Contains('uep-school-read-session.bin')
            endpoint=$m.Contains('schoolReadApiUrl')
            loginBridge=$p.Contains('schoolReadLogin:') -and $g.Contains('window.schoolBoard.schoolReadLogin({name,email})')
            sessionBridge=$p.Contains('schoolReadSessionStatus:') -and $g.Contains('schoolReadSessionStatus({verify:true})')
            logoutBridge=$p.Contains('schoolReadLogout:') -and $g.Contains('schoolReadLogout')
            batchRead=$m.Contains("startsWith('UEP_SCHOOL_READ:')") -and $m.Contains('schoolReadBatchRead(spreadsheetId,ranges)')
            noRememberBypass=(-not $g.Contains('if(state?.auth?.rememberUser&&state?.auth?.user){hideUserAuthGate();authSessionReady=true;state.auth.locked=false;}'))
            noReadonlyOAuthFallback=(-not ($m -match 'getReadonlySheetsAuth[\s\S]{0,1800}readGoogleUserOAuth'))
            noReadonlyServiceFallback=(-not ($m -match 'getReadonlySheetsAuth[\s\S]{0,1800}readEncrypted\(credentialPath\(\)\)'))
            single06=$gd.Contains('"06_선택과목이력"') -and (-not $gd.Contains('06A_학생별선택과목'))
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host ("RC GATE {0} = {1}" -f $_.Key,$_.Value)}
          if($checks.Values-contains $false){throw '0.81.20 RC gate failed'}

      - name: Build RC update package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath UEP-update.sha256 -Value $sha -Encoding ascii
          Write-Host "UEP 0.81.20 RC SHA256=$sha"

      - name: Publish prerelease v0.81.20-rc1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.20-rc1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target 'fix/0.81.20-school-read-api' --title 'UEP 0.81.20 RC1 - School Read API' --notes '담임 개인 Google OAuth/Drive 권한 없이 UEP 로그인 → 기기승인 → UEP Token → School Read API → 학교 시트 읽기 경로를 검증하는 테스트용 prerelease입니다. 자동업데이트 정책은 변경하지 않습니다.' --prerelease
          }
          gh release upload $tag UEP-update.zip UEP-update.sha256 --repo $env:GITHUB_REPOSITORY --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.20-RC1
          path: |
            UEP-update.zip
            UEP-update.sha256

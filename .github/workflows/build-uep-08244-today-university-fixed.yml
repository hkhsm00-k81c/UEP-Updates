name: Build and Release UEP 0.82.44 Corrected Today University
on:
  push:
    paths:
      - 'release-08244.trigger'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$cmd,[string]$label){ & $cmd; if($LASTEXITCODE -ne 0){ throw "$label failed with exit code $LASTEXITCODE" } }
          Invoke-WebRequest 'https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.42/UEP-update.zip' -OutFile base.zip
          Expand-Archive base.zip app -Force
          Run-Native { node scripts/patch-uep-08244-today-university-compact-fixed.js app } 'patch'
          Run-Native { node --check app/resources/app/gyomuon.js } 'syntax check'
          Run-Native { node scripts/test-uep-08244-today-university-compact-fixed.js app } 'validation'
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          if($g -notmatch 'APP_VERSION\s*=\s*"0\.82\.44"'){throw 'built asset does not contain 0.82.44 APP_VERSION'}
          if($g -notmatch 'UEP_08244_TODAY_UNIVERSITY_COMPACT_CSS'){throw 'built asset missing 0.82.44 compact CSS'}
          if(Test-Path UEP-update.zip){Remove-Item UEP-update.zip -Force}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $hash=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  UEP-update.zip" | Set-Content sha256.txt -Encoding ascii
          if((Get-Item UEP-update.zip).Length -lt 100MB){throw 'release zip unexpectedly small'}
          gh release create v0.82.44 UEP-update.zip sha256.txt --title 'UEP v0.82.44' --notes 'UEP v0.82.44`n- v0.82.43 release asset build failure corrected; actual app is now 0.82.44.`n- Today University compact/detail cleanup applied and validated.`n- Campus-based region/display rules applied.'
          if($LASTEXITCODE -ne 0){throw 'gh release create failed'}
          $policy=Get-Content uep-policy.json -Raw | ConvertFrom-Json
          $policy.latestVersion='0.82.44'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.44/UEP-update.zip'
          $policy.sha256=$hash
          $policy.message='UEP 0.82.44 · 오늘의 대학 0.82.43 빌드 오류 정정'
          $policy | ConvertTo-Json -Depth 10 | Set-Content uep-policy.json -Encoding utf8
          @"
          UEP 0.82.44 RELEASE SUCCESS
          base=v0.82.42
          version-in-asset=0.82.44
          validation=PASS
          native-exit-code-guard=ENABLED
          sha256=$hash
          "@ | Set-Content release-08244-status.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08244-status.txt
          git commit -m 'Publish UEP 0.82.44 corrected policy and status'
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'git push failed'}
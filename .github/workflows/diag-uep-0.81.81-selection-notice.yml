name: Diagnose UEP 0.81.80 Selection and Notice
on:
  push:
    branches:
      - build/0.81.81-selection-roster-error-notice
    paths:
      - diag-uep-0.81.81.trigger
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.80 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diag | Out-Null
          gh release download v0.81.80 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Extract exact runtime functions
        shell: pwsh
        run: |
          @'
          const fs=require('fs');
          const text=fs.readFileSync('app/resources/app/gyomuon.js','utf8');
          function extractFunction(name){
            const sig='function '+name+'(';
            const start=text.indexOf(sig); if(start<0)return 'MISSING '+name;
            const brace=text.indexOf('{',start); let depth=0,quote='',esc=false,templateDepth=0;
            for(let i=brace;i<text.length;i++){
              const ch=text[i],prev=text[i-1];
              if(quote){ if(esc){esc=false;continue;} if(ch==='\\'){esc=true;continue;} if(ch===quote){quote='';} continue; }
              if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
              if(ch==='{')depth++; else if(ch==='}'){depth--; if(depth===0)return text.slice(start,i+1);}
            }
            return 'UNTERMINATED '+name;
          }
          const names=['uepOpenSubjectModal08128','uepCrossTrackRows08161','uepCrossTrackView08161','bindSelectionAnalysis','uepSelectionDataset','uepSelectionErrorsForRow'];
          let out=names.map(n=>'===== '+n+' =====\n'+extractFunction(n)).join('\n\n');
          for(const needle of ['uep.releaseNotes.seen','RELEASE_KEY','업데이트 내역','releaseNotes']){
            out+='\n\n===== NEEDLE '+needle+' =====\n';let p=0,c=0;
            while((p=text.indexOf(needle,p))>=0&&c<8){out+=text.slice(Math.max(0,p-1800),Math.min(text.length,p+4200))+'\n---\n';p+=needle.length;c++;}
          }
          fs.writeFileSync('diag/08181-selection-notice-exact.txt',out,'utf8');
          '@ | Set-Content extract-08181.cjs -Encoding UTF8
          node extract-08181.cjs
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag/08181-selection-notice-exact.txt
          git commit -m 'diag: extract exact 0.81.80 selection functions and notice runtime'
          git push

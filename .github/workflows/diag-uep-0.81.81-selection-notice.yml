name: Diagnose UEP 0.81.80 Selection and Notice
on:
  push:
    branches:
      - build/0.81.81-selection-roster-error-notice
    paths:
      - diag-uep-0.81.81.trigger
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.80 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diag | Out-Null
          gh release download v0.81.80 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Extract focused runtime diagnostics
        shell: pwsh
        run: |
          @'
          const fs=require('fs');
          const text=fs.readFileSync('app/resources/app/gyomuon.js','utf8');
          function around(needle,before=6000,after=12000){let out='',p=0,c=0;while((p=text.indexOf(needle,p))>=0&&c<5){out+='===== '+needle+' #'+(c+1)+' =====\n'+text.slice(Math.max(0,p-before),Math.min(text.length,p+after))+'\n\n';p+=needle.length;c++;}return out||'MISSING '+needle;}
          fs.writeFileSync('diag/08181-error-ui.txt',around('data-curriculum-error-type')+'\n'+around('오류유형'),'utf8');
          fs.writeFileSync('diag/08181-update-notice.txt',around('uep.releaseNotes.seen')+'\n'+around('RELEASE_KEY')+'\n'+around('업데이트 내역'),'utf8');
          '@ | Set-Content extract-focused-08181.cjs -Encoding UTF8
          node extract-focused-08181.cjs
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag/08181-error-ui.txt diag/08181-update-notice.txt
          git commit -m 'diag: focus 0.81.80 error UI and update notice runtime'
          git push

name: Publish UEP 0.81.64 Focused Auth Fix
'on':
  push:
    branches: [main]
    paths: [publish-uep-0.81.64-auth.trigger]
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.64-auth
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download actual 0.81.63
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.63 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Apply focused 0.81.64 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';node scripts/patch-uep-0.81.64-auth.js app
          node --check app/resources/app/gyomuon.js;node --check app/resources/app/electron/main.cjs
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.64';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
      - name: Build and re-open package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal;Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          node --check verify/resources/app/gyomuon.js;node --check verify/resources/app/electron/main.cjs
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8;$m=Get-Content verify/resources/app/electron/main.cjs -Raw -Encoding UTF8
          if(!$g.Contains('SUBJECT_CONFIDENTIAL_PIN_HASH')){throw 'shared curriculum password route missing'}
          if(!$m.Contains('__UEP_08164_NOTICE_RECEIPT_SCHOOL_READ__')){throw 'School Read notice route missing'}
          if(!$m.Contains("action:'notice-receipt-save'")){throw 'notice receipt action missing'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.64
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.64 --repo $env:GITHUB_REPOSITORY *> $null;if($LASTEXITCODE -eq 0){gh release delete v0.81.64 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes};$global:LASTEXITCODE=0
          gh release create v0.81.64 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.64 Shared Curriculum Auth + Notice Receipt Route' --notes '선택과목 보호 비밀번호를 관리자 PC 로컬값이 아닌 공용 설정값으로 읽도록 전환합니다. 담임 공지 확인 저장은 Google 서비스계정 승인 경로를 타지 않고 School Read 로그인 경로를 사용하도록 전환합니다. School Read 백엔드에 notice-receipt-save 쓰기 액션이 아직 없다면 앱은 Google 승인창 대신 중앙 저장 기능 미배포 상태를 명확히 반환합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.64/UEP-update.zip';$policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.64';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='교육과정 공용 비밀번호 인증 · 담임 공지확인 School Read 경로 전환';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.64';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='교육과정 공용 비밀번호 인증 + 담임 공지확인 School Read 경로'}|ConvertTo-Json;Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.64 focused auth fixes';git push

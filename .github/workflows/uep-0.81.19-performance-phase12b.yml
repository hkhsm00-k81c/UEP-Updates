name: UEP 0.81.19 Performance Phase12B
on:
  push:
    branches: [audit/0.81.19-performance]
    paths:
      - .github/workflows/uep-0.81.19-performance-phase12b.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  persist-dashboardview-analysis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified performance patches
        shell: pwsh
        run: |
          node ./tools/apply-performance1-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase1 applicator failed'}
          node ./tools/apply-performance2-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase2 applicator failed'}
      - name: Analyze dashboardView repeated transforms
        shell: pwsh
        run: |
          node ./tools/analyze-dashboardview-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase12 dashboardView analysis failed'}
          node --check app/resources/app/gyomuon.js
      - name: Persist analysis results
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'audit-output/performance-0.81.19' | Out-Null
          Copy-Item 'performance-phase12-output/dashboardview-analysis.json' 'audit-output/performance-0.81.19/dashboardview-analysis.json' -Force
          Copy-Item 'performance-phase12-output/DASHBOARDVIEW-ANALYSIS.md' 'audit-output/performance-0.81.19/DASHBOARDVIEW-ANALYSIS.md' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/performance-0.81.19/dashboardview-analysis.json audit-output/performance-0.81.19/DASHBOARDVIEW-ANALYSIS.md
          if(-not (git diff --cached --quiet)){ git commit -m 'Persist 0.81.19 dashboardView analysis results'; git push origin HEAD:audit/0.81.19-performance }

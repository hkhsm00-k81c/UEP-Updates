name: UEP 0.81.19 Performance Phase14
on:
  push:
    branches: [audit/0.81.19-performance-phase13]
    paths:
      - tools/apply-dashboardview-sort-rank-0.81.19.js
      - .github/workflows/uep-0.81.19-performance-phase14.yml
  workflow_dispatch:
jobs:
  verify-dashboardview-sort-rank:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Reconstruct production through 0.81.18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..18 | ForEach-Object { $version='0.81.{0:d2}' -f $_; $script="scripts/build-update-$version.ps1"; if(-not (Test-Path $script)){throw "missing $script"}; & $script }
      - name: Apply verified performance patches
        shell: pwsh
        run: |
          node ./tools/apply-performance1-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase1 applicator failed'}
          node ./tools/apply-performance2-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase2 applicator failed'}
          node ./tools/apply-dashboardview-memoization-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase13 applicator failed'}
      - name: Apply dashboardView sort rank optimization
        shell: pwsh
        run: |
          node ./tools/apply-dashboardview-sort-rank-0.81.19.js app
          if($LASTEXITCODE -ne 0){throw 'phase14 applicator failed'}
          node --check app/resources/app/gyomuon.js
      - name: Verify sort comparator no longer scans quickOrder arrays
        shell: pwsh
        run: |
          $text=Get-Content app/resources/app/gyomuon.js -Raw
          if($text -match '\(quickOrder\[a\[2\]\]\|\|\[\]\)\.indexOf\(a\[0\]\)'){throw 'old quickOrder indexOf comparator remains'}
          if($text -notmatch 'const quickOrderRank=Object\.fromEntries'){throw 'quickOrderRank cache missing'}
          Write-Host 'dashboardView quick sort rank optimization verified'

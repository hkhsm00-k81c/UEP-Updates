name: UEP 0.81.23 Diagnose Dashboard and Dorm Paths

'on':
  push:
    branches:
      - fix/0.81.23-dashboard-dorm-sync
    paths:
      - .github/workflows/uep-0.81.23-diagnose.yml
      - uep-0.81.23-diagnose.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 0.81.22 shipped package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diagnostics | Out-Null
          gh release download v0.81.22 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Capture compact root-path reports
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g='app/resources/app/gyomuon.js'
          if(-not (Test-Path $g)){ throw 'gyomuon.js missing' }
          $lines=Get-Content $g -Encoding UTF8

          function Write-Hits([string]$out,[string[]]$patterns,[int]$before=4,[int]$after=8,[int]$limit=16){
            "SOURCE: $g" | Set-Content $out -Encoding UTF8
            $hitLines = New-Object System.Collections.Generic.List[int]
            for($i=0; $i -lt $lines.Count; $i++){
              foreach($p in $patterns){ if($lines[$i].Contains($p)){ $hitLines.Add($i); break } }
            }
            $selected=@($hitLines | Sort-Object -Unique | Select-Object -First $limit)
            foreach($h in $selected){
              Add-Content $out ("`n@@ HIT line {0}: {1}" -f ($h+1),$lines[$h].Trim()) -Encoding UTF8
              $s=[Math]::Max(0,$h-$before); $e=[Math]::Min($lines.Count-1,$h+$after)
              for($j=$s;$j -le $e;$j++){ Add-Content $out ("{0,6}: {1}" -f ($j+1),$lines[$j]) -Encoding UTF8 }
            }
            Add-Content $out ("`nHIT_COUNT={0}; SHOWN={1}" -f $hitLines.Count,$selected.Count) -Encoding UTF8
          }

          Write-Hits 'diagnostics/08123-dashboard-timetable.txt' @('personalTimetableData','dashboardPersonalWeekMarkup','timetableRows','teacherTimetable','readonlyCache?.timetable','readonlyCache.timetable','시간표') 5 10 18
          Write-Hits 'diagnostics/08123-dashboard-work.txt' @('directNoticeRows','dashboardDeadlineItems','workBoardData','readonlyCache?.work','readonlyCache.work','operations','업무·공지','학교업무') 5 10 18
          Write-Hits 'diagnostics/08123-dorm-mail.txt' @('dormOuting','dorm outing','학사외출','귀가','입소','늦은 입소','late','mail','메일','보고문','sendMail') 5 10 28
          Write-Hits 'diagnostics/08123-readonly-gate.txt' @('schoolReadSessionStatus','googleConnectionStatus','refreshReadonlyCacheSilently','previewReadonlySync','readReadonlyCache','readonlyCache=') 5 10 22

          foreach($f in @('diagnostics/08123-dashboard-timetable.txt','diagnostics/08123-dashboard-work.txt','diagnostics/08123-dorm-mail.txt','diagnostics/08123-readonly-gate.txt')){
            if((Get-Item $f).Length -lt 200){ throw "diagnostic too small: $f" }
          }

      - name: Persist compact diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/08123-*.txt
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){ Write-Host 'No diagnostic changes to commit'; exit 0 }
          git commit -m 'diag: persist compact 0.81.23 root path reports'
          git push origin HEAD:fix/0.81.23-dashboard-dorm-sync

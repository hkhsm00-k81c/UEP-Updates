name: UEP 0.81.23 Diagnose Dashboard and Dorm Paths

'on':
  push:
    branches:
      - fix/0.81.23-dashboard-dorm-sync
    paths:
      - .github/workflows/uep-0.81.23-diagnose.yml
      - uep-0.81.23-diagnose.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 0.81.22 shipped package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,diagnostics | Out-Null
          gh release download v0.81.22 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force

      - name: Capture exact runtime symbols
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g='app/resources/app/gyomuon.js'
          if(-not (Test-Path $g)){ throw 'gyomuon.js missing' }
          $lines=Get-Content $g -Encoding UTF8

          function Write-Anchors([string]$out,[string[]]$anchors,[int]$before=6,[int]$after=10,[int]$perAnchor=4){
            "SOURCE: $g" | Set-Content $out -Encoding UTF8
            foreach($a in $anchors){
              Add-Content $out ("`n### ANCHOR: {0}" -f $a) -Encoding UTF8
              $matches=@()
              for($i=0;$i -lt $lines.Count;$i++){ if($lines[$i].Contains($a)){ $matches += $i } }
              Add-Content $out ("COUNT={0}" -f $matches.Count) -Encoding UTF8
              foreach($h in ($matches | Select-Object -First $perAnchor)){
                Add-Content $out ("@@ line {0}" -f ($h+1)) -Encoding UTF8
                $s=[Math]::Max(0,$h-$before); $e=[Math]::Min($lines.Count-1,$h+$after)
                for($j=$s;$j -le $e;$j++){ Add-Content $out ("{0,6}: {1}" -f ($j+1),$lines[$j]) -Encoding UTF8 }
              }
            }
          }

          Write-Anchors 'diagnostics/08123-timetable-exact.txt' @(
            'personalTimetableData','dashboardPersonalWeekMarkup','timetableRows','teacherTimetable',
            'readonlyCache?.timetable','readonlyCache.timetable','readonlyCache?.teacherTimetable',
            'renderTimetable','renderDashboard'
          ) 5 9 4

          Write-Anchors 'diagnostics/08123-work-exact.txt' @(
            'directNoticeRows','dashboardDeadlineItems','workBoardData','readonlyCache?.work','readonlyCache.work',
            'renderWork','operationsMarkup','dashboardOperations','directNotices'
          ) 5 9 4

          Write-Anchors 'diagnostics/08123-dorm-exact.txt' @(
            'updateDormOutingCount','dormOutingExcludedByRule','dormOutingRows','dormOuting','renderDorm',
            'sendDorm','dormReport','reportDorm','sendMail','mailAlerts.dormOuting'
          ) 5 10 5

          Write-Anchors 'diagnostics/08123-gate-exact.txt' @(
            'schoolReadSessionStatus','refreshReadonlyCacheSilently','previewReadonlySync','readReadonlyCache',
            'googleConnectionStatus?.ok','readonlyCache=cached.data','readonlyCache = cached.data'
          ) 5 9 5

      - name: Persist exact diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/08123-*-exact.txt
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){ Write-Host 'No diagnostic changes to commit'; exit 0 }
          git commit -m 'diag: persist exact 0.81.23 runtime symbols'
          git push origin HEAD:fix/0.81.23-dashboard-dorm-sync

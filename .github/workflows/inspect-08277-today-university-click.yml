name: Inspect UEP 0.82.77 Today University Click
on:
  push:
    paths: ['inspect-08277-today-university-click.trigger']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.77 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $gy='app/resources/app/gyomuon.js'
          $txt=Get-Content $gy -Raw
          $needles=@('오늘의 대학','todayUniversity','data-admission','admissionUniversity','openAdmission','uep08276RenderAdmissionUniversity','data-today-university','data-admission-mode')
          $out=@()
          foreach($needle in $needles){
            $idx=0;$found=0
            while(($idx=$txt.IndexOf($needle,$idx,[System.StringComparison]::OrdinalIgnoreCase)) -ge 0 -and $found -lt 12){
              $s=[Math]::Max(0,$idx-1800);$len=[Math]::Min(5200,$txt.Length-$s)
              $out += "===== $needle @ $idx ====="
              $out += $txt.Substring($s,$len)
              $idx += [Math]::Max(1,$needle.Length);$found++
            }
          }
          $out -join "`r`n" | Set-Content inspection-08277-today-university-click.txt -Encoding utf8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-08277-today-university-click.txt
          git commit -m 'Inspect UEP 0.82.77 today university click'
          if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'pull failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'push failed'}

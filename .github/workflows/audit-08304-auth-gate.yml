name: Audit UEP PC 0.83.04 Auth Gate
on:
  push:
    branches: [main]
    paths: [audit-08304-auth-gate.trigger]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.83.04 release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          rm -rf /tmp/u && mkdir -p /tmp/u
          gh release download v0.83.04 -R "$GITHUB_REPOSITORY" -p UEP-update.zip -D /tmp/u
          unzip -q /tmp/u/UEP-update.zip -d /tmp/u/app
      - name: Extract auth startup flow
        run: |
          set -euo pipefail
          G=/tmp/u/app/resources/app/gyomuon.js
          M=/tmp/u/app/resources/app/electron/main.cjs
          mkdir -p audit/08304-auth
          python3 - <<'PY'
          from pathlib import Path
          g=Path('/tmp/u/app/resources/app/gyomuon.js').read_text(encoding='utf-8')
          terms=['function initializeUserSessionGate','async function initializeUserSessionGate','showUserAuthGate','hideUserAuthGate','resumedRememberedSession','authSessionReady','schoolReadLogin','initializeUserSessionGate()']
          out=[]
          lines=g.splitlines()
          for term in terms:
              hits=[i for i,x in enumerate(lines) if term in x]
              out.append('\n===== '+term+' hits='+str(len(hits))+' =====\n')
              for i in hits:
                  a=max(0,i-35); b=min(len(lines),i+90)
                  out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
                  out.append('\n---\n')
          Path('audit/08304-auth/auth-flow.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          grep -nE 'schoolRead|auth|session|remember|token|login' "$M" | head -n 1200 > audit/08304-auth/main-auth.txt || true
      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/08304-auth
          git commit -m 'audit: capture 0.83.04 auth startup flow'
          git push

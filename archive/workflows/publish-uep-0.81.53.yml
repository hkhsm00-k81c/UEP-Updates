name: Publish UEP 0.81.53 Verified Attendance and Curriculum Repair

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: [publish-uep-0.81.53.trigger]

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.53
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.52
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.52 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $zip=Get-ChildItem source -File -Filter '*.zip' | Select-Object -First 1
          if(!$zip){throw '0.81.52 release zip not found'}
          Expand-Archive $zip.FullName app -Force
      - name: Apply and verify repairs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.53.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.53';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.53";',"row['일자']||row['출결일자']",'function openCurriculumStudentSidePanel(',"curriculum&&typeof openCurriculumStudentSidePanel==='function'",'최근 학기말 평균','function upsertNoticeCache(','시험별 등급 분포 비교')){if(!$g.Contains($x)){throw "regression marker missing: $x"}}
      - name: Build package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.53";',"row['일자']||row['출결일자']",'function openCurriculumStudentSidePanel(')){if(!$g.Contains($x)){throw "packaged marker missing: $x"}}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.53
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.53 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete v0.81.53 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes};$global:LASTEXITCODE=0
          gh release create v0.81.53 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.53 Verified Attendance and Curriculum Repair' --notes 'School Read API 공결 원본 필드를 표준화하고 구형 캡처 이벤트가 선택과목 우측 패널을 막는 문제를 제거합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.53/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.53';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='공결 원본날짜·선택과목 우측패널 재수정';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.53';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='공결 원본날짜·선택과목 우측패널 재수정'}|ConvertTo-Json;Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.53 verified attendance curriculum repair';git push

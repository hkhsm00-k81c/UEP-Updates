name: Release UEP 0.81.97 Attendance Settings

on:
  push:
    branches: [main]
    paths:
      - release-uep-08197-attendance-settings.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate patch script
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08197-attendance-quicklaunch.js
      - name: Download official 0.81.96 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,out,verify | Out-Null
          gh release download v0.81.96 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          if(!(Test-Path app/UEP.exe)){throw 'UEP.exe missing'}
      - name: Apply 0.81.97 focused fixes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-08197-attendance-quicklaunch.js app
      - name: Static verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/preload.cjs
          $pkg=Get-Content app/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.97'){throw 'package version mismatch'}
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          foreach($marker in @('const APP_VERSION = "0.81.97";','UEP_08197_ATTENDANCE_DATE_SHIFT','openMessenger','openComtime')){if(!$g.Contains($marker)){throw "renderer marker missing: $marker"}}
          foreach($marker in @('UEP_08197_QUICK_LAUNCH_PERSISTENCE','quick-launch-settings.json','state:load','state:save','external:selectExecutable','external:launchExecutable')){if(!$m.Contains($marker)){throw "main marker missing: $marker"}}
          if($g.Contains('UEP_08195_SELECTION_PERSISTENCE_DIAGNOSTIC')){throw '0.81.95 diagnostic contamination detected'}
      - name: Pack and reopen verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path app/* -DestinationPath out/UEP-update.zip -CompressionLevel Optimal
          Expand-Archive out/UEP-update.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          node --check verify/resources/app/electron/main.cjs
          node --check verify/resources/app/electron/preload.cjs
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.97'){throw 'repacked version mismatch'}
          $sha=(Get-FileHash out/UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          $sha | Set-Content out/sha256.txt
          "SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SHA256=$sha"
      - name: Publish 0.81.97 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.97 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){throw 'v0.81.97 already exists; refusing overwrite'}
          $notes=@"
          UEP v0.81.97 안정화 업데이트

          - 출결 공결 조회일 이전/다음 이동 로직 안정화
          - 8월↔9월 등 월 경계 날짜 이동 검증
          - 충북소통메신저·컴시간알리미 실행 경로를 APPDATA 고정 사용자영역에 별도 보존
          - 이후 자동업데이트로 프로그램 폴더가 교체되어도 실행메뉴 경로 유지
          - 선택과목 로직은 0.81.96 안정판 그대로 유지
          "@
          gh release create v0.81.97 out/UEP-update.zip out/sha256.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'UEP v0.81.97' --notes $notes
      - name: Enable automatic update to 0.81.97
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json
          $p.latestVersion='0.81.97'
          $p.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.97/UEP-update.zip'
          $p.sha256=$env:SHA256
          $p.message='UEP 0.81.97 공결 날짜 이동 수정 · 실행메뉴 경로 업데이트 후 유지'
          $p|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json
          git commit -m 'Promote UEP 0.81.97 automatic update'
          git push origin HEAD:main
      - name: Final verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.97 --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease,url
          $p=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($p.latestVersion -ne '0.81.97'){throw 'policy version mismatch'}
          if($p.sha256 -ne $env:SHA256){throw 'policy sha mismatch'}
          Write-Host "DEPLOYED_SHA256=$env:SHA256"

name: Diagnose UEP 0.81.72 R6 Render Observer Map
'on':
  push:
    branches: [main]
    paths:
      - diag-uep-0.81.72-r6-render-observer-map.trigger
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download R6 artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force stage,app|Out-Null
          gh run download 32910802716 --repo $env:GITHUB_REPOSITORY -n UEP-0.81.72-performance-candidate-r6 -D stage
          Expand-Archive stage/UEP-update-0.81.72-candidate-r6.zip app -Force
      - name: Map observers and page dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$g='app/resources/app/gyomuon.js';$lines=Get-Content $g -Encoding UTF8;$out=@('# UEP 0.81.72 R6 render/observer map','')
          $out+='## MutationObservers exact blocks';for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match 'MutationObserver'){ $s=[Math]::Max(0,$i-35);$e=[Math]::Min($lines.Count-1,$i+18);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$lines[$j])};$out+='---'}}
          $out+='## Canonical render function';$idx=($lines|Select-String '^function render\(' | Select-Object -First 1).LineNumber;if($idx){for($j=$idx-1;$j -lt [Math]::Min($lines.Count,$idx+180);$j++){$out+=('{0}: {1}' -f ($j+1),$lines[$j])}}
          $out+='## Page names and render dispatch';for($i=0;$i -lt $lines.Count;$i++){if(($lines[$i] -like '*renderers*') -or ($lines[$i] -like '*pageMap*') -or ($lines[$i] -like '*activePage*')){if($i -lt 2200){$out+=('{0}: {1}' -f ($i+1),$lines[$i])}}}
          $out+='## Operational cache key uses';foreach($key in @('officialAttendance','lateAttendance','notices','noticeReceipts','lunchDuties','nightSupervisors','dormOutings')){$out+="### $key";for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match [regex]::Escape($key)){$s=[Math]::Max(0,$i-2);$e=[Math]::Min($lines.Count-1,$i+2);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$lines[$j])}}}}
          $out+='## Approval / Google UI / growth canonical names';foreach($pat in @('approval','결재라인','Google 시트 연결 승인','학교 공용 연결 확인','growth-program-guide','프로그램 추천')){$out+="### $pat";for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match [regex]::Escape($pat)){$out+=('{0}: {1}' -f ($i+1),$lines[$i])}}}
          $out|Set-Content diag-uep-0.81.72-r6-render-observer-map.txt -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git pull --rebase origin main;git add diag-uep-0.81.72-r6-render-observer-map.txt;git commit -m 'diag: capture UEP 0.81.72 R6 render observer map';git push

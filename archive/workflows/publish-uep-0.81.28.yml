name: Publish UEP 0.81.28

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-uep-0.81.28.yml
      - publish-uep-0.81.28.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shipped 0.81.27
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,out | Out-Null
          gh release download v0.81.27 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force

      - name: Apply canonical selection model 0.81.28
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          const fs=require('fs');
          const jsFile='app/resources/app/gyomuon.js';
          const cssFile=fs.existsSync('app/resources/app/gyomuon.css')?'app/resources/app/gyomuon.css':'app/resources/app/style.css';
          let s=fs.readFileSync(jsFile,'utf8');
          let c=fs.readFileSync(cssFile,'utf8');
          if(!s.includes('const APP_VERSION = "0.81.27";')) throw new Error('0.81.27 version anchor missing');
          s=s.replace('const APP_VERSION = "0.81.27";','const APP_VERSION = "0.81.28";');
          const replaceRange=(src,startNeedle,endNeedle,replacement)=>{const a=src.indexOf(startNeedle);if(a<0)throw new Error('start missing: '+startNeedle);const b=src.indexOf(endNeedle,a+startNeedle.length);if(b<0)throw new Error('end missing: '+endNeedle);return src.slice(0,a)+replacement+'\n'+src.slice(b);};

          const helper=`function uepSelectionSubjectState(subject,term,errors){const hit=(errors||[]).find(e=>Array.isArray(e.subjects)&&e.subjects.some(x=>String(x).replace(/\\s+/g,'')===String(subject).replace(/\\s+/g,''))&&(String(e.term||'').includes(term)||Array.isArray(e.terms)&&e.terms.includes(term)));return hit?{cls:'selection-subject-error',label:String(hit.type||'오류').replace(/오류$/,'')}:{cls:'',label:'신청'};}\nfunction uepSelectionErrorSummary(errors){const types=[...new Set((errors||[]).map(e=>String(e.type||'오류')))];return types.length?types.slice(0,2).join(' · ')+(types.length>2?' +'+(types.length-2):''):'정상';}\n`;
          s=replaceRange(s,'function uepSelectionSubjectState(','// __UEP_08113_RESTORED_SELECTION_DATASET__',helper+'\n// __UEP_08113_RESTORED_SELECTION_DATASET__');

          const model=`const UEP_SELECTION_GROUP_RULES_08128={\n  '2-1':{main:{label:'주요 선택군',pick:3},info:{label:'중국어·일본어·인공지능 기초',pick:1},art:{label:'음악·미술',pick:1}},\n  '2-2':{main:{label:'주요 선택군',pick:3},info:{label:'중국어 회화·일본어 회화·정보과학',pick:1},art:{label:'음악·미술',pick:1}},\n  '3-1':{main:{label:'주요 선택군',pick:5}},\n  '3-2':{main:{label:'주요 선택군',pick:7}}\n};\nfunction uepSelectionTermGroups(row,term){const rule=UEP_SELECTION_GROUP_RULES_08128[term]||{main:{label:'선택군',pick:null}},keys=Object.keys(row||{}).filter(k=>k.startsWith(term+' '));const take=rx=>keys.filter(k=>rx.test(k)).map(k=>String(row[k]||'').trim()).filter(Boolean);const groups=[];const main=take(/선택\\d+/);groups.push({id:'main',label:rule.main.label,pick:rule.main.pick,subjects:main});const info=take(/정보·외국어|정보.*외국어/);if(rule.info||info.length)groups.push({id:'info',label:rule.info?.label||'정보·제2외국어',pick:rule.info?.pick||1,subjects:info});const art=take(/예술/);if(rule.art||art.length)groups.push({id:'art',label:rule.art?.label||'예술',pick:rule.art?.pick||1,subjects:art});return groups;}\nfunction uepSelectionTrack(subject){const x=String(subject||'').replace(/\\s+/g,'');if(/중국어/.test(x))return '중국어';if(/일본어/.test(x))return '일본어';if(/인공지능기초|정보과학/.test(x))return '정보';if(/음악/.test(x))return '음악';if(/미술/.test(x))return '미술';return '';}\nfunction uepSelectionErrors08105(row){const errors=[],terms=['2-1','2-2','3-1','3-2'],seenSubjects=new Map();const science=/(물리|화학|생명과학|지구과학|역학|에너지|전자기|양자|세포|물질대사|유전|지구시스템|융합과학)/,social=/(세계사|동아시아|사회와 문화|사회문화|윤리|지리|정치|법과 사회|경제|인문학|사회문제)/;terms.forEach(term=>{const subjects=uepSelectionTermSubjects(row,term);if(!subjects.length)errors.push({type:'신청 누락',term,terms:[term],subjects:[],detail:'해당 학기 선택과목이 비어 있습니다.'});subjects.forEach(subject=>{const n=String(subject).replace(/\\s+/g,'');if(!seenSubjects.has(n))seenSubjects.set(n,[]);seenSubjects.get(n).push({term,subject});});const groups=uepSelectionTermGroups(row,term);groups.forEach(g=>{if(Number.isFinite(g.pick)&&g.subjects.length!==g.pick)errors.push({type:'선택군 과목수 오류',term,terms:[term],subjects:g.subjects,detail:g.label+'에서 '+g.pick+'과목을 선택해야 합니다. (현재 '+g.subjects.length+'과목)'});});if(['2-1','2-2'].includes(term)&&subjects.some(x=>science.test(x))&&subjects.some(x=>social.test(x)))errors.push({type:'문·이과 교차오류',term,terms:[term],subjects:subjects.filter(x=>science.test(x)||social.test(x)),detail:'사회·과학 계열 선택이 혼합되어 있어 상담 확인이 필요합니다.'});});seenSubjects.forEach(items=>{if(items.length>1)errors.push({type:'학기간 동일과목 중복',term:items.map(x=>x.term).join(' · '),terms:items.map(x=>x.term),subjects:[items[0].subject],detail:items[0].subject+' 과목이 여러 학기에 중복 신청되었습니다.'});});const first=uepSelectionTermSubjects(row,'2-1'),second=uepSelectionTermSubjects(row,'2-2');const hierarchy=[[/역학과 에너지|전자기와 양자/,/물리학/,'물리'],[/물질과 에너지|화학 반응의 세계/,/화학/,'화학'],[/세포와 물질대사|생물의 유전/,/생명과학/,'생명과학'],[/지구시스템과학/,/지구과학/,'지구과학']];hierarchy.forEach(([advanced,basic,label])=>{const adv=second.find(x=>advanced.test(x));if(adv&&!first.some(x=>basic.test(x)))errors.push({type:'과학과목 위계오류',term:'2-1 → 2-2',terms:['2-2'],subjects:[adv],detail:label+' 선이수 과목 확인이 필요합니다.'});});const g21=uepSelectionTermGroups(row,'2-1'),g22=uepSelectionTermGroups(row,'2-2');[['info','정보·제2외국어 계열오류'],['art','예술계열 연계오류']].forEach(([id,type])=>{const a=g21.find(g=>g.id===id)?.subjects?.[0]||'',b=g22.find(g=>g.id===id)?.subjects?.[0]||'';const ta=uepSelectionTrack(a),tb=uepSelectionTrack(b);if((ta||tb)&&ta!==tb)errors.push({type,term:'2-1 → 2-2',terms:['2-1','2-2'],subjects:[a,b].filter(Boolean),detail:(a||'미신청')+' → '+(b||'미신청')+' : 동일 계열로 연계되어야 합니다.'});});const seen=new Set();return errors.filter(e=>{const k=[e.type,e.term,e.detail].join('|');if(seen.has(k))return false;seen.add(k);return true;});}\n`;
          s=replaceRange(s,'function uepSelectionErrors08105(row){','// __UEP_08113_RESTORED_CURRICULUM_SDGS_BODY__',model+'\n// __UEP_08113_RESTORED_CURRICULUM_SDGS_BODY__');

          const detail=`function uepStudentApplicationDetail(row,errors){const student=row.__student,bundle=studentRecordBundle(student),sms=uepSelectionSms(student,errors),className=String(student.className||recordStudentClass(student)||'').replace(/반+$/,'');const career=careerSupportMarkup(student,bundle,false);const alert=errors.length?'<section class="selection-error-panel selection-error-first"><header><h3>먼저 확인할 신청 오류</h3><span>'+errors.length+'건</span></header>'+errors.map(x=>'<article><b>'+escapeHtml(x.type)+'</b><em>'+escapeHtml(x.term)+'</em><p>'+escapeHtml(x.detail)+'</p></article>').join('')+'</section>':'<section class="selection-safe-panel selection-safe-first"><b>✓ 선택과목 검증 정상</b><span>현재 신청자료에서 확인할 오류가 없습니다.</span></section>';const terms=['2-1','2-2','3-1','3-2'];const termCards=terms.map(term=>{const groups=uepSelectionTermGroups(row,term);return '<section><header><h3>'+term.replace('-','학년 ')+'학기</h3><span>'+uepSelectionTermSubjects(row,term).length+'과목</span></header><div class="selection-group-stack">'+groups.map(g=>'<div class="selection-choice-group"><div class="selection-choice-head"><b>'+escapeHtml(g.label)+'</b><span>'+(g.pick?'택'+g.pick:'선택')+'</span></div>'+((g.subjects||[]).map(x=>{const state=uepSelectionSubjectState(x,term,errors);return '<article class="'+state.cls+'"><b>'+escapeHtml(x)+'</b><em>'+escapeHtml(state.label)+'</em></article>';}).join('')||'<div class="selection-missing">미신청</div>')+'</div>').join('')+'</div></section>';}).join('');return '<section class="curriculum-student-detail"><header><div><small>'+escapeHtml(student.studentNo)+' · '+escapeHtml(className)+'반</small><h3>'+escapeHtml(student.name)+' 학생신청</h3></div>'+uepSelectionErrorLabel(errors)+'</header>'+career+alert+'<div class="curriculum-term-grid curriculum-term-grid-four">'+termCards+'</div>'+(errors.length?'<section class="curriculum-message-panel"><header><div><small>STUDENT MESSAGE</small><h3>현재 오류 보완 문자</h3></div><button class="btn primary" data-copy-current-selection-sms>문자 복사</button></header><textarea id="currentSelectionSms" readonly>'+escapeHtml(sms)+'</textarea></section>':'')+'</section>';}\n`;
          s=replaceRange(s,'function uepStudentApplicationDetail(','function uepStudentApplicationView(',detail+'\nfunction uepStudentApplicationView(');

          const studentView=`function uepStudentApplicationView(){const data=uepSelectionDataset(),allRows=data.rows;const mode=recordQueryMode==='student'?'student':'class';const classButton=(no,label,allowAll)=>'<button data-record-class="'+no+'" class="'+(String(recordClassNo)===no?'active':'')+'"><b>'+label+'</b><span>'+(no==='all'?allRows.length:allRows.filter(r=>recordStudentClass(r.__student)===no).length)+'명</span></button>';const switcher='<div class="record-query-switch curriculum-query-primary"><button data-record-query="class" class="'+(mode==='class'?'active':'')+'">반별 조회</button><button data-record-query="student" class="'+(mode==='student'?'active':'')+'">개인별 조회</button></div>';if(mode==='class'){const rows=recordClassNo==='all'?allRows:allRows.filter(r=>recordStudentClass(r.__student)===String(recordClassNo));const types=[...new Set(data.errors.map(x=>x.type))];const visible=rows.filter(r=>{const es=data.errors.filter(e=>e.student.id===r.__student.id);return(!curriculumErrorOnly||es.length)&&(curriculumErrorType==='all'||es.some(e=>e.type===curriculumErrorType));});const classes=classButton('all','전체',true)+Array.from({length:9},(_,i)=>classButton(String(i+1),(i+1)+'반',true)).join('');const controls='<div class="curriculum-mode-block">'+switcher+'<div class="curriculum-filter-bar class-mode"><div class="record-class-cards">'+classes+'</div><button class="btn '+(curriculumErrorOnly?'primary':'secondary')+'" data-curriculum-error-only>'+(curriculumErrorOnly?'오류학생만 보는 중':'오류학생만 보기')+'</button><label>오류유형<select data-curriculum-error-type><option value="all">전체 오류</option>'+types.map(x=>'<option value="'+escapeHtml(x)+'" '+(curriculumErrorType===x?'selected':'')+'>'+escapeHtml(x)+'</option>').join('')+'</select></label></div></div>';return controls+'<div class="curriculum-class-list"><div class="curriculum-class-head"><span>학번·학생</span><span>2-1</span><span>2-2</span><span>3-1</span><span>3-2</span><span>오류종류</span></div>'+visible.map(r=>{const es=data.errors.filter(e=>e.student.id===r.__student.id);return '<button data-record-student="'+escapeHtml(r.__student.id)+'"><b>'+escapeHtml(r.__student.studentNo)+' '+escapeHtml(r.__student.name)+'</b>'+['2-1','2-2','3-1','3-2'].map(t=>'<span>'+uepSelectionTermSubjects(r,t).length+'과목</span>').join('')+'<span class="selection-error-summary">'+escapeHtml(uepSelectionErrorSummary(es))+'</span></button>';}).join('')+'</div>';}if(recordClassNo==='all')recordClassNo='1';const classRows=allRows.filter(r=>recordStudentClass(r.__student)===String(recordClassNo));if(!recordStudentId||!classRows.some(r=>r.__student.id===recordStudentId))recordStudentId=classRows[0]?.__student.id||'';const chosen=classRows.find(r=>r.__student.id===recordStudentId)||classRows[0],errs=chosen?data.errors.filter(e=>e.student.id===chosen.__student.id):[];const classes=Array.from({length:9},(_,i)=>classButton(String(i+1),(i+1)+'반',false)).join('');const picker='<div class="uep-student-picker curriculum-student-picker"><button data-uep-student-prev>‹</button><button class="uep-picker-main" data-open-student-picker><small>'+recordClassNo+'반 학생</small><b>'+escapeHtml(chosen?.__student.studentNo||'')+' '+escapeHtml(chosen?.__student.name||'학생 선택')+'</b></button><button data-uep-student-next>›</button><div class="uep-picker-menu" hidden><input data-uep-student-search placeholder="학번·이름 검색"><div>'+classRows.map(r=>'<button data-record-student="'+escapeHtml(r.__student.id)+'">'+escapeHtml(r.__student.studentNo)+' '+escapeHtml(r.__student.name)+'</button>').join('')+'</div></div></div>';return '<div class="curriculum-mode-block">'+switcher+'<div class="curriculum-filter-bar student-mode"><div class="record-class-cards">'+classes+'</div>'+picker+'</div></div>'+(chosen?uepStudentApplicationDetail(chosen,errs):'');}\n`;
          s=replaceRange(s,'function uepStudentApplicationView(','function uepSubjectStatus(',studentView+'\nfunction uepSubjectStatus(');

          const subjectView=`function uepSubjectGroup08128(subject){const x=String(subject||'');if(/국어|문학|독서|언어생활|주제 탐구 독서|매체 의사소통|수학|미적분|기하|확률|영어|영미|미디어 영어|세계 문화와 영어|심화영어/.test(x)&&!/인공지능 기초/.test(x))return '국·영·수';if(/사회|세계사|동아시아|윤리|지리|정치|법과 사회|경제|인문학|역사로 탐구|금융/.test(x))return '사회';if(/물리|화학|생명|지구|역학|에너지|전자기|양자|세포|물질|유전|융합과학|행성우주/.test(x))return '과학';if(/음악|미술|체육|스포츠/.test(x))return '음·미·체';return '중국어·일본어·정보';}\nfunction uepSubjectApplicationView(){const data=uepSelectionDataset(),terms=['2-1','2-2','3-1','3-2'],groups=data.subjects.filter(x=>x.term===curriculumTermFilter),order=['국·영·수','사회','과학','음·미·체','중국어·일본어·정보'];return '<div class="term-picker-cards">'+terms.map(t=>'<button data-curriculum-term="'+t+'" class="'+(curriculumTermFilter===t?'active':'')+'"><b>'+t.replace('-','학년 ')+'학기</b><span>'+data.subjects.filter(x=>x.term===t).length+'과목</span></button>').join('')+'</div><div class="subject-group-board">'+order.map((name,i)=>{const list=groups.filter(g=>uepSubjectGroup08128(g.subject)===name);if(!list.length)return '';return '<section class="subject-family family-'+i+'"><header><h3>'+name+'</h3><span>'+list.length+'과목</span></header><div class="subject-card-grid">'+list.map(g=>'<button data-curriculum-subject="'+escapeHtml(g.key)+'"><small>'+g.term+'</small><b>'+escapeHtml(g.subject)+'</b><span><strong>'+g.students.length+'명</strong> · 예상 '+g.sectionCount+'분반</span>'+uepSubjectStatus(g)+'</button>').join('')+'</div></section>';}).join('')+'</div>';}\nfunction uepOpenSubjectRosterModal(key){const data=uepSelectionDataset(),group=data.subjects.find(x=>x.key===key);if(!group)return;const privacy=privacyModeEnabled();const layer=document.createElement('div');layer.className='uep-subject-modal-layer';const rows=[...group.students];const draw=mode=>{rows.sort(mode==='class'?((a,b)=>String(a.student.studentNo).localeCompare(String(b.student.studentNo))):((a,b)=>(a.avg??99)-(b.avg??99)||String(a.student.studentNo).localeCompare(String(b.student.studentNo))));const body=rows.map(x=>'<article><b class="privacy-sensitive-text">'+(privacy?'**** ＊＊＊':escapeHtml(x.student.studentNo)+' '+escapeHtml(x.student.name))+'</b><span>'+escapeHtml(recordStudentClass(x.student))+'반</span><span>'+(x.dorm?'<i class="dorm-badge">학사</i>':'-')+'</span><span>'+(privacy?'＊.＊＊':x.avg==null?'성적 없음':x.avg.toFixed(2))+'</span><span>'+(privacy?'＊위':x.expectedRank?x.expectedRank+'위':'-')+'</span><span>'+(privacy?'＊등급':x.expectedGrade==='-'?'-':x.expectedGrade+'등급')+'</span></article>').join('');layer.innerHTML='<div class="uep-subject-modal"><header><div><small>'+escapeHtml(group.term)+' · '+escapeHtml(uepSubjectGroup08128(group.subject))+'</small><h2>'+escapeHtml(group.subject)+'</h2><p>신청 '+group.students.length+'명 · 예상 '+group.sectionCount+'분반</p></div><button data-subject-modal-close>×</button></header><div class="roster-sort"><button data-subject-modal-sort="grade" class="'+(mode==='grade'?'active':'')+'">예상성적순</button><button data-subject-modal-sort="class" class="'+(mode==='class'?'active':'')+'">반·번호순</button></div><div class="selection-roster roster-six-columns"><div class="selection-roster-head"><span>학번·성명</span><span>현재반</span><span>구분</span><span>1학년 내신평균</span><span>예상등수</span><span>예상등급</span></div>'+body+'</div></div>';layer.querySelector('[data-subject-modal-close]').onclick=()=>layer.remove();layer.querySelectorAll('[data-subject-modal-sort]').forEach(b=>b.onclick=()=>draw(b.dataset.subjectModalSort));};draw('grade');layer.addEventListener('click',e=>{if(e.target===layer)layer.remove();});document.body.appendChild(layer);}\n`;
          s=replaceRange(s,'function uepSubjectApplicationView(','function uepCurriculumFinalView(',subjectView+'\nfunction uepCurriculumFinalView(');

          const bind=`function bindSelectionAnalysis(){\n  $$('[data-curriculum-workspace]').forEach(b=>b.onclick=()=>{curriculumWorkspaceMode=b.dataset.curriculumWorkspace;render('records');});\n  $$('[data-record-query]').forEach(b=>b.onclick=()=>{recordQueryMode=b.dataset.recordQuery;curriculumErrorOnly=false;curriculumErrorType='all';if(recordQueryMode==='student'&&recordClassNo==='all')recordClassNo='1';render('records');});\n  $$('[data-record-class]').forEach(b=>b.onclick=()=>{recordClassNo=b.dataset.recordClass;recordStudentId='';render('records');});\n  $$('[data-record-student]').forEach(b=>b.onclick=()=>{recordStudentId=b.dataset.recordStudent;recordQueryMode='student';render('records');});\n  $('[data-curriculum-error-only]')?.addEventListener('click',()=>{curriculumErrorOnly=!curriculumErrorOnly;render('records');});\n  $('[data-curriculum-error-type]')?.addEventListener('change',e=>{curriculumErrorType=e.target.value;render('records');});\n  $$('[data-curriculum-term]').forEach(b=>b.onclick=()=>{curriculumTermFilter=b.dataset.curriculumTerm;curriculumSubjectKey='';render('records');});\n  $$('[data-curriculum-subject]').forEach(b=>b.onclick=()=>uepOpenSubjectRosterModal(b.dataset.curriculumSubject));\n  $('[data-copy-current-selection-sms]')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('#currentSelectionSms')?.value||'');toast('보완 문자메시지를 복사했습니다.');}catch{toast('문자 복사에 실패했습니다.');}});\n  $('[data-open-student-picker]')?.addEventListener('click',()=>{const m=$('.uep-picker-menu');if(m)m.hidden=!m.hidden;});\n  $('[data-uep-student-search]')?.addEventListener('input',e=>{$$('.uep-picker-menu [data-record-student]').forEach(b=>b.hidden=!b.textContent.includes(e.target.value));});\n  if(recordQueryMode==='student'){const classRows=uepActiveSelectionRows().filter(r=>recordStudentClass(r.__student)===String(recordClassNo));const idx=classRows.findIndex(r=>r.__student.id===recordStudentId);$('[data-uep-student-prev]')?.addEventL
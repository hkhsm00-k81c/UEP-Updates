name: Inspect UEP 0.82.27 source anchors
'on':
  push:
    branches: [main]
    paths: [inspect-08227-source.trigger]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.26 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          @'
          const fs=require('fs');
          const files=['app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs'];
          const needles=['const APP_VERSION','function admissionBase','const creditOf=row','actualNineAverage','actualDetails','scoreRecords','57_내신산정DB','admissionGradeCalcs','uep08210MatrixObjects','readonlyCache','parseGoogleSheetData','fetchLiveData'];
          let out=[];
          for(const f of files){
            const s=fs.readFileSync(f,'utf8');
            out.push(`===== FILE ${f} chars=${s.length} =====`);
            for(const n of needles){
              let start=0,count=0;
              while(true){const i=s.indexOf(n,start);if(i<0)break;count++;out.push(`--- ${n} #${count} index=${i} ---`);out.push(s.slice(Math.max(0,i-1300),Math.min(s.length,i+4200)));start=i+n.length;if(count>=10)break;}
              if(!count)out.push(`--- ${n}: NOT FOUND ---`);
            }
          }
          fs.writeFileSync('inspect-08227-source.txt',out.join('\n\n'),'utf8');
          '@ | Set-Content inspect-08227.js -Encoding utf8
          node inspect-08227.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add inspect-08227-source.txt
          git commit -m 'Inspect v0.82.26 grade structures for 0.82.27'
          git push origin HEAD:main

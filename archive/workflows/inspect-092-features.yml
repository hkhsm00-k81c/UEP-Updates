name: Inspect UEP 0.80.92 Feature Sources

on:
  push:
    paths:
      - inspect-092-features.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.80.92 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.80.92 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Extract exact feature implementation regions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=Get-ChildItem 'app/resources/app' -Recurse -File | Where-Object {$_.Extension -in '.js','.cjs','.css','.html'} | Select-Object -ExpandProperty FullName
          $patterns=@('meal-detail-list','approval-nav-row','approval-explorer','privacy-demo-mode','score-stat','내신 통계','subjectSelections','selectionSubjects','06_선택과목이력','openDormOutingDrawer','dormOutings','saveLunchDuty','ipcMain.handle','contextBridge','schoolBoard')
          $out=New-Object System.Collections.Generic.List[string]
          foreach($file in $targets){
            $lines=Get-Content $file -Encoding UTF8
            $hits=@(); foreach($p in $patterns){$hits += Select-String -Path $file -Pattern $p -SimpleMatch -Encoding UTF8}
            $nums=$hits.LineNumber | Sort-Object -Unique
            if(!$nums){continue}
            $ranges=@(); foreach($n in $nums){$ranges+=,@([Math]::Max(1,$n-20),[Math]::Min($lines.Count,$n+35))}
            $ranges=$ranges|Sort-Object {$_[0]};$merged=@()
            foreach($r in $ranges){if($merged.Count-eq 0 -or $r[0]-gt $merged[-1][1]+1){$merged+=,@($r[0],$r[1])}elseif($r[1]-gt $merged[-1][1]){$merged[-1][1]=$r[1]}}
            foreach($r in $merged){$rel=$file.Replace((Resolve-Path '.').Path+'\','');$out.Add("===== $rel lines $($r[0])-$($r[1]) =====");for($i=$r[0];$i-le $r[1];$i++){$out.Add(("{0}: {1}" -f $i,$lines[$i-1]))}}
          }
          $out | Set-Content 'inspect-092-features-output.txt' -Encoding UTF8
      - name: Commit inspection report
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspect-092-features-output.txt
          git commit -m 'Expand 0.80.92 feature implementation inspection' || echo 'no changes'
          git push

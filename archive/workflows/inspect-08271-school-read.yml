name: Inspect UEP 0.82.71 School Read
on:
  push:
    paths: ['inspect-08271-school-read.trigger']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.71 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $f='app/resources/app/electron/main.cjs';$lines=Get-Content $f
          $out=@()
          foreach($pat in @('function schoolReadBatchRead','async function schoolReadBatchRead','schoolReadBatchRead\(','getReadonlySheetsAuth','SCHOOL_READ','schoolRead')){
            $out+="===== PATTERN $pat ====="
            for($i=0;$i-lt $lines.Count;$i++){if($lines[$i]-match $pat){$s=[Math]::Max(0,$i-20);$e=[Math]::Min($lines.Count-1,$i+80);$out+="--- hit line $($i+1) ---";for($j=$s;$j-le $e;$j++){$out+=("{0,6}: {1}" -f ($j+1),$lines[$j])}}}
          }
          $out -join "`r`n" | Set-Content inspection-08271-school-read.txt -Encoding utf8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-08271-school-read.txt;git commit -m 'Inspect UEP 0.82.71 School Read flow';if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git pull --rebase origin main;if($LASTEXITCODE -ne 0){throw 'pull failed'};git push;if($LASTEXITCODE -ne 0){throw 'push failed'}

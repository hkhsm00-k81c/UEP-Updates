name: Inspect UEP 0.82.22 admission navigation
on:
  push:
    branches: [main]
    paths: [inspect-08222-nav.trigger]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.22 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $f='app/resources/app/gyomuon.js'
          $lines=Get-Content $f -Encoding UTF8
          $out=@()
          foreach($p in @('function openDashboardAdmissionUniversityByName','function openDashboardUniversityDetail','function openDashboardTodayUniversity','function openDashboardUniversity','universityAdmissions','admissionUniversities','universityMaster','admissionStructures')){
            for($i=0;$i -lt $lines.Count;$i++){
              if($lines[$i] -like "*$p*"){
                $a=[Math]::Max(0,$i-20);$b=[Math]::Min($lines.Count-1,$i+100)
                $out += "===== $p :: line $($i+1) ====="
                for($j=$a;$j -le $b;$j++){ $out += ('{0}: {1}' -f ($j+1),$lines[$j]) }
                break
              }
            }
          }
          $out | Set-Content inspect-08222-admission-nav.txt -Encoding utf8
          git pull --rebase origin main
          git add inspect-08222-admission-nav.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Inspect v0.82.22 admissions navigation'
          git push origin HEAD:main

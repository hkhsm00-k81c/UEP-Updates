name: Publish UEP 0.81.36 Source-Level Repair

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-uep-0.81.36.js'
      - '.github/workflows/publish-uep-0.81.36.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Download shipped 0.81.35
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Invoke-RestMethod -Headers @{ 'User-Agent'='UEP-Updater' } -Uri 'https://api.github.com/repos/${{ github.repository }}/releases/tags/v0.81.35'
          $asset=$release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          if(-not $asset){throw '0.81.35 zip asset not found'}
          Invoke-WebRequest -Headers @{ 'User-Agent'='UEP-Updater'; 'Accept'='application/octet-stream' } -Uri $asset.browser_download_url -OutFile shipped.zip
          Expand-Archive shipped.zip -DestinationPath app -Force
          if(-not (Test-Path 'app/UEP.exe')){throw 'shipped 0.81.35 package is missing UEP.exe'}

      - name: Apply source-level 0.81.36 repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=(Get-ChildItem app -Recurse -File -Filter gyomuon.js | Select-Object -First 1).FullName
          if(-not $target){throw 'gyomuon.js not found in shipped package'}
          Write-Host "runtime target: $target"
          $before=Get-Content $target -Raw -Encoding UTF8
          $beforeLine=([regex]::Match($before,'[^\r\n]*APP_VERSION[^\r\n]*')).Value
          Write-Host "before patch version: $beforeLine"
          Write-Host "before patch sha256: $((Get-FileHash $target -Algorithm SHA256).Hash.ToLower())"
          node scripts/patch-uep-0.81.36.js app
          if($LASTEXITCODE -ne 0){throw "source patch script failed with exit code $LASTEXITCODE"}
          $after=Get-Content $target -Raw -Encoding UTF8
          $afterLine=([regex]::Match($after,'[^\r\n]*APP_VERSION[^\r\n]*')).Value
          Write-Host "after node patch version: $afterLine"
          if(-not $afterLine.Contains('0.81.36')){throw 'source patch completed but APP_VERSION is not 0.81.36'}
          if($afterLine.Contains('0.81.35')){throw 'source patch left old APP_VERSION declaration'}
          Write-Host "final patched sha256: $((Get-FileHash $target -Algorithm SHA256).Hash.ToLower())"
          node --check $target
          if($LASTEXITCODE -ne 0){throw "patched runtime syntax check failed with exit code $LASTEXITCODE"}

      - name: Verify owner-function repairs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=(Get-ChildItem app -Recurse -File -Filter gyomuon.js | Select-Object -First 1).FullName
          if(-not $target){throw 'gyomuon.js not found for verification'}
          $g=Get-Content $target -Raw -Encoding UTF8
          $appVersionLine=([regex]::Match($g,'[^\r\n]*APP_VERSION[^\r\n]*')).Value
          Write-Host "verify runtime target: $target"
          Write-Host "runtime version declaration: $appVersionLine"
          if(-not $appVersionLine.Contains('0.81.36')){throw "runtime APP_VERSION did not become 0.81.36: $appVersionLine"}
          $required=@(
            'function attendanceIsSchoolHoliday(day)',
            'function subjectConfidentialPasswordConfigured()',
            '선택과목 대외비 보안',
            'onclick="setSubjectConfidentialPassword()"',
            'function dashboardOfficialAttendanceLabel(',
            "dashboardOfficialAttendanceLabel(r,'공결')",
            "dashboardOfficialAttendanceLabel(r,'공지각')"
          )
          foreach($x in $required){if(-not $g.Contains($x)){throw "missing source repair: $x"}}
          if($g.Contains('UEP_08135_RUNTIME_REPAIR_START')){throw 'legacy 0.81.35 runtime repair block remains'}
          if($g.Contains("extractFunction(s,'bindEvents')")){throw 'legacy bindEvents dependency remains'}
          Write-Host 'UEP 0.81.36 source owner verification PASS'

      - name: Build 0.81.36 package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='UEP-Windows-x64-v0.81.36-source-repair.zip'
          if(Test-Path $out){Remove-Item $out -Force}
          if(-not (Test-Path 'app/UEP.exe')){throw 'UEP.exe missing before packaging'}
          Compress-Archive -Path 'app/*' -DestinationPath $out -Force
          New-Item -ItemType Directory -Force verify-package | Out-Null
          Expand-Archive -LiteralPath $out -DestinationPath verify-package -Force
          if(-not (Test-Path 'verify-package/UEP.exe')){throw 'built update zip does not contain root UEP.exe'}
          if(-not (Test-Path 'verify-package/resources/app/gyomuon.js')){throw 'built update zip does not contain runtime resources'}
          Write-Host "built $out with root UEP.exe"

      - name: Publish v0.81.36
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.81.36
          name: UEP v0.81.36
          body: |
            Source-level repair build based on shipped v0.81.35.
            - canonical holiday ownership
            - separate subject confidential password controls
            - detailed official attendance labels
            - removed legacy runtime DOM repair coupling
            - fixed Launcher V2 update package layout (root UEP.exe included)
          files: UEP-Windows-x64-v0.81.36-source-repair.zip
          make_latest: false

      - name: Promote updater fields to 0.81.36
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $asset=(Get-Item 'UEP-Windows-x64-v0.81.36-source-repair.zip')
          $hash=(Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
          $download='https://github.com/${{ github.repository }}/releases/download/v0.81.36/UEP-Windows-x64-v0.81.36-source-repair.zip'

          $policy=Get-Content 'uep-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.36'
          $policy.downloadUrl=$download
          $policy.sha256=$hash
          $policy.message='UEP 0.81.36 소스 정합성·공휴일·선택과목 보안·공결상세 및 업데이트 패키지 구조 수정'
          $policy | ConvertTo-Json -Depth 50 | Set-Content 'uep-policy.json' -Encoding UTF8

          $manifest=Get-Content 'uep-update.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $manifest.version='0.81.36'
          $manifest.downloadUrl=$download
          $manifest.sha256=$hash
          $manifest.notes='UEP 0.81.36 소스 정합성 및 Launcher V2 패키지 구조 수정'
          $manifest | ConvertTo-Json -Depth 50 | Set-Content 'uep-update.json' -Encoding UTF8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json uep-update.json
          if((git diff --cached --name-only).Count -gt 0){
            git commit -m 'release: promote updater metadata to repaired 0.81.36'
            git push
          }

      - name: Final consistency check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Invoke-RestMethod -Headers @{ 'User-Agent'='UEP-Updater' } -Uri 'https://api.github.com/repos/${{ github.repository }}/releases/tags/v0.81.36'
          $asset=$release.assets | Where-Object { $_.name -eq 'UEP-Windows-x64-v0.81.36-source-repair.zip' } | Select-Object -First 1
          if(-not $asset){throw 'published 0.81.36 asset missing'}
          $policy=Get-Content 'uep-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if([string]$policy.latestVersion -ne '0.81.36'){throw 'policy version did not promote to 0.81.36'}
          if([string]$policy.downloadUrl -notmatch 'v0\.81\.36/UEP-Windows-x64-v0\.81\.36-source-repair\.zip$'){throw 'policy download URL does not point to repaired 0.81.36 asset'}
          Write-Host "published asset: $($asset.name) size=$($asset.size)"

name: Inspect UEP 0.82.78 Auth Badge
on:
  push:
    paths: ['inspect-08278-auth-badge.trigger']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.78 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          $g=Get-Content "$root/gyomuon.js" -Raw
          $m=Get-Content "$root/electron/main.cjs" -Raw
          $terms=@('인증 필요','동기화 정상','lastGoogle','googleSync','readonlySync','connectionStatus','syncStatus','Google 연결','구글 새로고침')
          $out=@()
          foreach($spec in @(@('renderer',$g),@('main',$m))){
            foreach($term in $terms){
              $txt=$spec[1];$start=0;$n=0
              while(($i=$txt.IndexOf($term,$start)) -ge 0 -and $n -lt 6){
                $s=[Math]::Max(0,$i-1800);$len=[Math]::Min(5200,$txt.Length-$s)
                $out+="===== $($spec[0]) :: $term @ $i =====";$out+=$txt.Substring($s,$len)
                $start=$i+$term.Length;$n++
              }
            }
          }
          $out -join "`r`n" | Set-Content inspection-08278-auth-badge.txt -Encoding utf8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-08278-auth-badge.txt
          git commit -m 'Inspect UEP 0.82.78 auth badge'
          if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'pull failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'push failed'}

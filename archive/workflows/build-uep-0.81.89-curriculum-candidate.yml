name: Build UEP 0.81.89 Curriculum Candidate
on:
  push:
    branches: [main]
    paths:
      - build-uep-0.81.89-curriculum.trigger
permissions:
  contents: write
concurrency:
  group: build-uep-0.81.89-curriculum-candidate
  cancel-in-progress: false
jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.88 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force baseline,app,out,verify | Out-Null
          gh release download v0.81.88 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir baseline
          Expand-Archive baseline/UEP-update.zip app -Force
          if(!(Test-Path app/UEP.exe)){throw 'UEP.exe missing'}
      - name: Apply 0.81.89 patch
        shell: pwsh
        run: |
          node scripts/patch-uep-08189-curriculum-fast-error-filter.js app
          node scripts/patch-uep-08189-disable-legacy-release-popups.js app
          node scripts/patch-uep-08189-error-ui-fix.js app
      - name: Static verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check app/resources/app/gyomuon.js
          $pkg=Get-Content app/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.89'){throw 'package version mismatch'}
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('const APP_VERSION = "0.81.89";','UEP_08189_CURRICULUM_FAST_ERROR_FILTER_START','data-error-grade-scope-08189','2학년 오류학생','3학년 오류학생','2·3학년 오류학생','2학년 오류종류','3학년 오류종류','errorKindSummary','aria-pressed','UEP_08189_DISABLE_LEGACY_RELEASE_NOTES','UEP_08189_NATIVE_ERROR_FILTER','UEP_08189_DISABLE_08174_RELEASE_POPUP','UEP_08189_DISABLE_08177_RELEASE_POPUP')){if(!$g.Contains($m)){throw "marker missing: $m"}}
          if($g.Contains('setTimeout(releaseNotes,1200);')){throw 'legacy 0.81.73 popup still active'}
          if($g.Contains("setTimeout(()=>uepOpenReleaseNotes08174(false),1400)")){throw 'legacy 0.81.74 popup still active'}
          if($g.Contains("setTimeout(()=>uepOpenReleaseNotes08177(false),1400)")){throw 'legacy 0.81.77 popup still active'}
          if($g.Contains("render('records');return;")){throw 'grade scope still uses stale records render path'}
      - name: Pack and reopen
        shell: pwsh
        run: |
          Compress-Archive -Path app/* -DestinationPath out/UEP-update.zip -CompressionLevel Optimal
          Expand-Archive out/UEP-update.zip verify -Force
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.89'){throw 'repacked package version mismatch'}
          node --check verify/resources/app/gyomuon.js
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('2학년 오류종류','3학년 오류종류','errorKindSummary','aria-pressed','UEP_08189_DISABLE_LEGACY_RELEASE_NOTES','UEP_08189_DISABLE_08174_RELEASE_POPUP','UEP_08189_DISABLE_08177_RELEASE_POPUP')){if(!$g.Contains($m)){throw "repacked marker missing: $m"}}
          if($g.Contains('setTimeout(releaseNotes,1200);')){throw 'repacked 0.81.73 popup still active'}
          if($g.Contains("setTimeout(()=>uepOpenReleaseNotes08174(false),1400)")){throw 'repacked 0.81.74 popup still active'}
          if($g.Contains("setTimeout(()=>uepOpenReleaseNotes08177(false),1400)")){throw 'repacked 0.81.77 popup still active'}
          (Get-FileHash out/UEP-update.zip -Algorithm SHA256).Hash.ToLower() | Set-Content out/sha256.txt
      - name: Publish candidate release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.89-candidate'
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE=0
          $notes=@'
          UEP 0.81.89 교육과정 진입 · 오류학생 필터 후보판

          - 교육과정 첫 진입 속도 개선 유지
          - 기존 0.81.73 / 0.81.74 / 0.81.77 시작 변경내역 팝업 제거
          - 2학년 오류학생 / 3학년 오류학생 / 2·3학년 오류학생 버튼은 한 번 클릭하면 즉시 해당 학생만 조회
          - 선택된 오류학생 버튼은 활성색으로 명확히 표시
          - 학생목록 오류정보를 2학년 오류종류 / 3학년 오류종류 두 칼럼으로 분리하고 실제 오류명 표시
          - 0.81.89 화면에 추가됐던 오류유형 드롭다운 제거
          - 교육과정 속도개선, 반별 조회, 학생 상세, 과목별 신청현황, 0.81.88 과목카드 분석은 유지
          - 안정판 자동업데이트 메타데이터는 변경하지 않음
          '@
          $notes|Set-Content out/release-notes.md -Encoding UTF8
          gh release create $tag out/UEP-update.zip out/sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.81.89 Candidate · 교육과정 속도 · 오류학생 필터' --notes-file out/release-notes.md --prerelease

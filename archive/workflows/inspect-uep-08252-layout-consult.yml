name: Inspect UEP 0.82.52 Layout and Counseling
on:
  push:
    paths: ['inspect-08252-layout-consult.trigger']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.52 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source; if($LASTEXITCODE){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          function Snip($n,$r=9000){$i=$g.IndexOf($n);if($i -lt 0){return "NOT FOUND $n`n"};$s=[Math]::Max(0,$i-$r);$l=[Math]::Min($g.Length-$s,$r*2);return $g.Substring($s,$l)+"`n---`n"}
          $out=''; foreach($n in @('담임 상담 포인트','상담 포인트','uep-uni-middle-grid','uep-uni-course-inline','운호고 실제 입결','recommendations')){$out+=Snip $n}
          $out|Set-Content inspect.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with: {name: layout-consult-inspection, path: inspect.txt}

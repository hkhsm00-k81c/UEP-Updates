name: Inspect UEP 0.82.61 Card Renderer
on: {push: {paths: ['inspect-08261.trigger']}}
permissions: {contents: read}
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.60 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/inspect-uep-08261-card-renderer.js app/resources/app | Set-Content inspect-08261-renderer.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-08261-renderer
          path: inspect-08261-renderer.txt

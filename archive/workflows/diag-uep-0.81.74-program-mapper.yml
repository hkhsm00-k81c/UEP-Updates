name: Diagnose UEP 0.81.74 Program Mapper
'on':
  push:
    branches: [main]
    paths:
      - diag-uep-0.81.74-program-mapper.trigger
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect readonly program mapper
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force app | Out-Null
          gh release download v0.81.74 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip app -Force
          @'
          const fs=require('fs');
          const f='app/resources/app/gyomuon.js';
          const text=fs.readFileSync(f,'utf8'),lines=text.split(/\r?\n/);
          const keys=['uep08123NormalizeReadonlyCache','valueRanges','readonlyCache={','readonlyCache =','programs:','kind:"after"','kind: "after"','isCourseMaster','11_방과후학교!','12_차시일정!','afterMaster','afterSession','sheetValue','normalizeSheet','parseSheet','rangeValues','valuesByRange'];
          for(const key of keys){let n=0;console.log('\n===== '+key+' =====');lines.forEach((line,i)=>{if(line.includes(key)&&n<35){const s=Math.max(0,i-12),e=Math.min(lines.length,i+25);console.log('--- line '+(i+1)+' ---\n'+lines.slice(s,e).join('\n'));n++;}});console.log('matches='+n);}
          '@ | Set-Content diag3.js -Encoding UTF8
          node diag3.js

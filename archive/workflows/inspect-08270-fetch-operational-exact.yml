name: Inspect 08270 Fetch Operational Exact
on:
  push:
    paths:
      - 'inspect-08270-fetch-operational-exact.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.70 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $p='app/resources/app/electron/main.cjs'
          $lines=Get-Content $p
          $hit=Select-String -Path $p -Pattern 'async function fetchOperationalData' -SimpleMatch | Select-Object -First 1
          if(!$hit){throw 'not found'}
          $s=[Math]::Max(0,$hit.LineNumber-5);$e=[Math]::Min($lines.Count-1,$hit.LineNumber+45)
          $out='inspection-08270-fetch-operational-exact.txt'
          for($i=$s;$i -le $e;$i++){Add-Content $out (("{0,7}: {1}" -f ($i+1),$lines[$i]))}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $out
          git commit -m 'Inspect exact 0.82.70 operational fetch'
          if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'pull failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'push failed'}

name: Inspect UEP 0.82.42 University Display
on:
  push:
    paths: ['inspect-08242-display.trigger']
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.42/UEP-update.zip' -OutFile base.zip
          Expand-Archive base.zip app -Force
          node scripts/inspect-uep-08242-university-display.js app | Out-File university-display-inspection.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: university-display-inspection
          path: university-display-inspection.txt

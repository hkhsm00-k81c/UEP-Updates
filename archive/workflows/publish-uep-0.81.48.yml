name: Publish UEP 0.81.48 Subject Navigation Repair

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.48.trigger

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.48
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.47
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.47 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $zip=Get-ChildItem source -File -Filter '*.zip' | Select-Object -First 1
          if(!$zip){throw '0.81.47 release zip not found'}
          Expand-Archive $zip.FullName app -Force
          if(!(Test-Path 'app/UEP.exe')){throw '0.81.47 base has no root UEP.exe'}
      - name: Apply and run regression checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.48.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/google-data.cjs
          $pkg='app/resources/app/package.json'
          $p=Get-Content $pkg -Raw -Encoding UTF8 | ConvertFrom-Json
          $p.version='0.81.48'
          $p | ConvertTo-Json -Depth 50 | Set-Content $pkg -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $d=Get-Content app/resources/app/electron/google-data.cjs -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.48";',"curriculumWorkspaceMode='subjects'","render('records');},true);","sensitivePasswordModal({mode:'set',configured})",'[data-subject-confidential-password-set],[data-uep134-pin-btn]','<b>게시 중 직접공지</b>','function teacherTimetableMasterRows(teacher="")','setInterval(check,10*60*1000)')){if(!$g.Contains($x)){throw "regression marker missing: $x"}}
          foreach($x in @('"17A_교사시간표마스터":','teacherTimetableRows: rowsFrom("17A_교사시간표마스터")')){if(!$d.Contains($x)){throw "data regression marker missing: $x"}}
      - name: Build package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          if(!$g.Contains('const APP_VERSION = "0.81.48";')){throw 'packaged version mismatch'}
          if(!$g.Contains("curriculumWorkspaceMode='subjects'")){throw 'subject navigation missing'}
          if(!$g.Contains('<b>게시 중 직접공지</b>')){throw 'notice regression'}
          if(!$g.Contains("sensitivePasswordModal({mode:'set',configured})")){throw 'password regression'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.48
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.48 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete v0.81.48 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          $global:LASTEXITCODE=0
          gh release create v0.81.48 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.48 Subject Navigation Repair' --notes '비밀번호 인증 후 과목별 신청현황 화면이 실제로 열리도록 연결하고 최근 핵심 수정사항을 회귀검사합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.48/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.48';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='과목별 신청현황 인증 후 화면 전환 연결';$policy.forceUpdate=$false
          $policy | ConvertTo-Json -Depth 50 | Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.48';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='과목별 신청현황 인증 후 화면 전환 연결'} | ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8
          Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json
          git commit -m 'release: promote UEP 0.81.48 subject navigation repair'
          git push

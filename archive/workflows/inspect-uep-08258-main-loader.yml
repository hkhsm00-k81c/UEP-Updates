name: Inspect UEP 0.82.58 Main Loader
on: {push: {paths: ['inspect-08258-main.trigger']}}
permissions: {contents: write}
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop';function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.58 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download'
          Expand-Archive source/UEP-update.zip app -Force
          Run-Native {node scripts/inspect-uep-08258-main-loader.js app/resources/app} 'inspect'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main-loader-08258-inspection.txt
          git commit -m 'Record UEP 0.82.58 main loader inspection'
          git push

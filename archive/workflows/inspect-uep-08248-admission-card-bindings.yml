name: Inspect UEP 0.82.48 Admission Card Bindings
on:
  push:
    paths: ['inspect-08248-admission-bindings.trigger']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.48 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          $lines=$g -split "`n"
          $hits=for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match 'openDashboardAdmissionBasics|openDashboardAdmissionTypes|openDashboardUniversityDetail|admission.*card|대입 기초|전형 이해|오늘의 대학'){[pscustomobject]@{n=$i+1;t=$lines[$i]}}}
          $out=''; foreach($h in $hits){$s=[Math]::Max(0,$h.n-9);$e=[Math]::Min($lines.Count-1,$h.n+8);$out+="### HIT $($h.n): $($h.t)`n";for($j=$s;$j -le $e;$j++){$out+=("{0}: {1}`n" -f ($j+1),$lines[$j])}}
          $out | Set-Content inspection.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with: {name: admission-bindings-inspection, path: inspection.txt}

name: Inspect UEP 0.82.47 Admissions 58
on:
  push:
    paths:
      - 'inspect-08247-admissions58.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.47 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          $m=Get-Content app/resources/app/electron/main.cjs -Raw
          function Snip($text,$needle,$radius=2200){$i=$text.IndexOf($needle);if($i -lt 0){return "NOT FOUND: $needle`n"};$s=[Math]::Max(0,$i-$radius);$l=[Math]::Min($text.Length-$s,$radius*2);return $text.Substring($s,$l)+"`n---`n"}
          $out=''
          $out+=Snip $m "57_내신산정DB" 3500
          $out+=Snip $m "data.admissionGradeCalcs" 4500
          $out+=Snip $m "data.admissionStructures" 3500
          $out+=Snip $m "data.admissionMinimumRows" 3500
          $out+=Snip $g "function openDashboardUniversityDetail" 8000
          $out+=Snip $g "내신성적 산출방법 및 권장과목" 5500
          $out | Set-Content inspection.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: admissions58-inspection
          path: inspection.txt

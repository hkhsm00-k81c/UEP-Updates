name: Diagnose UEP 0.81.64 for 0.81.66
'on':
  push:
    branches: [main]
    paths: [diag-uep-0.81.64-next.trigger]
permissions:
  contents: write
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actual 0.81.64
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.64 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Persist helper ranges
        shell: pwsh
        run: |
          $g=Get-Content 'app/resources/app/gyomuon.js';$m=Get-Content 'app/resources/app/electron/main.cjs';$p=Get-Content 'app/resources/app/electron/preload.cjs';$out='diag-0.81.64-helpers.txt';''|Set-Content $out -Encoding UTF8
          function AddRange($title,$arr,$start,$end){Add-Content $out "===== $title $start-$end =====";for($i=$start;$i -le $end;$i++){if($i -le $arr.Count){Add-Content $out ("{0}: {1}" -f $i,$arr[$i-1])}}}
          AddRange 'GYOMUON sensitive-start' $g 860 930
          foreach($pat in @('notice:save','lunchDuty:save','userAccount:update','student:contactSave','function write','values.append','values.update','spreadsheets.values','batchUpdate','appendSheet','updateSheet','resolveGoogleWrite','credentialPath')){ $hits=Select-String -Path 'app/resources/app/electron/main.cjs' -Pattern $pat -SimpleMatch; foreach($h in $hits|Select-Object -First 5){AddRange ("MAIN "+$pat) $m ([Math]::Max(1,$h.LineNumber-15)) ([Math]::Min($m.Count,$h.LineNumber+55))}}
          AddRange 'PRELOAD all' $p 1 $p.Count
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add $out;git commit -m 'diag: save 0.81.64 write helpers';git push

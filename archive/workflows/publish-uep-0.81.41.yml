name: Publish UEP 0.81.41 School Read Account Repair

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.41.trigger

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.41
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.40
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.40 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $zip=Get-ChildItem source -File -Filter '*.zip' | Select-Object -First 1
          if(!$zip){throw '0.81.40 release zip not found'}
          Expand-Archive $zip.FullName app -Force
          if(!(Test-Path 'app/UEP.exe')){throw '0.81.40 base has no root UEP.exe'}
      - name: Apply and verify account reference repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.41.js app
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/gyomuon.js
          $pkg='app/resources/app/package.json'
          $p=Get-Content $pkg -Raw -Encoding UTF8 | ConvertFrom-Json
          $p.version='0.81.41'
          $p | ConvertTo-Json -Depth 50 | Set-Content $pkg -Encoding UTF8
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const auth = await getReadonlySheetsAuth(credentials);','account: auth.account || "",',"if(auth.mode!=='school_read_api') await ensureSelectedReportNormalization(token);")){if(!$m.Contains($x)){throw "missing main marker: $x"}}
          if($m.Contains('account: account.client_email,')){throw 'undefined account reference remains'}
          foreach($x in @('const APP_VERSION = "0.81.41";','async function ensureSchoolReadSessionForCurrentUser','function attendanceIsSchoolHoliday(day)','function subjectConfidentialPasswordConfigured()','downloadSchoolReadDiagnostics')){if(!$g.Contains($x)){throw "missing renderer marker: $x"}}
          if($p.version -ne '0.81.41'){throw 'package version mismatch'}
      - name: Build package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          $m=Get-Content verify/resources/app/electron/main.cjs -Raw -Encoding UTF8
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          if(!$m.Contains('account: auth.account || "",')){throw 'packaged account repair missing'}
          if(!$g.Contains('const APP_VERSION = "0.81.41";')){throw 'packaged version mismatch'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.41
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.41 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete v0.81.41 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          $global:LASTEXITCODE=0
          gh release create v0.81.41 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.41 School Read Account Repair' --notes '0.81.40 School Read 전환 후 남은 account 변수 참조 오류를 수정합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.41/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.41';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='담임 School Read 자료조회 account 참조 오류 수정';$policy.forceUpdate=$false
          $policy | ConvertTo-Json -Depth 50 | Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.41';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='담임 School Read 자료조회 account 참조 오류 수정'} | ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8
          Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json
          git commit -m 'release: promote UEP 0.81.41 account repair'
          git push

name: Build and Release UEP 0.82.06
on:
  push:
    branches: [main]
    paths: [release-08206.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08206-admission-dashboard.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.05 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08206-admission-dashboard.js app
          node --check app/resources/app/gyomuon.js
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          foreach($marker in @('const APP_VERSION = "0.82.06";','UEP_08206_ADMISSION_DASHBOARD_START','대입 기초','전형 이해','오늘의 대학','uep-school-work-grid08206','보고서 미제출 현황','학생상담/점검')){ if(-not $g.Contains($marker)){ throw "missing marker: $marker" } }
          $c=Get-Content app/resources/app/gyomuon.css -Raw
          foreach($marker in @('UEP_08206_ADMISSION_DASHBOARD_CSS','uep-school-work-grid08206','uep-class-grid')){ if(-not $c.Contains($marker)){ throw "missing css marker: $marker" } }
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip" | Set-Content sha256.txt -Encoding ascii
          if(gh release view v0.82.06 --repo $env:GITHUB_REPOSITORY 2>$null){ gh release delete v0.82.06 --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          $notes=@'
          UEP v0.82.06

          - 대시보드 상단 보고서 3개 카드를 대입 기초 · 전형 이해 · 오늘의 대학으로 교체
          - 구글시트 동기화 후 대시보드 재렌더링에서도 입시 카드가 다시 보고서 카드로 돌아가지 않도록 지속 반영
          - 52_대입기초, 53_전형이해, 56_대학입시마스터 연결
          - 오늘의 대학은 사용여부=Y 대학만 순환
          - 학교업무공지·마감 영역을 학년공지 · 학생상담/점검 · 보고서 미제출 현황 3패널로 재구성
          - 관리자/학년부장은 반별 미제출 인원을 보고, 담임은 자기 반 학생 미제출 목록을 바로 확인
          - 미제출 학생 클릭 시 프로그램별 미제출 보고서 상세 확인
          - 오늘의 프로그램 및 나머지 대시보드 영역은 유지
          '@
          gh release create v0.82.06 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.06' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw | ConvertFrom-Json
          $policy.latestVersion='0.82.06'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.06/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.06 입시카드 영속화 · 학년공지/학생점검/보고서 미제출 대시보드 재구성'
          $policy | ConvertTo-Json -Depth 10 | Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.06 RELEASE SUCCESS","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA") | Set-Content release-08206-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08206-status.txt
          git commit -m 'Publish UEP 0.82.06 policy and status'
          git push origin HEAD:main

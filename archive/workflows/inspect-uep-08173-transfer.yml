name: Inspect UEP 0.81.73 Transfer Student Paths
'on':
  push:
    branches: [main]
    paths:
      - inspect-uep-08173-transfer.trigger
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.73
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force app | Out-Null
          gh release download v0.81.73 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          Expand-Archive UEP-update.zip app -Force
      - name: Extract relevant runtime blocks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $d=Get-Content app/resources/app/electron/google-data.cjs -Raw -Encoding UTF8
          $out=@()
          function Grab([string]$text,[string]$needle,[int]$before=800,[int]$after=3500){
            $i=$text.IndexOf($needle)
            if($i -lt 0){return "=== NOT FOUND: $needle ===`r`n"}
            $s=[Math]::Max(0,$i-$before);$n=[Math]::Min($text.Length-$s,$before+$needle.Length+$after)
            return "=== $needle ===`r`n"+$text.Substring($s,$n)+"`r`n"
          }
          foreach($n in @('function uepActiveSelectionRows','function uepSelectionDataset','function uepSelectionTermSubjects','function recordsView','function gradesView','function scoreView','function mock','모의고사','내신','성적','readonlyCache.students','studentRecordBundle')){$out+=Grab $g $n}
          foreach($n in @('legacySelectedSubjectRows','selectedSubjectRows','selectedSubjects','subjectSelections','students:','academicStatus','학적상태','전입','전출')){$out+=Grab $d $n}
          Set-Content transfer-inspection-08173.txt ($out -join "`r`n") -Encoding UTF8
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transfer-inspection-08173.txt
          git commit -m 'diag: capture 0.81.73 transfer student paths'
          git push

name: Inspect UEP OAuth Target

on:
  push:
    paths:
      - inspect-oauth-target.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.80.72 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.80.72 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Extract OAuth integration targets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out = New-Object System.Collections.Generic.List[string]
          $files = @(
            'app/resources/app/electron/main.cjs',
            'app/resources/app/electron/preload.cjs',
            'app/resources/app/gyomuon.js'
          )
          $patterns = 'oauth|google:|Google 계정|토큰|token|client_id|redirect_uri|127\.0\.0\.1|localhost|authorization|access_denied|승인'
          foreach($file in $files){
            if(!(Test-Path $file)){ continue }
            $lines = Get-Content $file -Encoding UTF8
            $hits = Select-String -Path $file -Pattern $patterns -Encoding UTF8
            $ranges = @()
            foreach($hit in $hits){
              $from=[Math]::Max(1,$hit.LineNumber-18); $to=[Math]::Min($lines.Count,$hit.LineNumber+35)
              $ranges += ,@($from,$to)
            }
            $ranges = $ranges | Sort-Object { $_[0] }
            $merged = @()
            foreach($r in $ranges){
              if($merged.Count -eq 0 -or $r[0] -gt ($merged[-1][1]+1)){ $merged += ,@($r[0],$r[1]) }
              elseif($r[1] -gt $merged[-1][1]){ $merged[-1][1]=$r[1] }
            }
            foreach($r in $merged){
              $out.Add("===== $file lines $($r[0])-$($r[1]) =====")
              for($i=$r[0];$i -le $r[1];$i++){ $out.Add(("{0}: {1}" -f $i,$lines[$i-1])) }
            }
          }
          $out | Set-Content 'oauth-target-inspect.txt' -Encoding UTF8
      - name: Commit inspection report
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oauth-target-inspect.txt
          git commit -m 'Inspect current UEP OAuth integration targets' || echo 'no changes'
          git push

name: Publish UEP 0.81.67 Password Reset
'on':
  push:
    branches: [main]
    paths: [publish-uep-0.81.67-password-reset.trigger]
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.67-password-reset
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download actual 0.81.66
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.66 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Validate patch sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node --check scripts/patch-uep-0.81.67-password-reset.js
          node --check scripts/uep-0.81.67-password-reset-addon.js
      - name: Apply 0.81.67 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node scripts/patch-uep-0.81.67-password-reset.js app $env:GITHUB_WORKSPACE
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/preload.cjs
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.67';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
          $g=(Get-FileHash app/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();"GYOMUON_SHA256=$g"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $m=(Get-FileHash app/resources/app/electron/main.cjs -Algorithm SHA256).Hash.ToLower();"MAIN_SHA256=$m"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $pr=(Get-FileHash app/resources/app/electron/preload.cjs -Algorithm SHA256).Hash.ToLower();"PRELOAD_SHA256=$pr"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build reopen and verify exact payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          node --check verify/resources/app/gyomuon.js
          node --check verify/resources/app/electron/main.cjs
          node --check verify/resources/app/electron/preload.cjs
          $g=(Get-FileHash verify/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();if($g -ne $env:GYOMUON_SHA256){throw 'gyomuon hash mismatch'}
          $m=(Get-FileHash verify/resources/app/electron/main.cjs -Algorithm SHA256).Hash.ToLower();if($m -ne $env:MAIN_SHA256){throw 'main hash mismatch'}
          $pr=(Get-FileHash verify/resources/app/electron/preload.cjs -Algorithm SHA256).Hash.ToLower();if($pr -ne $env:PRELOAD_SHA256){throw 'preload hash mismatch'}
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json;if($pkg.version -ne '0.81.67'){throw "package version mismatch: $($pkg.version)"}
          $gy=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8;$ma=Get-Content verify/resources/app/electron/main.cjs -Raw -Encoding UTF8;$pre=Get-Content verify/resources/app/electron/preload.cjs -Raw -Encoding UTF8
          if(!$gy.Contains('__UEP_08167_PASSWORD_RESET_RUNTIME__')){throw 'reset runtime missing'}
          if(!$ma.Contains('securityConfig:reset')){throw 'reset IPC missing'}
          if(!$pre.Contains('resetSharedSecurityConfig')){throw 'reset preload bridge missing'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish only after verification passes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $exists=$false
          try { gh release view v0.81.67 --repo $env:GITHUB_REPOSITORY *> $null; $exists=$true } catch { $exists=$false }
          if($exists){gh release delete v0.81.67 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          gh release create v0.81.67 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.67 Password Reset' --notes '관리자·학년부장용 민감정보/선택과목 비밀번호 초기화 기능을 추가합니다. 초기화 시 이 PC의 기존 로컬 해시와 기본정보연결시트 00_UEP설정의 공용 해시를 함께 비우며, 이후 새 비밀번호 설정 시 SHA-256 해시가 SENSITIVE_PIN_HASH / SUBJECT_CONFIDENTIAL_PIN_HASH 키로 중앙 저장됩니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.67/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.67';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='민감정보·선택과목 공용 비밀번호 초기화';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.67';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='민감정보·선택과목 공용 비밀번호 초기화'}|ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.67 password reset';git push

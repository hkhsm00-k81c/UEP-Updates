name: Diagnose UEP 0.81.59 School Read Path
'on':
  push:
    branches: [main]
    paths: [diag-08159-schoolread.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.58 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $z=Get-ChildItem source -Filter '*.zip'|Select-Object -First 1;Expand-Archive $z.FullName app -Force
      - name: Inspect
        shell: pwsh
        run: |
          $patterns='schoolReadBatchRead|UEP_SCHOOL_READ|schoolRead|readReadonlyCache|readSheetBatch|dateTimeRenderOption|SERIAL_NUMBER'
          $files=Get-ChildItem app/resources/app -Recurse -File -Include *.js,*.cjs,*.mjs
          $out=@()
          foreach($f in $files){$lines=Get-Content $f.FullName -Encoding UTF8;for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match $patterns){$out+='===== '+$f.FullName.Substring((Resolve-Path app).Path.Length+1)+' @ '+($i+1)+' =====';$s=[Math]::Max(0,$i-16);$e=[Math]::Min($lines.Count-1,$i+22);for($j=$s;$j -le $e;$j++){$out+=('{0}: {1}' -f ($j+1),$lines[$j])}}}}
          $out|Set-Content diag-08159-schoolread.txt -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag-08159-schoolread.txt;git commit -m 'diag: inspect 0.81.59 school read date path';git push

name: Validate UEP 0.81.13 integrated recovery candidate

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/0.81.13-recovery
    paths:
      - 'scripts/build-update-0.81.13.ps1'
      - '.github/workflows/validate-uep-08113-recovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-update-0.81.13.ps1'
      - '.github/workflows/validate-uep-08113-recovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shipped 0.81.01 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force app | Out-Null
          gh release download v0.81.01 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip'
          Expand-Archive UEP-update.zip -DestinationPath app -Force
          if(-not (Test-Path 'app/resources/app/gyomuon.js')){throw 'gyomuon.js missing from shipped base'}

      - name: Reconstruct current 0.81.12 without publishing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          2..12 | ForEach-Object {
            $version='0.81.{0:d2}' -f $_
            $script="scripts/build-update-$version.ps1"
            if(Test-Path $script){ & $script }
          }

      - name: Apply 0.81.13 integrated recovery
        shell: pwsh
        run: |
          & ./scripts/build-update-0.81.13.ps1

      - name: Static architecture audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $d=Get-Content 'app/resources/app/electron/google-data.cjs' -Raw -Encoding UTF8
          $m=Get-Content 'app/resources/app/electron/main.cjs' -Raw -Encoding UTF8
          node --check 'app/resources/app/gyomuon.js'
          node --check 'app/resources/app/electron/main.cjs'
          node --check 'app/resources/app/electron/google-data.cjs'
          $checks=[ordered]@{
            'version'=$g.Contains('const APP_VERSION = "0.81.13";')
            'single 06 source'=$d.Contains('"06_선택과목이력"') -and (-not $d.Contains('06A_학생별선택과목'))
            'curriculum renderer'=$g.Contains('function uepCurriculumFinalView')
            'SDGs renderer'=$g.Contains('function uepSdgsEvidenceBridge')
            'recordcheck mount'=$g.Contains('window.uepMountRecordbookValidator') -and $g.Contains('standaloneRecordcheckMount')
            'school resolver'=$m.Contains('resolveSchoolServiceAccount')
            'no global mutation observer'=(-not $g.Contains('observer.observe(document.documentElement,{subtree:true,childList:true})'))
            'no full section post scan'=(-not $g.Contains("document.querySelectorAll('section').forEach"))
            'selection memoization'=$g.Contains('__UEP_SELECTION_CACHE_08113__')
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host ("AUDIT {0} = {1}" -f $_.Key,$_.Value)}
          if($checks.Values-contains $false){throw '0.81.13 static architecture audit failed'}

      - name: Report duplicate and delay-risk markers
        shell: pwsh
        run: |
          $g=Get-Content 'app/resources/app/gyomuon.js' -Raw -Encoding UTF8
          $patterns=[ordered]@{
            'recordsView assignment'='recordsView\s*=\s*function'
            'bindSelectionAnalysis declaration'='function\s+bindSelectionAnalysis\s*\('
            'uepSelectionDataset declaration'='function\s+uepSelectionDataset\s*\('
            'MutationObserver'='new\s+MutationObserver'
            'requestAnimationFrame'='requestAnimationFrame\s*\('
            'queueMicrotask'='queueMicrotask\s*\('
            'render records'='render\(["'']records["'']\)'
            'setTimeout'='setTimeout\s*\('
          }
          foreach($item in $patterns.GetEnumerator()){
            $count=[regex]::Matches($g,$item.Value).Count
            Write-Host ("RISK {0} = {1}" -f $item.Key,$count)
          }

      - name: Package candidate artifact only
        shell: pwsh
        run: |
          Compress-Archive -Path app/* -DestinationPath UEP-0.81.13-recovery-candidate.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.13-Recovery-Candidate
          path: UEP-0.81.13-recovery-candidate.zip

name: Build and Release UEP 0.82.47 Source Driven Admissions
on:
  push:
    paths:
      - 'release-08247.trigger'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$cmd,[string]$label){ & $cmd; if($LASTEXITCODE -ne 0){ throw "$label failed with exit code $LASTEXITCODE" } }
          gh release download v0.82.46 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'base release download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          Run-Native { node scripts/patch-uep-08247-admissions-source-driven.js app } 'patch'
          Run-Native { node --check app/resources/app/gyomuon.js } 'gyomuon syntax check'
          Run-Native { node --check app/resources/app/electron/main.cjs } 'main syntax check'
          Run-Native { node scripts/test-uep-08247-admissions-source-driven.js app } 'validation / release gate'
          if(Test-Path UEP-update.zip){Remove-Item UEP-update.zip -Force}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $hash=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  UEP-update.zip" | Set-Content sha256.txt -Encoding ascii
          if((Get-Item UEP-update.zip).Length -lt 100MB){throw 'release zip unexpectedly small'}
          $notes=@'
          UEP v0.82.47
          - 대학 전형 카드는 53B의 실제 전형 1행을 그대로 1카드로 표시하도록 변경
          - 전형명의 · 또는 / 문장부호를 보고 UEP가 임의로 전형을 분리하던 규칙 제거
          - 53B UEP노출=N 행을 오늘의 대학 카드에서 제외하여 중복 전형공통 행 정리
          - 청주대 검증 기준을 전 대학 원본대조 작업의 기준으로 적용
          - 수정사항 팝업을 공통 버전별 1회 표시 로직으로 복구
          - 수능최저 normalized/raw 데이터 모델 분리 회귀검사 포함
          '@
          gh release create v0.82.47 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.47' --notes $notes
          if($LASTEXITCODE -ne 0){throw 'gh release create failed'}
          $policy=Get-Content uep-policy.json -Raw | ConvertFrom-Json
          $policy.latestVersion='0.82.47'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.47/UEP-update.zip'
          $policy.sha256=$hash
          $policy.message='UEP 0.82.47 · 전 대학 원본대조 기준화 · 53B 1행1전형 · 수정사항 팝업 복구'
          $policy | ConvertTo-Json -Depth 10 | Set-Content uep-policy.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json
          git commit -m 'Publish UEP 0.82.47 policy'
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'git push failed'}

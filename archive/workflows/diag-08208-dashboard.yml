name: Diagnose UEP 0.82.08 Dashboard
on:
  push:
    branches: [main]
    paths: [diag-08208.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item source,app -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.08 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $patterns=@('schoolRead','previewReadonlySync','readReadonlyCache','readonlyCache','uep08123NormalizeReadonlyCache','spreadsheet','sheetName','sheetId','01_학생마스터','20_학사생마스터','학교업무공지·마감','게시 중 직접공지','자동 마감공지','dashboardReportStatusRows')
          $out=@()
          $files=Get-ChildItem app/resources/app -Recurse -File | Where-Object { $_.Extension -in '.js','.json','.html','.cjs','.mjs' }
          foreach($f in $files){
            $txt=Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
            if(-not $txt){continue}
            foreach($pat in $patterns){
              $m=[regex]::Matches($txt,[regex]::Escape($pat))
              $count=[Math]::Min($m.Count,8)
              for($i=0;$i -lt $count;$i++){
                $idx=$m[$i].Index; $start=[Math]::Max(0,$idx-1200); $len=[Math]::Min(3200,$txt.Length-$start)
                $out += "===== FILE: $($f.FullName.Replace((Resolve-Path app).Path,'app')) | PATTERN: $pat ====="
                $out += $txt.Substring($start,$len)
                $out += "`n---`n"
              }
            }
          }
          $out | Set-Content diag-08208-dashboard.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag-08208-dashboard.txt
          git commit -m 'Capture expanded UEP 0.82.08 diagnostics'
          git push origin HEAD:main

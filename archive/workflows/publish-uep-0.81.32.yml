name: Publish UEP 0.81.32 Interaction Repair

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-uep-0.81.32.yml
      - scripts/patch-uep-0.81.32.js
      - publish-uep-0.81.32.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.32
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download shipped 0.81.31
        shell: pwsh
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,out | Out-Null
          gh release download v0.81.31 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force

      - name: Apply 0.81.32 interaction repair
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.32.js app
          node --check app/resources/app/gyomuon.js

      - name: Verify exact 0.81.32 runtime markers
        shell: pwsh
        timeout-minutes: 1
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs=require('fs');
          const g=fs.readFileSync('app/resources/app/gyomuon.js','utf8');
          const required=[
            'const APP_VERSION = "0.81.32";',
            'UEP_08132_INTERACTION_REPAIR_START',
            "closest('[data-curriculum-subject]')",
            'uepOpenSubjectModal08128(key)',
            "closest('[data-record-student]')",
            "closest('[data-uep-student-prev]')",
            "closest('[data-uep-student-next]')",
            'visibleStudentIds()',
            'normalizeHolidayMode()'
          ];
          for(const x of required) if(!g.includes(x)) throw new Error('missing 0.81.32 marker: '+x);
          console.log('UEP 0.81.32 exact marker verification PASS');
          '@ | Set-Content verify-08132.js -Encoding UTF8
          node verify-08132.js

      - name: Build 0.81.32 package
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $pkg='app/resources/app/package.json'
          $j=Get-Content $pkg -Raw -Encoding UTF8 | ConvertFrom-Json
          $j.version='0.81.32'
          $j | ConvertTo-Json -Depth 50 | Set-Content $pkg -Encoding UTF8
          Compress-Archive -Path app/* -DestinationPath out/UEP-update.zip -Force
          $hash=(Get-FileHash out/UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish v0.81.32
        shell: pwsh
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.32'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){ gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          $global:LASTEXITCODE=0
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.32' --notes '선택과목 학생 좌우이동·과목카드 팝업 실제 클릭 연결 및 주간시간표 공휴시간 오선택 보정' --draft
          gh release upload $tag out/UEP-update.zip --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false

      - name: Promote updater fields to 0.81.32
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.32/UEP-update.zip'
          $notes='선택과목 학생 좌우이동·과목카드 팝업 실제 클릭 연결 및 주간시간표 공휴시간 오선택 보정'
          $manifest=@{version='0.81.32';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes=$notes} | ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8
          Set-Content uep-version.json $manifest -Encoding UTF8
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.32';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message=$notes
          if($policy.homeroomStableVersion){$policy.homeroomStableVersion='0.81.32'}
          if($policy.sharedBoardStableVersion){$policy.sharedBoardStableVersion='0.81.32'}
          $policy | ConvertTo-Json -Depth 50 | Set-Content uep-policy.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-update.json uep-version.json uep-policy.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'release: promote UEP 0.81.32 updater fields';git push}

      - name: Final release consistency check
        shell: pwsh
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force verify | Out-Null
          gh release download v0.81.32 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir verify
          $actual=(Get-FileHash verify/UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          if($actual -ne $env:UEP_SHA256){throw 'published ZIP SHA mismatch'}
          Expand-Archive verify/UEP-update.zip verify/app -Force
          $g=Get-Content verify/app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $pkg=Get-Content verify/app/resources/app/package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if(-not $g.Contains('const APP_VERSION = "0.81.32";')){throw 'published runtime is not 0.81.32'}
          if($pkg.version -ne '0.81.32'){throw 'published package is not 0.81.32'}
          if(-not $g.Contains('UEP_08132_INTERACTION_REPAIR_START')){throw 'published runtime missing 0.81.32 interaction repair'}
          Write-Host 'UEP 0.81.32 package and updater manifests are consistent.'

name: Inspect UEP Login Code

on:
  push:
    paths:
      - inspect-login.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-login:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.80.83 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.80.83
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive -LiteralPath 'source/UEP-update.zip' -DestinationPath app -Force
      - name: Save startup overlay related snippets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $out='diagnostics/login-snippets.txt'
          "UEP 0.80.83 startup/auth source snippets" | Set-Content $out -Encoding UTF8
          $files=Get-ChildItem app/resources/app -Recurse -File | Where-Object {$_.Extension -in '.js','.cjs','.html'}
          foreach($f in $files){
            $m=Select-String -Path $f.FullName -Pattern '저장된 사용자와 연결 정보를 확인하고 있습니다|자동 로그인 중|연결 정보를 확인|auto-login|autoLogin|startup|splash|restoreRememberedSessionImmediately|initializeUserSessionGate' -Context 15,30
            if($m){Add-Content $out "`n===== $($f.FullName) =====" -Encoding UTF8;$m | Select-Object -First 120 | ForEach-Object {Add-Content $out $_.ToString() -Encoding UTF8}}
          }
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/login-snippets.txt
          git commit -m 'Capture UEP 0.80.83 startup overlay source' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

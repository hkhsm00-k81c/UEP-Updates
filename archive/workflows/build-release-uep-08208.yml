name: Build and Release UEP 0.82.08
on:
  push:
    branches: [main]
    paths: [release-08208.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08208-dashboard-scope-fix.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.07 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08208-dashboard-scope-fix.js app
          node --check app/resources/app/gyomuon.js
          $g=Get-Content app/resources/app/gyomuon.js -Raw
          foreach($marker in @('const APP_VERSION = "0.82.08";','UEP_08208_DASHBOARD_SCOPE_FIX_START','대입 기초','전형 이해','오늘의 대학','학년공지','학생상담/점검','보고서 미제출 현황')){ if(-not $g.Contains($marker)){ throw "missing marker: $marker" } }
          if($g.Contains('UEP_08207_DASHBOARD_PANELS_START')){ throw 'obsolete 0.82.07 dashboard panel overlay still present' }
          $c=Get-Content app/resources/app/gyomuon.css -Raw
          if(-not $c.Contains('UEP_08208_DASHBOARD_SCOPE_FIX_CSS')){ throw 'missing 0.82.08 dashboard css marker' }
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip" | Set-Content sha256.txt -Encoding ascii
          if(gh release view v0.82.08 --repo $env:GITHUB_REPOSITORY 2>$null){ gh release delete v0.82.08 --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          $notes=@'
          UEP v0.82.08

          - v0.82.07 대시보드 상위 컨테이너 오인식 회귀 수정
          - 기존 빠른메뉴·오늘의 프로그램·주간시간표·학교 캘린더 레이아웃 보존
          - 학교업무공지·마감의 정확한 패널만 학년공지 · 학생상담/점검 · 보고서 미제출 현황으로 교체
          - 구글시트 동기화 후에도 대입 기초 · 전형 이해 · 오늘의 대학 카드 유지
          '@
          gh release create v0.82.08 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.08' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw | ConvertFrom-Json
          $policy.latestVersion='0.82.08'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.08/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.08 대시보드 범위 회귀 수정 및 입시카드 유지'
          $policy | ConvertTo-Json -Depth 10 | Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.08 RELEASE SUCCESS","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)","commit=$env:GITHUB_SHA") | Set-Content release-08208-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08208-status.txt
          git commit -m 'Publish UEP 0.82.08 policy and status'
          git push origin HEAD:main

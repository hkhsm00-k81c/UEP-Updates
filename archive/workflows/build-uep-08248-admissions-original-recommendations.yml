name: Build and Release UEP 0.82.48 Admissions Original Recommendations
on:
  push:
    paths:
      - 'release-08248.trigger'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$cmd,[string]$label){ & $cmd; if($LASTEXITCODE -ne 0){ throw "$label failed with exit code $LASTEXITCODE" } }
          New-Item -ItemType Directory -Force source,app | Out-Null
          Run-Native { gh release download v0.82.47 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source } 'base release download'
          Expand-Archive source/UEP-update.zip app -Force
          Run-Native { node scripts/patch-uep-08248-admissions-original-recommendations.js app } 'patch'
          Run-Native { node --check app/resources/app/gyomuon.js } 'gyomuon syntax check'
          Run-Native { node --check app/resources/app/electron/main.cjs } 'main syntax check'
          Run-Native { node scripts/test-uep-08248-admissions-original-recommendations.js app } 'validation / release gate'
          if(Test-Path UEP-update.zip){Remove-Item UEP-update.zip -Force}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $hash=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  UEP-update.zip" | Set-Content sha256.txt -Encoding ascii
          if((Get-Item UEP-update.zip).Length -lt 100MB){throw 'release zip unexpectedly small'}
          $notes=@'
          UEP v0.82.48
          - 청주대학교 내신 반영과목을 2028 시행계획 원문 기준으로 공통6+선택9, 예체능 공통4+선택11로 정확히 표시
          - 충북대학교 학생부교과전형 / 지역인재전형 카드 분리, 충청권(충북·세종·대전·충남) 지원조건 노출
          - 한국외국어대학교 학교장추천 / 학종 면접형 / SW인재 / 서류형 / 기회균형 / 논술 실제 전형별 카드 분리
          - 58_권장과목DB 신규 연결: 공식 권장·핵심·전공연계과목 원문만 표시, 미제시도 명시
          - 53B 1행=1카드 및 수능최저 normalized/raw 데이터모델 분리 유지
          '@
          Run-Native { gh release create v0.82.48 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.48' --notes $notes } 'gh release create'
          $policy=Get-Content uep-policy.json -Raw | ConvertFrom-Json
          $policy.latestVersion='0.82.48'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.48/UEP-update.zip'
          $policy.sha256=$hash
          $policy.message='UEP 0.82.48 · 충북대/외대 전형 분리 · 청주대 원문 반영 · 권장과목DB 연결'
          $policy | ConvertTo-Json -Depth 10 | Set-Content uep-policy.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json
          git commit -m 'Publish UEP 0.82.48 policy'
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'git push failed'}

name: Inspect UEP 0.82.46 Release Notes
on:
  push:
    paths:
      - 'inspect-08246-release-notes.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v0.82.46 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/inspect-uep-08246-release-notes.js app
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes-inspection
          path: release-notes-inspection.txt

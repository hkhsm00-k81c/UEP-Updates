name: Diagnose 08162 Attendance
'on':
  push:
    branches: [main]
    paths: [diag-08162-attendance.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.62 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $z=Get-ChildItem source -Filter '*.zip'|Select-Object -First 1;Expand-Archive $z.FullName app -Force
          node scripts/diag-uep-0.81.62-attendance.js app
      - shell: pwsh
        run: |
          git config user.name 'UEP Diagnostics';git config user.email 'actions@github.com';git add diag-08162-attendance.txt;git commit -m 'diag: capture 08162 attendance parse' || exit 0;git push

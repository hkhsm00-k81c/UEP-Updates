name: Inspect UEP 0.82.59 School Read
on: {push: {paths: ['inspect-08259-schoolread.trigger']}}
permissions: {contents: write}
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.59 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/inspect-uep-08259-schoolread.js app/resources/app | Set-Content inspect-08259-schoolread.txt -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'inspect failed'}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspect-08259-schoolread.txt
          git commit -m 'Capture UEP 0.82.59 school-read path'
          if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'push failed'}

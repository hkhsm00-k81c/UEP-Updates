name: Patch UEP PC 0.83.03 Board bundle
on:
  push:
    branches: [main]
    paths: [patch-08303-board-bundle.trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Pull latest
        run: git pull --rebase origin main
      - name: Download base release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          rm -rf /tmp/u /tmp/out && mkdir -p /tmp/u /tmp/out
          gh release download v0.83.02 -R "$GITHUB_REPOSITORY" -p UEP-update.zip -D /tmp/u
          unzip -q /tmp/u/UEP-update.zip -d /tmp/u/app
      - name: Patch Board list source flow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/u/app/resources/app/electron/main.cjs')
          s=p.read_text(encoding='utf-8')
          a=s.find('async function boardDbStatus08301(ui={})')
          if a<0: raise SystemExit('boardDbStatus08301 missing')
          b=s.find('\nasync function ',a+10)
          if b<0: b=len(s)
          chunk=s[a:b]
          chunk2,n=re.subn(r'const\s+h\s*=\s*rows\[0\]\s*,\s*boards\s*=',"const h=rows[0].map(v=>String(v||'').trim()),boards=",chunk,count=1)
          if n==0 and "rows[0].map(v=>String(v||'').trim())" not in chunk:
              raise SystemExit('Board header anchor missing')
          s=s[:a]+chunk2+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify PC regressions
        run: |
          set -euo pipefail
          ROOT=/tmp/u/app/resources/app
          node --check "$ROOT/gyomuon.js"
          node --check "$ROOT/electron/main.cjs"
          python3 - <<'PY'
          from pathlib import Path
          m=Path('/tmp/u/app/resources/app/electron/main.cjs').read_text(encoding='utf-8')
          a=m.find('async function boardDbStatus08301(ui={})')
          b=m.find('\nasync function ',a+10)
          block=m[a:b if b>0 else None]
          assert "rows[0].map(v=>String(v||'').trim())" in block
          for k in ['boardDbDetail','SPECIAL_ROOM']:
              assert k in m,k
          g=Path('/tmp/u/app/resources/app/gyomuon.js').read_text(encoding='utf-8')
          for k in ['boardDbStatus','board-summary-card-08294','SPECIAL_ROOM']:
              assert k in g,k
          PY
      - name: Build candidate
        run: |
          set -euo pipefail
          cd /tmp/u/app
          zip -qr /tmp/out/UEP-update-0.83.03-board-control-candidate.zip .
          sha256sum /tmp/out/UEP-update-0.83.03-board-control-candidate.zip | tee /tmp/out/UEP-update-0.83.03-board-control-candidate.sha256
          cat >/tmp/out/STATUS.txt <<'EOF'
          UEP PC Board control candidate
          - Board master header normalization in Electron backend
          - Existing SPECIAL_ROOM/detail/notice/schedule paths preserved
          - Candidate only; release/version metadata intentionally unchanged pending field validation
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.83.03-board-control-candidate-r2
          path: /tmp/out/*
          retention-days: 7

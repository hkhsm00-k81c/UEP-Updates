name: Diagnose UEP 0.81.64 Urgent Notice
'on':
  push:
    branches: [main]
    paths: [diag-uep-0.81.64-urgent-notice.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.81.64 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - shell: pwsh
        run: node scripts/diag-uep-0.81.64-urgent-notice.js app
      - shell: pwsh
        run: |
          git config user.name 'UEP Diagnostics';git config user.email 'actions@github.com'
          git add diag-08164-urgent-notice.txt;git commit -m 'diag: capture 0.81.64 urgent notice paths' || exit 0;git push

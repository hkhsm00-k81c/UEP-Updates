name: Build and Release UEP 0.82.68 Night Session Label
on:
  push:
    paths:
      - 'release-08268.trigger'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.67 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download'
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          Run-Native {node scripts/patch-uep-08268-night-session-label.js $root} '0.82.68 patch'
          Run-Native {node --check "$root/gyomuon.js"} 'renderer syntax'
          Run-Native {node --check "$root/electron/google-data.cjs"} 'google-data syntax'
          Run-Native {node --check "$root/electron/main.cjs"} 'main syntax'
          Run-Native {node scripts/test-uep-08268-night-session-label.js $root} 'regression test'
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip"|Set-Content sha256.txt
          Run-Native {gh release create v0.82.68 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.68' --notes "UEP v0.82.68`n- 야간시간표의 방과후·야간심화 실제 수업을 삭제/병합하지 않고 각 차시로 명확히 표시`n- 카드에 실제 차시번호 표시(예: 야간심화 15차시, 16차시)`n- 카드 클릭 상세에도 차시 정보 추가`n- 12_차시일정 원본과 자습·야자 출결 집계는 변경하지 않음`n- 과거 버전 수정사항 팝업은 해당 버전에서만 동작하도록 버전 게이트 강화"} 'release'
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.68'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.68/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.68 · 야간시간표 실제 차시 표시 및 수정사항 팝업 버전 고정'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          Run-Native {git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json;git commit -m 'Publish UEP 0.82.68 policy';git pull --rebase origin main;git push} 'policy push'

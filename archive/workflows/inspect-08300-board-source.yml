name: Inspect 0.83.00 Board source
on:
  push:
    branches:
      - work/uep-08301-board-targeting
    paths:
      - inspect-08300-board-source.trigger
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.83.00 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/pkg out
          gh release download v0.83.00 -R hkhsm00-k81c/UEP-Updates -p 'UEP-update.zip' -D /tmp/u
          unzip -q /tmp/u/UEP-update.zip -d /tmp/u/pkg
      - name: Collect Board source
        run: |
          set -euo pipefail
          cp /tmp/u/pkg/resources/app/gyomuon.js out/gyomuon.js
          cp /tmp/u/pkg/resources/app/electron/main.cjs out/main.cjs
          cp /tmp/u/pkg/resources/app/package.json out/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: uep-08300-board-source
          path: out
          retention-days: 2

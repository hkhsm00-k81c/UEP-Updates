name: Audit UEP 0.83.01 version and update popup
on:
  push:
    branches: [main]
    paths:
      - audit-08301-version-popup.trigger
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current 0.83.01 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/uep08301
          mkdir -p /tmp/uep08301
          gh release download v0.83.01 -R "$GITHUB_REPOSITORY" -p 'UEP-update.zip' -D /tmp/uep08301
          unzip -q /tmp/uep08301/UEP-update.zip -d /tmp/uep08301/app
      - name: Audit packaged version and updater hooks
        run: |
          set -euo pipefail
          ROOT=/tmp/uep08301/app/resources/app
          echo '=== PACKAGE VERSION ==='
          node -p "require('$ROOT/package.json').version"
          echo '=== VERSION STRINGS ==='
          grep -nE "0\.83\.(00|01)|APP_VERSION|appVersion|getVersion|버전" "$ROOT/gyomuon.js" "$ROOT/electron/main.cjs" "$ROOT/electron/preload.cjs" 2>/dev/null | head -n 350 || true
          echo '=== UPDATE / POPUP STRINGS ==='
          grep -nEi "checkUpdate|applyUpdate|latestVersion|업데이트|release-notes|새 버전|최신 버전" "$ROOT/gyomuon.js" "$ROOT/electron/main.cjs" "$ROOT/electron/preload.cjs" 2>/dev/null | head -n 500 || true
          echo '=== BOARD MENU STRINGS ==='
          grep -nEi "Board|전자칠판|앱버전|boardDbStatus|boardTargets|specialRoom|특별실" "$ROOT/gyomuon.js" "$ROOT/electron/main.cjs" 2>/dev/null | head -n 500 || true

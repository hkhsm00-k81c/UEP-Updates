name: Patch UEP 0.83.03 Board control
on:
  push:
    branches: [main]
    paths:
      - patch-08303-board-control.trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.83.02 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/u && mkdir -p /tmp/u
          gh release download v0.83.02 -R "$GITHUB_REPOSITORY" -p UEP-update.zip -D /tmp/u
          unzip -q /tmp/u/UEP-update.zip -d /tmp/u/app
      - name: Patch Board status source of truth
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/u/app/resources/app/electron/main.cjs')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function boardDbStatus08301(ui={})')
          if start < 0: raise SystemExit('boardDbStatus08301 function not found')
          end=s.find('async function ', start+10)
          if end < 0: end=len(s)
          block=s[start:end]
          pattern=r"const\s+h\s*=\s*rows\[0\]\s*,\s*boards\s*="
          if not re.search(pattern, block):
              raise SystemExit('boardDbStatus08301 header mapping anchor not found')
          patched,count=re.subn(pattern,"const h=rows[0].map(v=>String(v||'').trim()),boards=",block,count=1)
          if count != 1: raise SystemExit(f'unexpected patch count: {count}')
          s=s[:start]+patched+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify syntax and Board regressions
        run: |
          set -euo pipefail
          ROOT=/tmp/u/app/resources/app
          node --check "$ROOT/electron/main.cjs"
          node --check "$ROOT/gyomuon.js"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/u/app/resources/app/electron/main.cjs').read_text(encoding='utf-8')
          a=s.find('async function boardDbStatus08301(ui={})')
          b=s.find('async function ',a+10)
          block=s[a:b if b>0 else None]
          assert "rows[0].map(v=>String(v||'').trim())" in block
          for key in ['SPECIAL_ROOM','boardDbDetail','boardDbStatus']:
              assert key in s,key
          g=Path('/tmp/u/app/resources/app/gyomuon.js').read_text(encoding='utf-8')
          for key in ['boardDbStatus','board-summary-card-08294','SPECIAL_ROOM']:
              assert key in g,key
          PY
      - name: Build candidate and manifest
        run: |
          set -euo pipefail
          cd /tmp/u/app
          zip -qr "$GITHUB_WORKSPACE/UEP-update-0.83.03-candidate.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum UEP-update-0.83.03-candidate.zip > UEP-update-0.83.03-candidate.sha256
          mkdir -p audit/08302-board
          cat > audit/08302-board/08303-board-fix-report.txt <<EOF
          UEP 0.83.03 Board control candidate
          Base: v0.83.02 release asset
          Fix: normalize 01_Board마스터 header names before Board status object mapping
          Scope: Board status/list source flow only; no post-render DOM patch
          Preserved: SPECIAL_ROOM detail/mode/notice/schedule logic and existing 0.83.02 package version metadata
          Verification: node --check main.cjs + gyomuon.js; Board status/detail/SPECIAL_ROOM renderer anchors present
          Status: candidate artifact only; no Release created
          EOF
      - name: Commit report only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add audit/08302-board/08303-board-fix-report.txt
          git diff --cached --quiet || (git commit -m 'fix: prepare 0.83.03 Board list normalization candidate' && git push)
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: UEP-0.83.03-board-control-candidate
          path: |
            UEP-update-0.83.03-candidate.zip
            UEP-update-0.83.03-candidate.sha256
          retention-days: 7

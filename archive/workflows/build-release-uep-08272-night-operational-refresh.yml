name: Build Release UEP 0.82.72 Night Operational Refresh
on:
  push:
    paths:
      - 'release-08272-night-operational-refresh.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $prev='v0.82.71'
          $next='v0.82.72'
          $ver='0.82.72'
          New-Item -ItemType Directory -Force source,app,out | Out-Null
          gh release download $prev --repo $repo --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw "download failed: $LASTEXITCODE"}
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'

          node scripts/patch-uep-08272-night-operational-refresh.js $root
          if($LASTEXITCODE -ne 0){throw "patch failed: $LASTEXITCODE"}

          node --check "$root/electron/main.cjs"
          if($LASTEXITCODE -ne 0){throw 'main.cjs syntax failed'}
          node --check "$root/electron/google-data.cjs"
          if($LASTEXITCODE -ne 0){throw 'google-data.cjs syntax failed'}
          node --check "$root/gyomuon.js"
          if($LASTEXITCODE -ne 0){throw 'gyomuon.js syntax failed'}

          node scripts/test-uep-08272-night-operational-refresh.js $root
          if($LASTEXITCODE -ne 0){throw "regression failed: $LASTEXITCODE"}

          Compress-Archive -Path app/* -DestinationPath out/UEP-update.zip -CompressionLevel Optimal
          $hash=(Get-FileHash out/UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  UEP-update.zip" | Set-Content out/sha256.txt -Encoding ascii

          $notes=@(
            'UEP v0.82.72',
            '- School Read API가 허용하지 않는 30_야자출결_정규화 열린 범위(A:U)를 bounded A1:U70000으로 수정',
            '- 운영 갱신에서 최신 NFC·교사확인·사후보정 출석을 즉시 교체',
            '- 전체 동기화에서 생성된 방과후·야간심화 프로그램 인정 행은 유지하여 기존 오후자습/야자 통계 보존',
            '- 동일 학생·날짜·시간대는 기존 전체 파서와 동일하게 프로그램 인정 우선',
            '- 9/7 회귀 모델 92 / 39 / 26 검증',
            '- MutationObserver·전역 클릭·렌더 후 DOM 교체 추가 없음'
          ) -join "`n"
          Set-Content out/release-notes.txt $notes -Encoding utf8

          gh release create $next out/UEP-update.zip out/sha256.txt --repo $repo --title "UEP v0.82.72" --notes-file out/release-notes.txt
          if($LASTEXITCODE -ne 0){throw "release create failed: $LASTEXITCODE"}

          $policyPath='uep-policy.json'
          $policy=Get-Content $policyPath -Raw | ConvertFrom-Json
          $policy.latestVersion=$ver
          $policy.downloadUrl="https://github.com/$repo/releases/download/$next/UEP-update.zip"
          $policy.sha256=$hash
          $policy.message='UEP 0.82.72 · 야자출결 운영동기화 범위·프로그램인정 보정'
          $policy | ConvertTo-Json -Depth 20 | Set-Content $policyPath -Encoding utf8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $policyPath
          git commit -m 'Publish UEP 0.82.72 policy'
          if($LASTEXITCODE -ne 0){throw "policy commit failed: $LASTEXITCODE"}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw "policy pull failed: $LASTEXITCODE"}
          git push
          if($LASTEXITCODE -ne 0){throw "policy push failed: $LASTEXITCODE"}

name: Build UEP 0.81.72 Performance Candidate R7
'on':
  push:
    branches: [main]
    paths:
      - build-uep-0.81.72-performance-candidate-r7.trigger
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.71
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app,out|Out-Null
          gh release download v0.81.71 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Apply 0.81.72 scripts through R7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('scripts/patch-uep-08172-structure.js','scripts/patch-uep-08172-operational-writes.js','scripts/patch-uep-08172-refresh-policy.js','scripts/patch-uep-08172-input-contact.js','scripts/patch-uep-08172-program-write-r6.js','scripts/patch-uep-08172-render-r7.js')){node $script;if($LASTEXITCODE -ne 0){throw "patch failed: $script"}}
      - name: Hard syntax checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';foreach($f in @('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs')){node --check $f;if($LASTEXITCODE -ne 0){throw "syntax failed: $f"}}
      - name: R7 regression checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8;$m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          foreach($bad in @('UEP_APPROVAL_POPUP_FIX_08066','UEP_APPROVAL_POPUP_FIX_08067','UEP_08134_CURRICULUM_SECURITY_START','setInterval(tick,2000)','setInterval(syncSchoolReadAuthBadge,5000)')){if($g.Contains($bad)){throw "legacy observer/poller remains: $bad"}}
          foreach($good in @('UEP_APPROVAL_POPUP_FIX_08068','OPERATIONAL_RENDER_PAGES08172','operationalPageNeedsRender08172','refreshOperationalCacheSilently','applyProgramWritePatch08172','refreshInputCenterSourceSilently')){if(-not $g.Contains($good)){throw "R7 marker missing: $good"}}
          if($g.Contains('if(rerender&&state.activePage)render(state.activePage);')){throw 'unconditional operational rerender remains'}
          if(-not $g.Contains("new Set(['dashboard','attendance','students','alerts','work','duties','settings'])")){throw 'operational page set mismatch'}
          foreach($fn in @('saveOfficialAttendance','deleteOfficialAttendance','saveLateAttendance','deleteLateAttendance','saveDormOuting','saveNightSupervisor','saveLunchDuty','saveStudentContact','saveProgramOperation')){$start=$m.IndexOf("async function $fn");if($start -lt 0){throw "missing $fn"};$next=$m.IndexOf('async function ',$start+20);if($next -lt 0){$next=$m.Length};$block=$m.Substring($start,$next-$start);if($block -match 'fetchLiveData\(\{\s*force\s*:\s*true'){throw "$fn full-refresh regression"}}
      - name: Ensure intentional full-sync contracts remain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8;$m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          if(-not $m.Contains('ipcMain.handle("google:previewReadonlySync"')){throw 'manual/full sync bridge missing'}
          $idx=$g.IndexOf('normalizeInputBatch');if($idx -lt 0){throw 'normalize path missing'};$block=$g.Substring($idx,[Math]::Min(2800,$g.Length-$idx));if(-not $block.Contains('refreshReadonlyCacheSilently({force:true,rerender:false})')){throw 'normalize full refresh removed prematurely'}
      - name: Package and archive revalidation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Compress-Archive -Path app/* -DestinationPath out/UEP-update-0.81.72-candidate-r7.zip -CompressionLevel Optimal;New-Item -ItemType Directory -Force verify|Out-Null;Expand-Archive out/UEP-update-0.81.72-candidate-r7.zip verify -Force
          foreach($f in @('verify/resources/app/gyomuon.js','verify/resources/app/electron/main.cjs','verify/resources/app/electron/preload.cjs')){node --check $f;if($LASTEXITCODE -ne 0){throw "archive syntax failed: $f"}}
          $sha=(Get-FileHash out/UEP-update-0.81.72-candidate-r7.zip -Algorithm SHA256).Hash.ToLower();@("candidate=0.81.72-r7","base=0.81.71-stable","sha256=$sha","network=domain-partial","program-contact=record-patch","approval-observers=08068-only","operational-render=page-scoped","normalize=full-intentional","release=no")|Set-Content out/UEP-0.81.72-candidate-r7-report.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: UEP-0.81.72-performance-candidate-r7
          path: out/*
          retention-days: 7

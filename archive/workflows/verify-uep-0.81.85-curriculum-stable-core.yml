name: Verify UEP 0.81.85 Curriculum Stable Core
on:
  push:
    branches:
      - build/0.81.85-curriculum-stable-core
    paths:
      - verify-uep-0.81.85.trigger
      - scripts/patch-uep-08185-curriculum-stable-core.js
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.84 stable baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.84 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          if(!(Test-Path app/UEP.exe)){throw '0.81.84 baseline UEP.exe missing'}
      - name: Apply 0.81.85 stable core
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08185-curriculum-stable-core.js
          node scripts/patch-uep-08185-curriculum-stable-core.js app
          node --check app/resources/app/gyomuon.js
          $pkg=Get-Content app/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.85'){throw 'package version mismatch'}
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('const APP_VERSION = "0.81.85";','UEP_08185_CURRICULUM_STABLE_CORE_START','data-error-grade-scope-08185','uep-roster-08185','refreshRosterUntilStable')){if(!$g.Contains($m)){throw "marker missing: $m"}}
          if($g.Contains('UEP_08184_CURRICULUM_CONSOLIDATION_START')){throw '0.81.84 runtime patch still present'}
          foreach($keep in @('function uepSelectionErrors08129','문이과 교차오류','과학과목 위계오류','과목별 신청현황')){if(!$g.Contains($keep)){throw "baseline feature missing: $keep"}}
      - name: Package reopen verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path app/* -DestinationPath UEP-update-test.zip -CompressionLevel Optimal
          Expand-Archive UEP-update-test.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.85'){throw 'reopened package version mismatch'}
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          if(!$g.Contains('UEP_08185_CURRICULUM_STABLE_CORE_END')){throw 'reopened package marker missing'}
          Write-Host 'UEP 0.81.85 verification PASS'

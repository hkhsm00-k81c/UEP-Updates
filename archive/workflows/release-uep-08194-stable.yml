name: Release UEP 0.81.94 Stable

on:
  push:
    branches: [main]
    paths:
      - release-uep-08194.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official 0.81.88 baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/uep08194 /tmp/UEP-update.zip /tmp/base-download
          mkdir -p /tmp/uep08194 /tmp/base-download
          gh release download v0.81.88 --repo "$GITHUB_REPOSITORY" --pattern 'UEP-update.zip' --dir /tmp/base-download
          unzip -q /tmp/base-download/UEP-update.zip -d /tmp/uep08194
          APP_PKG="$(find /tmp/uep08194 -path '*/resources/app/package.json' -print -quit)"
          test -n "$APP_PKG"
          APP_ROOT="$(dirname "$(dirname "$(dirname "$APP_PKG")")")"
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "Baseline root: $APP_ROOT"

      - name: Apply 0.81.90 clean curriculum patch
        run: node scripts/patch-uep-08190-curriculum-native-clean.js "$APP_ROOT"

      - name: Apply 0.81.91 native term patch
        run: node scripts/patch-uep-08191-cancelled-course-and-term-tabs.js "$APP_ROOT"

      - name: Apply 0.81.94 official sheet-first patch
        run: node scripts/patch-uep-08194-sheet-first-official.js "$APP_ROOT"

      - name: Verify official package
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.APP_ROOT;
          const read=p=>fs.readFileSync(path.join(root,'resources','app',p),'utf8');
          const g=read('gyomuon.js');
          const gd=read(path.join('electron','google-data.cjs'));
          const main=read(path.join('electron','main.cjs'));
          const pkg=JSON.parse(read('package.json'));
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          ok(pkg.version==='0.81.94','package version mismatch');
          ok(g.includes('const APP_VERSION = "0.81.94";'),'APP_VERSION mismatch');
          ok(g.includes('UEP_08194_SELECTION_ERROR_SOURCE_START'),'51 sheet-first runtime missing');
          ok(g.includes("b.getAttribute('data-error-grade-scope-08190')||'all'"),'grade filter final binder missing');
          ok(g.includes('UEP_08194_TERM_BINDER'),'term binder final marker missing');
          ok(!g.includes('UEP_08191_CANCELLED_COURSE_ERROR_START'),'hardcoded cancellation block survived');
          ok(gd.includes("\"41_선택과목규칙\": \"'41_선택과목규칙'!A1:Z1000\""),'41 A:Z range missing');
          ok(gd.includes('selectionErrorRows: rowsFrom("51_선택과목오류_정규화")'),'51 return payload missing');
          ok(main.includes('["51_선택과목오류_정규화", "\'51_선택과목오류_정규화\'!A1:V5000"]'),'51 processing range missing');
          console.log('UEP 0.81.94 static verification passed');
          NODE

      - name: Build update ZIP and checksum
        run: |
          set -euo pipefail
          (cd "$APP_ROOT" && zip -qr /tmp/UEP-update.zip .)
          SHA256="$(sha256sum /tmp/UEP-update.zip | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "$SHA256  UEP-update.zip" | tee /tmp/UEP-update.sha256
          ls -lh /tmp/UEP-update.zip

      - name: Publish v0.81.94 stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.81.94 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.81.94 already exists; refusing to overwrite an official release.' >&2
            exit 1
          fi
          gh release create v0.81.94 /tmp/UEP-update.zip /tmp/UEP-update.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'UEP v0.81.94' \
            --notes $'UEP v0.81.94 정식 안정판\n\n- 선택과목 오류 판정을 데이터처리 51_선택과목오류_정규화 결과 우선 구조로 전환\n- 규칙로그 41_선택과목규칙 참조 범위를 A:Z로 확장\n- 학년별 오류학생 필터 및 과목별 학기 전환 안정화\n- 0.81.91 임시 하드코딩 폐강과목 판정 제거\n\n※ 폐강확정 버튼의 41 시트 저장 기능은 이번 정식판 범위에 포함하지 않습니다.'

      - name: Update stable policy to 0.81.94
        env:
          RELEASE_SHA256: ${{ env.SHA256 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file='uep-policy.json';
          const p=JSON.parse(fs.readFileSync(file,'utf8'));
          const version='0.81.94';
          const sha=process.env.RELEASE_SHA256;
          if(!/^[a-f0-9]{64}$/.test(sha||''))throw new Error('invalid release sha256');
          p.latestStableVersion=version;
          p.recommendedMinimumVersion=version;
          p.archiveBeforeVersion=version;
          p.defaultChannel='stable';
          p.installPackage={
            type:'zip-folder-replacement',
            url:`https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v${version}/UEP-update.zip`,
            sha256:sha,
            releasePageUrl:`https://github.com/hkhsm00-k81c/UEP-Updates/releases/tag/v${version}`
          };
          p.messages=[{
            id:'archive-pre-08194',
            severity:'warning',
            title:'공식 안정판 갱신 안내',
            message:'0.81.94 이전 버전은 공식 배포 기준에서 제외되었습니다. 선택과목 오류 정규화 연동이 반영된 0.81.94 이상으로 업데이트해 주세요.',
            minVersionInclusive:p.allowAutoUpdateFromVersion||'0.81.82',
            maxVersionExclusive:version,
            dismissible:false,
            showUntil:''
          }];
          fs.writeFileSync(file,JSON.stringify(p,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json
          git commit -m 'Promote UEP 0.81.94 to stable policy'
          git push origin HEAD:main

      - name: Final release verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v0.81.94 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets
          grep -q '"latestStableVersion": "0.81.94"' uep-policy.json
          grep -q "${SHA256}" uep-policy.json
          echo "UEP v0.81.94 official deployment complete: ${SHA256}"

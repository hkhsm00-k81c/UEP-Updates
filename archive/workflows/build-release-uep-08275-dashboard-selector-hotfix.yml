name: Build and Release UEP 0.82.75 Dashboard Selector Hotfix
on:
  push:
    paths: ['release-08275.trigger']
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.74 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download 0.82.74'
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          Run-Native {node scripts/patch-uep-08275-dashboard-admission-selector.js $root} '08275 patch'
          Run-Native {node --check "$root/gyomuon.js"} 'gyomuon syntax'
          Run-Native {node --check "$root/electron/google-data.cjs"} 'google-data syntax'
          Run-Native {node --check "$root/electron/main.cjs"} 'main syntax'
          Run-Native {node scripts/test-uep-08275-dashboard-admission-selector.js $root} '08275 regression'
          $pkg=Get-Content "$root/package.json" -Raw|ConvertFrom-Json
          if([string]$pkg.version -ne '0.82.75'){throw "package version mismatch: $($pkg.version)"}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip"|Set-Content sha256.txt
          Run-Native {gh release create v0.82.75 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.75' --notes "UEP v0.82.75`n- v0.82.74 대시보드 전체 렌더 실패 원인인 단일요소 선택자 `$` + forEach 조합을 다중요소 선택자 `$$`로 원래 구조에서 수정`n- 오늘의 대학 5개 핵심배지·내신·수능최저·권장과목 카드 UI 유지`n- v0.82.74 입시 단계 우선 로드·공유 동기화·전용 입시DB 경로 유지`n- MutationObserver·전역 클릭 우회·렌더 후 DOM 교체·setTimeout DOM 보정 추가 없음"} 'release'
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.75'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.75/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.75 · 대시보드 입시카드 selector 회귀 복구'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          Run-Native {git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json;git commit -m 'Publish UEP 0.82.75 policy';git pull --rebase origin main;git push} 'policy push'

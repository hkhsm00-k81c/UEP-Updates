name: Inspect UEP 0.82.69 Operational Sync
on:
  push:
    paths:
      - 'inspect-operational-sync-08269.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.69 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw "download failed"}
          Expand-Archive source/UEP-update.zip app -Force
          $out='inspection-operational-sync-08269.txt'
          "OPERATIONAL SYNC INSPECTION" | Set-Content $out -Encoding utf8
          foreach($file in @('app/resources/app/electron/main.cjs','app/resources/app/electron/google-data.cjs','app/resources/app/gyomuon.js')){
            Add-Content $out "`n===== $file ====="
            $lines=Get-Content $file
            foreach($p in @('previewOperationalSync','READONLY_AUTO_REFRESH_MS','READONLY_FULL_REFRESH_MAX_AGE_MS','operationalSyncedAt','nightAttendance')){
              Add-Content $out "`n--- $p ---"
              $hits=Select-String -Path $file -Pattern $p -SimpleMatch
              foreach($h in $hits){$s=[Math]::Max(0,$h.LineNumber-1-18);$e=[Math]::Min($lines.Count-1,$h.LineNumber-1+45);Add-Content $out "[line $($h.LineNumber)]";for($i=$s;$i -le $e;$i++){Add-Content $out (("{0,7}: {1}" -f ($i+1),$lines[$i]))}}
            }
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $out
          git commit -m 'Inspect v0.82.69 operational sync coverage'
          if($LASTEXITCODE -ne 0){throw "commit failed"}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw "pull failed"}
          git push
          if($LASTEXITCODE -ne 0){throw "push failed"}

name: Audit UEP 0.82.90 Board Write Auth
on:
  push:
    paths:
      - 'audit-08290-board-write-auth.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.82.90 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force .work | Out-Null
          gh release download v0.82.90 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir .work
          if($LASTEXITCODE -ne 0){throw 'v0.82.90 baseline download failed'}
          Expand-Archive -Path .work/UEP-update.zip -DestinationPath .work/pkg -Force
      - name: Inspect auth and IPC paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/audit-uep-08290-board-write-auth.js .work/pkg/resources/app > audit/uep-08290-board-write-auth.txt
          if($LASTEXITCODE -ne 0){throw 'auth audit failed'}
          node scripts/audit-uep-08290-school-read-main-focus.js .work/pkg/resources/app > audit/uep-08290-school-read-main-focus.txt
          if($LASTEXITCODE -ne 0){throw 'focused auth audit failed'}
      - name: Commit audit report
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/uep-08290-board-write-auth.txt audit/uep-08290-school-read-main-focus.txt
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){exit 0}
          git commit -m "audit: record 0.82.90 Board write auth paths"
          git push

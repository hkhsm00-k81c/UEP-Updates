name: Validate UEP 0.82.68 night session label
on:
  push:
    paths:
      - 'validate-08268.trigger'
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v0.82.67 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive UEP-update.zip app -Force
          $root='app/resources/app'
          node scripts/patch-uep-08268-night-session-label.js $root
          if($LASTEXITCODE -ne 0){throw 'patch failed'}
          node --check "$root/gyomuon.js"
          if($LASTEXITCODE -ne 0){throw 'renderer syntax failed'}
          node --check "$root/electron/google-data.cjs"
          if($LASTEXITCODE -ne 0){throw 'google-data syntax failed'}
          node --check "$root/electron/main.cjs"
          if($LASTEXITCODE -ne 0){throw 'main syntax failed'}
          node scripts/test-uep-08268-night-session-label.js $root
          if($LASTEXITCODE -ne 0){throw 'regression failed'}

name: Build and Release UEP 0.82.70 Night Attendance Live Refresh
on:
  push:
    paths:
      - 'release-08270.trigger'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.69 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download 0.82.69'
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          Run-Native {node scripts/patch-uep-08270-night-attendance-live-refresh.js $root} '0.82.70 night attendance patch'
          Run-Native {node --check "$root/gyomuon.js"} 'renderer syntax'
          Run-Native {node --check "$root/electron/google-data.cjs"} 'google-data syntax'
          Run-Native {node --check "$root/electron/main.cjs"} 'main syntax'
          Run-Native {node scripts/test-uep-08270-night-attendance-live-refresh.js $root} 'night attendance regression'
          $pkg=Get-Content "$root/package.json" -Raw|ConvertFrom-Json
          if([string]$pkg.version -ne '0.82.70'){throw "package version mismatch: $($pkg.version)"}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip"|Set-Content sha256.txt
          Run-Native {gh release create v0.82.70 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.70' --notes "UEP v0.82.70`n- 실행 중 운영데이터 동기화에 30_야자출결_정규화 연결`n- NFC·교사확인·사후 출석인정이 정규화된 뒤 UEP 야자 참여현황에 최신 반영`n- 기존 공결·지각·공지·급식·야자감독 운영 동기화 유지`n- 0.82.68 야간 실제 차시 표시와 0.82.69 오늘의 대학 상담형 카드 회귀검사`n- MutationObserver·전역 클릭·렌더 후 DOM 교체 없음"} 'release'
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.70'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.70/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.70 · 야자출결 실시간 운영동기화 보강'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          Run-Native {git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json;git commit -m 'Publish UEP 0.82.70 policy';git pull --rebase origin main;git push} 'policy push'

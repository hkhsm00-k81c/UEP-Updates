name: Build and Release UEP 0.82.76 Today University Click Fix
on:
  push:
    paths:
      - 'release-08276.trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-release-uep-08276
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch, validate, package, release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.75 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download 0.82.75'
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          Run-Native {node scripts/patch-uep-08276-university-detail-tdz.js $root} '08276 patch'
          Run-Native {node --check "$root/gyomuon.js"} 'gyomuon syntax'
          Run-Native {node --check "$root/electron/google-data.cjs"} 'google-data syntax'
          Run-Native {node --check "$root/electron/main.cjs"} 'main syntax'
          Run-Native {node scripts/test-uep-08276-university-detail-tdz.js $root} '08276 regression'
          $pkg=Get-Content "$root/package.json" -Raw|ConvertFrom-Json
          if([string]$pkg.version -ne '0.82.76'){throw "package version mismatch: $($pkg.version)"}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip"|Set-Content sha256.txt
          Run-Native {gh release create v0.82.76 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.76' --notes "UEP v0.82.76`n- 오늘의 대학 상세 렌더러에서 성취도 표시 변수를 선언 전에 참조하던 TDZ 오류를 원래 렌더 흐름 안에서 수정`n- 클릭 이벤트·대시보드 라우터·입시 단계 우선 로딩 구조는 그대로 유지`n- 야자 인원 및 기타 대시보드 데이터 로직 변경 없음`n- v0.82.73 오늘의 대학 5개 핵심배지·내신·수능최저·권장과목 UI 유지`n- MutationObserver·전역 클릭 우회·렌더 후 HTML 교체·setTimeout DOM 보정 추가 없음"} 'release'
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.76'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.76/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.76 · 오늘의 대학 클릭 렌더 오류 복구'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          Run-Native {git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json;git commit -m 'Publish UEP 0.82.76 policy';git pull --rebase origin main;git push} 'policy push'

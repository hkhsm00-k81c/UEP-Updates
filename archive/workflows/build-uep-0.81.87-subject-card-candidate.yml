name: Build UEP 0.81.87 Subject Card Candidate
on:
  push:
    branches: [main]
    paths:
      - build-uep-0.81.87-subject-card.trigger
permissions:
  contents: write
concurrency:
  group: build-uep-0.81.87-subject-card
  cancel-in-progress: false
jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download stable 0.81.86 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,work,verify | Out-Null
          gh release download v0.81.86 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip work -Force
          if(!(Test-Path work/UEP.exe)){throw '0.81.86 baseline UEP.exe missing'}
      - name: Apply subject-card insight and accuracy patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08187-subject-card-insight.js
          node scripts/patch-uep-08187-subject-card-insight.js work
          node --check scripts/patch-uep-08187-subject-card-accuracy.js
          node scripts/patch-uep-08187-subject-card-accuracy.js work
          node --check work/resources/app/gyomuon.js
          $pkg=Get-Content work/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.87'){throw 'package version mismatch'}
          $g=Get-Content work/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('const APP_VERSION = "0.81.87";','UEP_08187_SUBJECT_CARD_INSIGHT_START','UEP_08187_SUBJECT_CARD_ACCURACY_START','OPEN_LINE=21','신청자 계열 구성','신청 정상','오류','선택가능','문과','이과','미분류','현재 성적대 분포')){if(!$g.Contains($m)){throw "marker missing: $m"}}
          foreach($keep in @('UEP_08186_GRADE_TRANSFER_START','function uepOpenSubjectModal08128','function uepSelectionErrors08129','UEP_08185_CURRICULUM_STABLE_CORE_START')){if(!$g.Contains($keep)){throw "existing feature missing: $keep"}}
      - name: Package and reopen verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path work/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.87'){throw 'reopened package version mismatch'}
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          if(!$g.Contains('UEP_08187_SUBJECT_CARD_ACCURACY_END')){throw 'reopened accuracy marker missing'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish candidate release only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.81.87-candidate'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag}
          $global:LASTEXITCODE=0
          $notes=@'
          UEP 0.81.87 선택과목 신청현황 카드 분석 후보판

          - 기존 선택과목 신청·필터·오류검사·학생명단 로직 유지
          - 과학 위계카드는 단순 인원 뺄셈이 아니라 학생ID 집합으로 선수과목 충족 여부를 검증
          - 2-2·3-1 과학 위계과목에 정상 신청과 위계오류 인원을 분리 표시
          - 3-1은 선수과목 풀에서 2-2 정상 동일과목 학생만 제외해 실제 선택가능인원 계산
          - 국어·영어(2-1·2-2)와 사회탐구 카드에 문과·이과·미분류 구성 인원 및 비율 표시
          - 희망계열·희망전공이 있으면 우선 사용하고, 없으면 2-1·2-2 사회·과학 선택조합으로 계열 보조분류
          - 모든 과목 카드의 1학기말 성적 분포와 개설 기준 21명 표시 유지
          - 안정판 자동업데이트 메타데이터는 변경하지 않음
          '@
          $notes|Set-Content release-notes-08187.md -Encoding UTF8
          gh release create $tag UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP v0.81.87 Candidate · 선택과목 카드 분석' --notes-file release-notes-08187.md --prerelease
          "0.81.87 candidate SHA256 $env:UEP_SHA256"|Set-Content build-08187-status.txt -Encoding UTF8

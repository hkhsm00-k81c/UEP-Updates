name: Inspect UEP 0.82.71 Night Critical
on:
  push:
    paths: ['inspect-08271-night-critical.trigger']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.71 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source;if($LASTEXITCODE-ne 0){throw 'download'}
          Expand-Archive source/UEP-update.zip app -Force;$root='app/resources/app'
          $d=Get-Content "$root/electron/google-data.cjs" -Raw;$g=Get-Content "$root/gyomuon.js" -Raw;$m=Get-Content "$root/electron/main.cjs" -Raw
          function SliceAround($txt,$needle,$before,$after,$file){$i=$txt.IndexOf($needle);if($i-lt 0){throw "missing $needle"};$s=[Math]::Max(0,$i-$before);$n=[Math]::Min($before+$after,$txt.Length-$s);$txt.Substring($s,$n)|Set-Content $file -Encoding utf8}
          SliceAround $g 'READONLY_AUTO_REFRESH_MS' 2500 4500 'inspection-08271-refresh-constants.txt'
          SliceAround $g 'startReadonlyAutoRefresh();' 5000 7000 'inspection-08271-refresh-startup.txt'
          SliceAround $g 'refreshOperationalCacheSilently' 3000 7000 'inspection-08271-refresh-operational-call.txt'
          SliceAround $m 'previewOperationalSync' 3000 5000 'inspection-08271-main-preview-operational.txt'
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-08271-refresh-*.txt inspection-08271-main-preview-operational.txt;git commit -m 'Inspect UEP 0.82.71 refresh timing';if($LASTEXITCODE-ne 0){throw 'commit'};git pull --rebase origin main;if($LASTEXITCODE-ne 0){throw 'pull'};git push;if($LASTEXITCODE-ne 0){throw 'push'}

name: Diagnose UEP 0.82.09 Dashboard
on:
  push:
    branches: [main]
    paths: [diag-08209.trigger]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.09 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $out=@()
          foreach($f in @('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs')){
            if(!(Test-Path $f)){continue}
            $g=Get-Content $f -Raw
            foreach($pat in @('readReadonlyCache','previewReadonlySync','uep08123NormalizeReadonlyCache','readonlyCache =','spreadsheetId','sheetName','A1','52_대입기초','53_전형이해','56_대학입시마스터','학교업무공지·마감','dashboardReportStatusRows','title=','제출완료','공결/지각')){
              $m=[regex]::Matches($g,[regex]::Escape($pat))
              $count=[Math]::Min($m.Count,10)
              for($i=0;$i -lt $count;$i++){
                $idx=$m[$i].Index;$start=[Math]::Max(0,$idx-1400);$len=[Math]::Min(3600,$g.Length-$start)
                $out += "===== FILE: $f | PATTERN: $pat ====="
                $out += $g.Substring($start,$len)
                $out += "`n---`n"
              }
            }
          }
          $out | Set-Content diag-08209-dashboard.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag-08209-dashboard.txt
          git commit -m 'Capture UEP 0.82.09 dashboard diagnostics'
          git push origin HEAD:main

name: Inspect UEP Grade Average Formula
'on':
  push:
    branches: [main]
    paths: [inspect-grade-average.trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.25 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $p='app/resources/app/gyomuon.js'
          $lines=Get-Content $p -Encoding UTF8
          foreach($fn in @('actualNineAverage','admissionBase')){
            $start=(Select-String -Path $p -Pattern ("function "+$fn) -SimpleMatch -Encoding UTF8 | Select-Object -First 1).LineNumber
            if($start){
              $next=(Select-String -Path $p -Pattern '^function ' -Encoding UTF8 | Where-Object {$_.LineNumber -gt $start} | Select-Object -First 1).LineNumber
              if(-not $next){$next=[Math]::Min($lines.Count,$start+250)}
              Write-Host ("===== {0} lines {1}-{2} =====" -f $fn,$start,($next-1))
              for($i=$start;$i -lt $next;$i++){ Write-Host ("{0}: {1}" -f $i,$lines[$i-1]) }
            } else { Write-Host ("NOT FOUND: "+$fn) }
          }
          Write-Host '===== CREDIT / SCORE FIELD REFERENCES ====='
          Select-String -Path $p -Pattern '이수학점|이수단위|학점|credit|credits|unitCredit|courseCredit|weight' -Encoding UTF8 -Context 8,12 | Select-Object -First 220 | ForEach-Object {
            Write-Host ("LINE {0}: {1}" -f $_.LineNumber,$_.Line)
            foreach($c in $_.Context.PreContext){Write-Host ('  PRE: '+$c)}
            foreach($c in $_.Context.PostContext){Write-Host (' POST: '+$c)}
          }
          Write-Host '===== SCORE NORMALIZATION / MAPPING ====='
          Select-String -Path $p -Pattern 'scoreRecords|scoreByStudent|scoreType|achievement|enrollment|rank' -Encoding UTF8 -Context 6,10 | Select-Object -First 220 | ForEach-Object {
            Write-Host ("LINE {0}: {1}" -f $_.LineNumber,$_.Line)
            foreach($c in $_.Context.PreContext){Write-Host ('  PRE: '+$c)}
            foreach($c in $_.Context.PostContext){Write-Host (' POST: '+$c)}
          }

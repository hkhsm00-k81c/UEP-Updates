name: Compare UEP 0.82.37 vs 0.82.77 Admission Router
on:
  push:
    paths:
      - 'compare-08237-08277-admission-router.trigger'
permissions:
  contents: write
jobs:
  compare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          foreach($v in @('0.82.37','0.82.77')){
            New-Item -ItemType Directory -Force "src-$v","app-$v" | Out-Null
            gh release download "v$v" --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir "src-$v"
            if($LASTEXITCODE -ne 0){throw "download $v failed"}
            Expand-Archive "src-$v/UEP-update.zip" "app-$v" -Force
            $txt=Get-Content "app-$v/resources/app/gyomuon.js" -Raw
            $out=@()
            foreach($needle in @("$$('[data-dashboard-admission]')",'function openDashboardUniversityDetail(','function dashboardAdmissionTodayUniversity(','function openDashboardAdmissionUniversityByName(')){
              $i=$txt.IndexOf($needle)
              $out += "===== $needle @ $i ====="
              if($i -ge 0){$s=[Math]::Max(0,$i-2500);$len=[Math]::Min(9000,$txt.Length-$s);$out += $txt.Substring($s,$len)}
            }
            $out -join "`r`n" | Set-Content "compare-admission-router-$v.txt" -Encoding utf8
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compare-admission-router-0.82.37.txt compare-admission-router-0.82.77.txt
          git commit -m 'Compare admission router v0.82.37 vs v0.82.77'
          if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'pull failed'}
          git push
          if($LASTEXITCODE -ne 0){throw 'push failed'}

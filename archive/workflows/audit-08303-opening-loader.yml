name: Audit UEP PC 0.83.03 opening loader
on:
  push:
    branches: [main]
    paths:
      - audit-08303-opening-loader.trigger
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull latest repository state
        run: git pull --rebase origin main
      - name: Download 0.83.03 UEP PC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/u && mkdir -p /tmp/u
          gh release download v0.83.03 -R "$GITHUB_REPOSITORY" -p UEP-update.zip -D /tmp/u
          unzip -q /tmp/u/UEP-update.zip -d /tmp/u/app
      - name: Inspect startup and core data readiness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/u/app/resources/app')
          out=Path('audit/08303-opening'); out.mkdir(parents=True,exist_ok=True)
          needles=['DOMContentLoaded','window.onload','loadData','loadAll','bootstrap','dashboard','학생기본','기본정보','login','로그인','loading','로딩','sheet','SHEETS','Promise.all','renderDashboard','showDashboard','initApp','initialize']
          rows=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.js','.cjs','.mjs','.html'}: continue
              try: lines=p.read_text(encoding='utf-8').splitlines()
              except Exception: continue
              hits=[i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in needles)]
              if not hits: continue
              rows.append(f'===== {p.relative_to(root)} =====')
              picks=set()
              for i in hits: picks.update(range(max(0,i-18),min(len(lines),i+35)))
              rows.extend(f'{i+1}: {lines[i]}' for i in sorted(picks))
          (out/'startup-loader-focused.txt').write_text('\n'.join(rows),encoding='utf-8')
          manifest=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.suffix.lower() in {'.js','.cjs','.mjs','.html','.json'}:
                  manifest.append(str(p.relative_to(root)))
          (out/'app-text-manifest.txt').write_text('\n'.join(manifest),encoding='utf-8')
          PY
      - name: Commit audit extracts safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/08303-opening/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: capture UEP 0.83.03 startup loader flow'
          for n in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1

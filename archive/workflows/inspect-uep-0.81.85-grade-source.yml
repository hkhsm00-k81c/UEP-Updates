name: Inspect UEP 0.81.85 Grade Source
on:
  push:
    branches:
      - build/0.81.86-grade-transfer-fix
    paths:
      - inspect-uep-0.81.85.trigger
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download current release and inspect grade pipeline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.81.85 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $g='app/resources/app/gyomuon.js'
          node --check $g
          $text=Get-Content $g -Raw -Encoding UTF8
          foreach($needle in @('function uepStudentGradeAverage','uepStudentGradeAverage','scoreRecords','internalGrades','transferDate','전입일','전입','function uepOpenSubjectModal08128','1학년 내신평균')){
            Write-Host "===== $needle ====="
            $idx=$text.IndexOf($needle)
            if($idx -lt 0){ Write-Host 'NOT FOUND'; continue }
            $start=[Math]::Max(0,$idx-2200); $len=[Math]::Min(11000,$text.Length-$start)
            Write-Host $text.Substring($start,$len)
          }

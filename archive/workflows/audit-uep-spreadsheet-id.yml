name: Audit UEP Spreadsheet ID Definition
on:
  push:
    paths:
      - '.github/workflows/audit-uep-spreadsheet-id.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.83 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $m='app/resources/app/electron/main.cjs'
          Select-String -Path $m -Pattern 'UEP_SPREADSHEET_ID|saveAdmissionCounselPoint|56A_대학상담포인트DB' -Context 2,3 | ForEach-Object {$_.ToString()|Write-Host}

name: Inspect UEP 0.82.69 Readonly Refresh
on:
  push:
    paths:
      - 'inspect-readonly-refresh-08269.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.69 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw "download failed: $LASTEXITCODE"}
          Expand-Archive source/UEP-update.zip app -Force
          $out='inspection-readonly-refresh-08269.txt'
          "UEP v0.82.69 readonly/cache refresh inspection" | Set-Content $out -Encoding utf8
          function Grab([string]$file,[string[]]$patterns,[int]$b=16,[int]$a=35){
            $lines=Get-Content $file; Add-Content $out "`n===== $file ====="
            foreach($p in $patterns){
              Add-Content $out "`n--- $p ---"
              $hits=Select-String -Path $file -Pattern $p -SimpleMatch
              if(-not $hits){Add-Content $out '(no match)';continue}
              foreach($h in $hits){$s=[Math]::Max(0,$h.LineNumber-1-$b);$e=[Math]::Min($lines.Count-1,$h.LineNumber-1+$a);Add-Content $out "[line $($h.LineNumber)]";for($i=$s;$i -le $e;$i++){Add-Content $out (("{0,7}: {1}" -f ($i+1),$lines[$i]))}}
            }
          }
          Grab 'app/resources/app/gyomuon.js' @('let readonlyCache','readonlyCache =','readonlyCache=','refreshReadonly','loadReadonly','google:read','school:read','googleData','setInterval(','reload','새로고침') 12 28
          Grab 'app/resources/app/electron/main.cjs' @('google-data','school:read','google:read','cache','ttl','ipcMain.handle','readonly') 12 30
          Grab 'app/resources/app/electron/google-data.cjs' @('cache','ttl','readSchool','loadSchool','module.exports','exports.','rowsFrom','fetch') 12 30
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $out
          git commit -m 'Inspect v0.82.69 readonly refresh and cache path'
          if($LASTEXITCODE -ne 0){throw "commit failed: $LASTEXITCODE"}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw "pull failed: $LASTEXITCODE"}
          git push
          if($LASTEXITCODE -ne 0){throw "push failed: $LASTEXITCODE"}

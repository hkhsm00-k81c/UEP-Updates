name: Publish UEP 0.81.66 Bundled Fixes
'on':
  push:
    branches: [main]
    paths: [publish-uep-0.81.66-bundle.trigger]
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.66-bundle
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download known-good 0.81.64
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force source,app,verify|Out-Null
          gh release download v0.81.64 --repo $env:GITHUB_REPOSITORY --pattern 'UEP-update.zip' --dir source
          Expand-Archive source/UEP-update.zip app -Force
      - name: Validate patch sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node --check scripts/patch-uep-0.81.66.js
          node --check scripts/uep-0.81.66-core-addon.js
          node --check scripts/uep-0.81.66-urgent-addon.js
      - name: Apply 0.81.66 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          node scripts/patch-uep-0.81.66.js app $env:GITHUB_WORKSPACE
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/preload.cjs
          $pkg='app/resources/app/package.json';$p=Get-Content $pkg -Raw -Encoding UTF8|ConvertFrom-Json;$p.version='0.81.66';$p|ConvertTo-Json -Depth 50|Set-Content $pkg -Encoding UTF8
          $g=(Get-FileHash app/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();"GYOMUON_SHA256=$g"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $m=(Get-FileHash app/resources/app/electron/main.cjs -Algorithm SHA256).Hash.ToLower();"MAIN_SHA256=$m"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $pr=(Get-FileHash app/resources/app/electron/preload.cjs -Algorithm SHA256).Hash.ToLower();"PRELOAD_SHA256=$pr"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build reopen and verify exact payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          node --check verify/resources/app/gyomuon.js
          node --check verify/resources/app/electron/main.cjs
          node --check verify/resources/app/electron/preload.cjs
          $g=(Get-FileHash verify/resources/app/gyomuon.js -Algorithm SHA256).Hash.ToLower();if($g -ne $env:GYOMUON_SHA256){throw "gyomuon hash mismatch"}
          $m=(Get-FileHash verify/resources/app/electron/main.cjs -Algorithm SHA256).Hash.ToLower();if($m -ne $env:MAIN_SHA256){throw "main hash mismatch"}
          $pr=(Get-FileHash verify/resources/app/electron/preload.cjs -Algorithm SHA256).Hash.ToLower();if($pr -ne $env:PRELOAD_SHA256){throw "preload hash mismatch"}
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json;if($pkg.version -ne '0.81.66'){throw "package version mismatch: $($pkg.version)"}
          $gy=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          $ma=Get-Content verify/resources/app/electron/main.cjs -Raw -Encoding UTF8
          foreach($x in @('__UEP_08166_CORE_RUNTIME__','__UEP_08166_URGENT_NOTICE_RUNTIME__','__UEP_08166_TODAY_MEAL_IN_DUTY_POPUP__')){if(!$gy.Contains($x)){throw "gyomuon marker missing: $x"}}
          if(!$ma.Contains('__UEP_08166_SHARED_SECURITY_AND_AUTOSTART__')){throw 'main marker missing'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"UEP_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host '0.81.66 package verification PASS'
      - name: Publish only after all verification passes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$false
          gh release view v0.81.66 --repo $env:GITHUB_REPOSITORY *> $null
          $exists=($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE=0
          $PSNativeCommandUseErrorActionPreference=$true
          if($exists){gh release delete v0.81.66 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          gh release create v0.81.66 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.66 Shared Security + Auto Start + Meal + Urgent Notice' --notes '0.81.64 정상판 기준 통합 빌드. 관리자/학년부장 설정 비밀번호를 00_UEP설정에 해시로 공용 저장하고 담임은 동일 비밀번호로 인증합니다. Windows 시작 시 UEP 자동실행 설정을 추가합니다. 오늘의 급식지도 팝업에 NEIS 오늘 급식정보를 함께 표시합니다. 긴급공지를 강제팝업과 상단 종 알림에 연결합니다. 0.81.65 실패 패치는 포함하지 않았으며 native command 실패 시 Release가 중단되는 엄격한 빌드 검증을 적용합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.66/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8|ConvertFrom-Json;$policy.latestVersion='0.81.66';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='공용 보안비밀번호 · Windows 자동실행 · 오늘 급식정보 · 긴급공지';$policy.forceUpdate=$false;$policy|ConvertTo-Json -Depth 50|Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.66';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='공용 보안비밀번호 + Windows 자동실행 + 오늘 급식정보 + 긴급공지'}|ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8;Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json;git commit -m 'release: promote UEP 0.81.66 bundled fixes';git push

name: Publish UEP 0.81.52 Accumulated Operations Repair

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: [publish-uep-0.81.52.trigger]

permissions:
  contents: write

concurrency:
  group: publish-uep-0.81.52
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.81.51
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app,verify | Out-Null
          gh release download v0.81.51 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir source
          $zip=Get-ChildItem source -File -Filter '*.zip' | Select-Object -First 1
          if(!$zip){throw '0.81.51 release zip not found'}
          Expand-Archive $zip.FullName app -Force
          if(!(Test-Path 'app/UEP.exe')){throw '0.81.51 base has no root UEP.exe'}
      - name: Apply accumulated fixes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/patch-uep-0.81.52.js app
          node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node --check app/resources/app/electron/google-data.cjs
          $pkg='app/resources/app/package.json'
          $p=Get-Content $pkg -Raw -Encoding UTF8 | ConvertFrom-Json
          $p.version='0.81.52'
          $p | ConvertTo-Json -Depth 50 | Set-Content $pkg -Encoding UTF8
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          $m=Get-Content app/resources/app/electron/main.cjs -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.52";','function uepComparableDate(','최근 학기말 평균','function openCurriculumStudentSidePanel(','function upsertNoticeCache(','수정 저장 중…','const READONLY_AUTO_REFRESH_MS = 10 * 60 * 1000;','시험별 등급 분포 비교','visibleSubjects=subject==="__all__"?subjects:[subject]',"const result=await sensitivePasswordModal({mode:'unlock',configured:true});",'<b>게시 중 직접공지</b>','function teacherTimetableMasterRows(teacher="")')){if(!$g.Contains($x)){throw "regression marker missing: $x"}}
          foreach($x in @('if(!payload.id){','duplicate:true','ipcMain.handle("notice:save"')){if(!$m.Contains($x)){throw "main marker missing: $x"}}
      - name: Build and verify package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'app/*' -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          if(!(Test-Path 'verify/UEP.exe')){throw 'root UEP.exe missing'}
          $g=Get-Content verify/resources/app/gyomuon.js -Raw -Encoding UTF8
          $m=Get-Content verify/resources/app/electron/main.cjs -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.81.52";','function uepComparableDate(','최근 학기말 평균','function openCurriculumStudentSidePanel(','function upsertNoticeCache(')){if(!$g.Contains($x)){throw "packaged marker missing: $x"}}
          if(!$m.Contains('duplicate:true')){throw 'packaged duplicate guard missing'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and promote 0.81.52
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.81.52 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete v0.81.52 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes}
          $global:LASTEXITCODE=0
          gh release create v0.81.52 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP 0.81.52 Accumulated Operations Repair' --notes '공결 날짜 조회, 개인 내신 대표평균, 선택과목 상세 동선, 공지 저장·확인 반응과 중복 방지를 함께 개선합니다.'
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.52/UEP-update.zip'
          $policy=Get-Content uep-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $policy.latestVersion='0.81.52';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message='공결·내신·선택과목·공지 통합 안정화';$policy.forceUpdate=$false
          $policy | ConvertTo-Json -Depth 50 | Set-Content uep-policy.json -Encoding UTF8
          $manifest=@{version='0.81.52';channel='stable';downloadUrl=$url;sha256=$env:UEP_SHA256;notes='공결·내신·선택과목·공지 통합 안정화'} | ConvertTo-Json
          Set-Content uep-update.json $manifest -Encoding UTF8
          Set-Content uep-version.json $manifest -Encoding UTF8
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uep-policy.json uep-update.json uep-version.json
          git commit -m 'release: promote UEP 0.81.52 accumulated operations repair'
          git push

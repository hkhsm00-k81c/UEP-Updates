name: Publish UEP 0.81.82 Curriculum Roster Error UI
on:
  push:
    branches: [main]
    paths:
      - publish-uep-0.81.82.trigger
permissions:
  contents: write
concurrency:
  group: publish-uep-0.81.82
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 0.81.81 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,work,verify | Out-Null
          gh release download v0.81.81 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip work -Force
          if(!(Test-Path work/UEP.exe)){throw '0.81.81 baseline UEP.exe missing'}
      - name: Apply 0.81.82 UI patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08182-curriculum-roster-error-ui.js
          node scripts/patch-uep-08182-curriculum-roster-error-ui.js work
          node --check work/resources/app/gyomuon.js
          $pkg=Get-Content work/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.82'){throw 'package version mismatch'}
          $ui=Get-Content work/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($m in @('const APP_VERSION = "0.81.82";','UEP_08182_CURRICULUM_ROSTER_ERROR_UI_START','다른 과학선택','roster-eight-08182','uep-grade-errors-08182','UEP 0.81.82 업데이트')){if(!$ui.Contains($m)){throw "marker missing: $m"}}
      - name: Package and reopen verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path work/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          Expand-Archive UEP-update.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          $pkg=Get-Content verify/resources/app/package.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($pkg.version -ne '0.81.82'){throw 'reopened package version mismatch'}
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "UEP_SHA256=$sha"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish release and promote update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $notes=@'
          UEP 0.81.82 선택과목 명단·오류학생 조회 보완

          - 2-2·3-1 과학 신청명단 팝업 가로폭 확대
          - 현재 학기 다른 과학 선택과 예상등급 추가 표시
          - 교차학기 과학 선택 칼럼 한 줄 우선 표시
          - 2학년 / 3학년 / 2·3학년 오류학생 조회와 반별 필터 연동 보완
          - 오류종류에 2학년·3학년별 정상 또는 실제 오류유형 표시
          - 업데이트 후 첫 실행 변경내역 팝업 유지
          '@
          $notes|Set-Content release-notes.md -Encoding UTF8
          gh release view v0.81.82 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){throw 'v0.81.82 release already exists'}
          $global:LASTEXITCODE=0
          gh release create v0.81.82 UEP-update.zip --repo $env:GITHUB_REPOSITORY --title 'UEP v0.81.82 선택과목 명단·오류학생 조회 보완' --notes-file release-notes.md
          $url='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.81.82/UEP-update.zip'
          $message='UEP 0.81.82 과학 동일·교차학기 선택 표시 확대 · 학년별 오류학생/반 조회 · 오류종류 상세화'
          function PutJson($path,$obj){$tmp=Join-Path $env:RUNNER_TEMP ($path-replace'/','_');$obj|ConvertTo-Json -Depth 50|Set-Content $tmp -Encoding UTF8;$sha=(gh api "repos/${env:GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha);$b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($tmp));@{message="release: promote $path to UEP 0.81.82";content=$b64;sha=$sha;branch='main'}|ConvertTo-Json|gh api --method PUT "repos/${env:GITHUB_REPOSITORY}/contents/${path}" --input -|Out-Null}
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json;$policy.latestVersion='0.81.82';$policy.downloadUrl=$url;$policy.sha256=$env:UEP_SHA256;$policy.message=$message;$policy.forceUpdate=$false;PutJson 'uep-policy.json' $policy
          $manifest=[ordered]@{version='0.81.82';channel='stable';downloadUrl=$url;notes=$message;sha256=$env:UEP_SHA256};PutJson 'uep-update.json' $manifest;PutJson 'uep-version.json' $manifest
          $legacy=[ordered]@{latestVersion='0.81.82';downloadUrl=$url;sha256=$env:UEP_SHA256;forceUpdate=$false;message=$message};PutJson 'policy.json' $legacy

name: Inspect UEP 0.82.76 Parser Wiring
on:
  push:
    paths: ['inspect-08276-parser-wiring.trigger']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force source,app|Out-Null
          gh release download v0.82.76 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $out=@();foreach($f in @('app/resources/app/electron/main.cjs','app/resources/app/electron/google-data.cjs')){$lines=Get-Content $f;$out+="===== $f TOP =====";for($i=0;$i-lt [Math]::Min(120,$lines.Count);$i++){$out+=("{0,6}: {1}" -f ($i+1),$lines[$i])};foreach($pat in @('assignValueRangesByRange','SHEET_RANGES','parseGoogleSheetData','module.exports','13_출석부')){for($i=0;$i-lt $lines.Count;$i++){if($lines[$i].Contains($pat)){$s=[Math]::Max(0,$i-12);$e=[Math]::Min($lines.Count-1,$i+35);$out+="--- $pat line $($i+1) ---";for($j=$s;$j-le $e;$j++){$out+=("{0,6}: {1}" -f ($j+1),$lines[$j])}}}}}
          [IO.File]::WriteAllText((Join-Path $PWD 'inspection-08276-parser-wiring.txt'),($out -join "`r`n"),(New-Object Text.UTF8Encoding($false)))
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add inspection-08276-parser-wiring.txt;git commit -m 'Inspect UEP 0.82.76 parser wiring';if($LASTEXITCODE -ne 0){throw 'commit failed'};git pull --rebase origin main;if($LASTEXITCODE -ne 0){throw 'pull failed'};git push;if($LASTEXITCODE -ne 0){throw 'push failed'}

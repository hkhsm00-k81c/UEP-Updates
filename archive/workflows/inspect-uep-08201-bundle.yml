name: Inspect UEP 0.82.01 Bundle

on:
  push:
    branches: [main]
    paths:
      - inspect-uep-08201-bundle.trigger

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and inspect official 0.82.01 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.01 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          $files=@('app/resources/app/gyomuon.js','app/resources/app/electron/main.cjs','app/resources/app/electron/preload.cjs')
          $patterns=@('문이과','문·이과','교차오류','학사외출','외출 안내','늦은 입소','조기 퇴소','사감','학원','야자감독','급식지도','담임','night','supervisor','outing','academy')
          $out = New-Object System.Collections.Generic.List[string]
          foreach($file in $files){
            $out.Add("===== FILE: $file =====")
            if(!(Test-Path $file)){continue}
            $lines=Get-Content $file -Encoding UTF8
            for($i=0;$i -lt $lines.Count;$i++){
              $matched=$false
              foreach($p in $patterns){if($lines[$i] -match [regex]::Escape($p)){$matched=$true;break}}
              if($matched){
                $from=[Math]::Max(0,$i-3); $to=[Math]::Min($lines.Count-1,$i+3)
                $out.Add("--- lines $($from+1)-$($to+1) hit $($i+1) ---")
                for($j=$from;$j -le $to;$j++){$out.Add(("{0}: {1}" -f ($j+1),$lines[$j]))}
              }
            }
          }
          $out | Set-Content inspection-08201.txt -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-08201.txt
          git commit -m 'Capture UEP 0.82.01 inspection snippets'
          git push origin HEAD:main

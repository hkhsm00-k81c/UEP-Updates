name: Build Release UEP 0.83.00 Stable Rollback
on:
  push:
    paths:
      - 'release-08300-stable-rollback.trigger'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download known-good v0.82.98 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force source,app,output,verify|Out-Null
          gh release download v0.82.98 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          if($LASTEXITCODE -ne 0){throw 'baseline download failed'}
          Expand-Archive source/UEP-update.zip app -Force
          $pkg=Get-Content app/resources/app/package.json -Raw|ConvertFrom-Json; if($pkg.version -ne '0.82.98'){throw 'baseline mismatch'}
      - name: Apply stable rollback version patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; node --check scripts/patch-uep-08300-stable-rollback.js
          node scripts/patch-uep-08300-stable-rollback.js app/resources/app
      - name: Syntax and regression checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; node --check app/resources/app/gyomuon.js
          node --check app/resources/app/electron/main.cjs
          node scripts/test-uep-08300-stable-rollback.js app/resources/app
      - name: Build and verify package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Compress-Archive -Path app/* -DestinationPath output/UEP-update.zip -CompressionLevel Optimal
          Expand-Archive output/UEP-update.zip verify -Force
          node --check verify/resources/app/gyomuon.js
          node --check verify/resources/app/electron/main.cjs
          node scripts/test-uep-08300-stable-rollback.js verify/resources/app
      - name: SHA256 and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'; $hash=(Get-FileHash output/UEP-update.zip -Algorithm SHA256).Hash.ToLower(); "$hash  UEP-update.zip"|Set-Content output/sha256.txt -Encoding ascii; "UEP_ZIP_SHA256=$hash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          gh release create v0.83.00 output/UEP-update.zip output/sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.83.00 Stable' --notes 'UEP v0.83.00 안정판. 0.82.99의 Board School Read 전환을 철회하고 검증된 0.82.98 동작으로 복구합니다. 기존 자동갱신, 관리 UI, 권한, 전자칠판 조회/관리 기능은 0.82.98 기준으로 유지합니다.'
      - name: Update stable policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json; $policy.latestVersion='0.83.00'; $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.83.00/UEP-update.zip'; $policy.sha256=$env:UEP_ZIP_SHA256; $policy.message='UEP 0.83.00 · 0.82.98 기반 안정 복구판'; $policy.forceUpdate=$false; $policy.updateEnabled=$true; $policy|ConvertTo-Json -Depth 20|Set-Content uep-policy.json -Encoding utf8
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add uep-policy.json; git commit -m 'Set update policy to UEP 0.83.00 stable'; git push origin HEAD:main
      - name: Final verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'; $release=gh api repos/$env:GITHUB_REPOSITORY/releases/tags/v0.83.00|ConvertFrom-Json; $zip=$release.assets|Where-Object {$_.name -eq 'UEP-update.zip'}; if(!$zip){throw 'ZIP missing'}; if($zip.digest -ne ('sha256:'+$env:UEP_ZIP_SHA256)){throw 'digest mismatch'}; $raw=gh api repos/$env:GITHUB_REPOSITORY/contents/uep-policy.json -H 'Accept: application/vnd.github.raw+json'; $remote=$raw|ConvertFrom-Json; if($remote.latestVersion -ne '0.83.00' -or $remote.sha256 -ne $env:UEP_ZIP_SHA256){throw 'remote policy mismatch'}; Write-Host "RELEASE_OK version=0.83.00 digest=$($zip.digest)"

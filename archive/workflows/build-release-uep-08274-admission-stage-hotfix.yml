name: Build and Release UEP 0.82.74 Admission Stage Hotfix
on:
  push:
    paths: ['release-08274.trigger']
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $ErrorActionPreference='Stop'
          function Run-Native([scriptblock]$c,[string]$l){&$c;if($LASTEXITCODE -ne 0){throw "$l failed: $LASTEXITCODE"}}
          New-Item -ItemType Directory -Force source,app|Out-Null
          Run-Native {gh release download v0.82.73 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source} 'download 0.82.73'
          Expand-Archive source/UEP-update.zip app -Force
          $root='app/resources/app'
          Run-Native {node scripts/patch-uep-08274-admission-stage-hotfix.js $root} '08274 patch'
          Run-Native {node --check "$root/gyomuon.js"} 'gyomuon syntax'
          Run-Native {node --check "$root/electron/google-data.cjs"} 'google-data syntax'
          Run-Native {node --check "$root/electron/main.cjs"} 'main syntax'
          Run-Native {node scripts/test-uep-08274-admission-stage-hotfix.js $root} '08274 regression'
          $pkg=Get-Content "$root/package.json" -Raw|ConvertFrom-Json
          if([string]$pkg.version -ne '0.82.74'){throw "package version mismatch: $($pkg.version)"}
          Compress-Archive -Path app/* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  UEP-update.zip"|Set-Content sha256.txt
          Run-Native {gh release create v0.82.74 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.74' --notes "UEP v0.82.74`n- 오늘의 대학 클릭 시 입시DB가 아직 로딩 중이면 56_대학입시마스터 누락으로 오판하지 않고 입시단계를 우선 로드`n- 동일 전체 동기화를 학사/입시 단계마다 중복 실행하던 흐름을 하나의 공유 동기화로 정리`n- 기본정보 시트에서 52~58 입시탭을 잘못 중복 조회하던 경로 제거, 전용 입시DB에서만 조회`n- v0.82.73 오늘의 대학 카드 UI·5개 핵심배지·내신/수능최저/권장과목 구조 유지`n- MutationObserver·전역 클릭 우회·렌더 후 DOM 교체 추가 없음"} 'release'
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.74'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.74/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.74 · 오늘의 대학 입시DB 연결 즉시복구 및 중복동기화 정리'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          Run-Native {git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add uep-policy.json;git commit -m 'Publish UEP 0.82.74 policy';git pull --rebase origin main;git push} 'policy push'

name: Build and Release UEP 0.82.39 University Navigation Bindings
'on':
  push:
    branches: [main]
    paths: [release-08239.trigger]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/patch-uep-08239-university-nav-bindings.js
          node --check scripts/test-uep-08239-university-nav-bindings.js
          New-Item -ItemType Directory -Force source,app | Out-Null
          gh release download v0.82.38 --repo $env:GITHUB_REPOSITORY --pattern UEP-update.zip --dir source
          Expand-Archive source/UEP-update.zip app -Force
          node scripts/patch-uep-08239-university-nav-bindings.js app
          node --check app/resources/app/gyomuon.js
          node scripts/test-uep-08239-university-nav-bindings.js app
          $g=Get-Content app/resources/app/gyomuon.js -Raw -Encoding UTF8
          foreach($x in @('const APP_VERSION = "0.82.39";','function uep08223UniversityRegions(university){','function uep08239BindUniversityNavigation(){','UEP_08239_UNIVERSITY_NAV_BINDINGS',"[data-uep-region]","[data-uep-university]","[data-uep-prev]","[data-uep-next]")){if(-not $g.Contains($x)){throw "missing release marker: $x"}}
          if($g.Contains('UEP_08234_TODAY_UNIVERSITY_CLICK_HARD_FIX') -or $g.Contains('UEP_08235_ADMISSION_TOP_BUTTONS_REPAIR')){throw 'temporary DOM click patch leaked'}
          Remove-Item UEP-update.zip,sha256.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path app\* -DestinationPath UEP-update.zip -CompressionLevel Optimal
          $sha=(Get-FileHash UEP-update.zip -Algorithm SHA256).Hash.ToLower();"$sha  UEP-update.zip"|Set-Content sha256.txt -Encoding ascii
          $notes=@'
          UEP v0.82.39
          - 원인 추가 확정: 0.82.38에서 대학 상세 렌더링은 복구됐지만 상단 지역·대학·이전·다음 버튼은 HTML만 생성되고 클릭 이벤트가 연결되지 않았습니다.
          - 대학 상세 팝업 내부의 data-uep-region / university / prev / next 버튼에만 직접 이벤트를 연결했습니다.
          - 지역 버튼은 선택 지역을 저장한 뒤 해당 지역 첫 대학을 열고, 대학·이전·다음 버튼은 실제 대학 상세로 이동합니다.
          - 전역 클릭 캡처, MutationObserver, DOM 텍스트 후처리는 사용하지 않습니다.
          '@
          gh release create v0.82.39 UEP-update.zip sha256.txt --repo $env:GITHUB_REPOSITORY --title 'UEP v0.82.39' --notes $notes --target $env:GITHUB_SHA
          $policy=Get-Content uep-policy.json -Raw|ConvertFrom-Json
          $policy.latestVersion='0.82.39'
          $policy.downloadUrl='https://github.com/hkhsm00-k81c/UEP-Updates/releases/download/v0.82.39/UEP-update.zip'
          $policy.sha256=$sha
          $policy.message='UEP 0.82.39 · 오늘의 대학 상세 탐색 버튼 이벤트 연결 복구'
          $policy|ConvertTo-Json -Depth 10|Set-Content uep-policy.json -Encoding utf8
          @("UEP 0.82.39 RELEASE SUCCESS","base=v0.82.38","root-cause=unbound rendered university nav buttons","region/university/prev/next bindings=PASS","native-router=preserved","temporary-dom-click-patches=absent","sha256=$sha","size=$((Get-Item UEP-update.zip).Length)")|Set-Content release-08239-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uep-policy.json release-08239-status.txt
          git commit -m 'Publish UEP 0.82.39 university navigation bindings'
          git push origin HEAD:main
